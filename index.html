<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Exclusive Music Bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000;
    --surface: #111;
    --surface2: #1a1a1a;
    --surface3: #222;
    --text: #fff;
    --text2: rgba(255,255,255,0.6);
    --text3: rgba(255,255,255,0.35);
    --accent: #FFCC00;
    --radius: 12px;
    --mini-h: 72px;
    --nav-h: 58px;
    --header-h: 56px;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* ========== MAIN APP ========== */
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    position: relative;
    overflow: hidden;
  }

  /* ========== HEADER ========== */
  .header {
    height: var(--header-h);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 0 16px;
    position: relative;
    z-index: 10;
  }

  .header-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .header-logo svg {
    width: 28px;
    height: 28px;
  }

  /* ========== BLOB ========== */
  .blob-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 320px;
    height: 320px;
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .blob-container.visible {
    opacity: 1;
  }

  .blob {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    filter: blur(60px);
    animation: blob-breathe 4s ease-in-out infinite;
    transition: background 0.8s ease;
  }

  .blob-inner {
    position: absolute;
    inset: 30px;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.6;
    animation: blob-breathe 4s ease-in-out infinite reverse;
    transition: background 0.8s ease;
  }

  @keyframes blob-breathe {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.15); opacity: 0.8; }
  }

  /* ========== SCROLL AREA ========== */
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    position: relative;
    z-index: 1;
    padding-bottom: calc(var(--mini-h) + var(--nav-h) + 8px);
  }

  .scroll-area::-webkit-scrollbar { display: none; }

  /* ========== TABS ========== */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ========== SEARCH BAR ========== */
  .search-bar {
    padding: 12px 16px 8px;
    position: sticky;
    top: 0;
    z-index: 5;
    background: linear-gradient(to bottom, #000 70%, transparent);
  }

  .search-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-icon {
    position: absolute;
    left: 12px;
    color: var(--text3);
    font-size: 16px;
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    color: var(--text);
    font-size: 15px;
    padding: 10px 12px 10px 38px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input:focus {
    border-color: rgba(255,255,255,0.2);
  }

  .search-clear {
    position: absolute;
    right: 10px;
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    font-size: 11px;
    display: none;
  }

  /* ========== SECTION HEADER ========== */
  .section-header {
    padding: 16px 16px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .section-title {
    font-size: 18px;
    font-weight: 700;
  }

  .section-count {
    font-size: 13px;
    color: var(--text3);
  }

  /* ========== TRACK LIST ========== */
  .track-list {
    padding: 0 8px;
  }

  .track-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 8px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
    overflow: hidden;
  }

  .track-item:active {
    background: var(--surface2);
    transform: scale(0.98);
  }

  .track-item.playing {
    background: var(--surface2);
  }

  .track-cover {
    width: 50px;
    height: 50px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    transition: transform 0.3s ease;
  }

  .track-cover.spinning {
    animation: spin 4s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .track-cover .playing-indicator {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.4);
    border-radius: 10px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .track-item.playing .track-cover .playing-indicator {
    opacity: 1;
  }

  .playing-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 18px;
  }

  .playing-bars span {
    width: 3px;
    background: #fff;
    border-radius: 2px;
    animation: bar-dance 0.8s ease-in-out infinite;
  }

  .playing-bars span:nth-child(2) { animation-delay: 0.2s; }
  .playing-bars span:nth-child(3) { animation-delay: 0.1s; }

  @keyframes bar-dance {
    0%, 100% { height: 5px; }
    50% { height: 16px; }
  }

  .track-info {
    flex: 1;
    min-width: 0;
  }

  .track-title {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }

  .track-artist {
    font-size: 12px;
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    flex-shrink: 0;
  }

  .track-duration {
    font-size: 12px;
    color: var(--text3);
  }

  .track-like-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    border-radius: 50%;
    transition: transform 0.2s;
    padding: 0;
    line-height: 1;
  }

  .track-like-btn:active {
    transform: scale(1.3);
  }

  /* ========== EMPTY STATE ========== */
  .empty-state {
    padding: 60px 24px;
    text-align: center;
  }

  .empty-state-icon {
    font-size: 52px;
    margin-bottom: 16px;
    opacity: 0.5;
  }

  .empty-state-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 8px;
    opacity: 0.7;
  }

  .empty-state-text {
    font-size: 14px;
    color: var(--text3);
    line-height: 1.5;
  }

  /* ========== MINI PLAYER ========== */
  #mini-player {
    position: fixed;
    bottom: var(--nav-h);
    left: 0;
    right: 0;
    height: var(--mini-h);
    background: rgba(20,20,20,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    z-index: 50;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
    transform: translateY(100%);
    opacity: 0;
  }

  #mini-player.visible {
    transform: translateY(0);
    opacity: 1;
  }

  .mini-cover {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    transition: transform 0.3s;
  }

  .mini-cover.spinning {
    animation: spin 4s linear infinite;
  }

  .mini-info {
    flex: 1;
    min-width: 0;
  }

  .mini-title {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }

  .mini-artist {
    font-size: 11px;
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .mini-controls {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .mini-btn {
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border-radius: 50%;
    transition: background 0.15s, transform 0.1s;
    padding: 0;
    line-height: 1;
    color: var(--text);
  }

  .mini-btn:active { transform: scale(0.88); }

  .mini-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    background: rgba(255,255,255,0.15);
    width: 100%;
  }

  .mini-progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.5s linear;
  }

  /* ========== BOTTOM NAV ========== */
  #bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: var(--nav-h);
    background: rgba(12,12,12,0.97);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.07);
    display: flex;
    align-items: center;
    z-index: 60;
  }

  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 8px 0;
    color: var(--text3);
    transition: color 0.2s;
    font-size: 12px;
    font-weight: 500;
  }

  .nav-btn.active {
    color: var(--text);
  }

  .nav-btn .nav-icon {
    font-size: 22px;
    line-height: 1;
    transition: transform 0.2s;
  }

  .nav-btn.active .nav-icon {
    transform: scale(1.1);
  }

  /* ========== FULL PLAYER ========== */
  #full-player {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #000;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
  }

  #full-player.open {
    transform: translateY(0);
  }

  .fp-bg {
    position: absolute;
    inset: 0;
    transition: background 0.8s ease;
  }

  .fp-blob1, .fp-blob2 {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    animation: blob-breathe 5s ease-in-out infinite;
  }

  .fp-blob1 {
    width: 300px;
    height: 300px;
    top: -60px;
    left: -60px;
    opacity: 0.35;
  }

  .fp-blob2 {
    width: 250px;
    height: 250px;
    bottom: 60px;
    right: -40px;
    opacity: 0.25;
    animation-delay: -2s;
  }

  .fp-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 0;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }

  .fp-close-btn {
    width: 36px;
    height: 36px;
    border: none;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    font-size: 18px;
    transition: background 0.15s, transform 0.1s;
  }

  .fp-close-btn:active { transform: scale(0.9); }

  .fp-title-small {
    font-size: 14px;
    font-weight: 600;
    opacity: 0.7;
  }

  .fp-menu-btn {
    width: 36px;
    height: 36px;
    border: none;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    font-size: 18px;
    flex-direction: column;
    gap: 3px;
    padding: 0;
    transition: background 0.15s;
  }

  .fp-menu-btn span {
    width: 4px;
    height: 4px;
    background: currentColor;
    border-radius: 50%;
    display: block;
  }

  .fp-artwork-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
    padding: 0 20px;
    min-height: 0;
  }

  .fp-artwork {
    width: min(260px, 65vw);
    height: min(260px, 65vw);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(64px, 18vw, 90px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transition: background 0.6s ease, box-shadow 0.6s ease;
    flex-shrink: 0;
    position: relative;
  }

  .fp-artwork.spinning {
    animation: spin 6s linear infinite;
  }

  .fp-artwork::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.12);
  }

  .fp-info {
    padding: 0 24px;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }

  .fp-track-title {
    font-size: clamp(18px, 5vw, 22px);
    font-weight: 700;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .fp-track-artist {
    font-size: 15px;
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .fp-actions-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px 0;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }

  .fp-action-btn {
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    border-radius: 50%;
    transition: transform 0.15s, opacity 0.2s;
    padding: 0;
    line-height: 1;
    color: var(--text2);
  }

  .fp-action-btn:active { transform: scale(0.85); }
  .fp-action-btn.active { color: var(--text); opacity: 1; }

  /* ========== PROGRESS BAR ========== */
  .fp-progress-area {
    padding: 8px 24px 0;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }

  .progress-bar-track {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: #fff;
    border-radius: 4px;
    width: 0%;
    pointer-events: none;
    transition: width 0.3s linear;
  }

  .progress-times {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 11px;
    color: var(--text3);
    font-variant-numeric: tabular-nums;
  }

  /* ========== PLAYBACK CONTROLS ========== */
  .fp-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
    padding-bottom: max(12px, env(safe-area-inset-bottom, 12px));
  }

  .ctrl-btn {
    width: 44px;
    height: 44px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: transform 0.15s, opacity 0.2s;
    padding: 0;
    color: var(--text);
    font-size: 28px;
    line-height: 1;
    opacity: 0.7;
  }

  .ctrl-btn:active { transform: scale(0.88); }
  .ctrl-btn.active { opacity: 1; }

  .ctrl-play {
    width: 68px;
    height: 68px;
    background: #fff;
    border: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #000;
    font-size: 28px;
    transition: transform 0.15s, background 0.2s;
    box-shadow: 0 4px 20px rgba(255,255,255,0.2);
    flex-shrink: 0;
    line-height: 1;
    padding-left: 3px;
  }

  .ctrl-play:active { transform: scale(0.92); }

  .ctrl-play.paused {
    padding-left: 3px;
  }

  .ctrl-play.playing {
    padding-left: 0;
  }

  /* ========== TOAST ========== */
  #toast {
    position: fixed;
    bottom: calc(var(--mini-h) + var(--nav-h) + 16px);
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(40,40,40,0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,0.08);
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ========== GENRE PILL ========== */
  .genre-pills {
    display: flex;
    gap: 8px;
    padding: 4px 16px 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .genre-pills::-webkit-scrollbar { display: none; }

  .genre-pill {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.12);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
    color: var(--text2);
    background: transparent;
  }

  .genre-pill.active {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.3);
    color: var(--text);
  }
</style>
</head>
<body>

<div id="app">
  <!-- HEADER -->
  <div class="header">
    <div class="header-logo">
      <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="14" r="13" fill="#FFCC00" opacity="0.15"/>
        <path d="M10 8v10M14 6v12M18 9v8" stroke="#FFCC00" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span>EXCLUSIVE MUSIC BOT</span>
    </div>
  </div>

  <!-- BLOB BACKGROUND -->
  <div class="blob-container" id="blob-container">
    <div class="blob" id="blob-main"></div>
    <div class="blob-inner" id="blob-inner"></div>
  </div>

  <!-- SCROLL AREA -->
  <div class="scroll-area" id="scroll-area">

    <!-- TRACKS TAB -->
    <div class="tab-content active" id="tab-tracks">
      <div class="genre-pills" id="genre-pills">
        <div class="genre-pill active" data-genre="all">Все</div>
        <div class="genre-pill" data-genre="remix">Remix</div>
        <div class="genre-pill" data-genre="love">Love</div>
        <div class="genre-pill" data-genre="winter">Winter</div>
        <div class="genre-pill" data-genre="hiphop">Hip-Hop</div>
        <div class="genre-pill" data-genre="electronic">Electronic</div>
        <div class="genre-pill" data-genre="city">City</div>
      </div>
      <div class="section-header">
        <span class="section-title">Треки</span>
        <span class="section-count" id="tracks-count"></span>
      </div>
      <div class="track-list" id="tracks-list"></div>
    </div>

    <!-- SEARCH TAB -->
    <div class="tab-content" id="tab-search">
      <div class="search-bar">
        <div class="search-input-wrap">
          <span class="search-icon">🔍</span>
          <input class="search-input" type="text" placeholder="Поиск по трекам и артистам..." id="search-input" autocomplete="off" spellcheck="false">
          <button class="search-clear" id="search-clear">✕</button>
        </div>
      </div>
      <div class="section-header">
        <span class="section-title" id="search-title">Все треки</span>
        <span class="section-count" id="search-count"></span>

// ========== HELPERS ==========
function formatTime(sec) {
  if (!sec || isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function getColor(genre) {
  return GENRE_COLORS[genre] || GENRE_COLORS.default;
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function saveFavorites() {
  localStorage.setItem('em_favorites', JSON.stringify([...favorites]));
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ========== TRACK CARD ==========
function createTrackItem(track) {
  const color = getColor(track.genre);
  const isLiked = favorites.has(track.id);
  const isCurrentlyPlaying = currentTrackId === track.id;

  const el = document.createElement('div');
  el.className = 'track-item' + (isCurrentlyPlaying ? ' playing' : '');
  el.dataset.id = track.id;
  el.innerHTML = `
    <div class="track-cover ${isCurrentlyPlaying && isPlaying ? 'spinning' : ''}" style="background: linear-gradient(135deg, ${color}33, ${color}66)">
      <span>${track.emoji}</span>
      <div class="playing-indicator">
        <div class="playing-bars">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
    <div class="track-info">
      <div class="track-title">${track.title}</div>
      <div class="track-artist">${track.artist}</div>
    </div>
    <div class="track-right">
      <span class="track-duration">${formatTime(track.duration)}</span>
      <button class="track-like-btn" data-id="${track.id}" aria-label="Лайк">
        ${isLiked ? '❤️' : '🤍'}
      </button>
    </div>
  `;

  el.querySelector('.track-cover, .track-info, .track-duration').addEventListener('click', (e) => {
    e.stopPropagation();
    playTrack(track.id);
    openFullPlayer();
  });

  el.addEventListener('click', (e) => {
    if (!e.target.closest('.track-like-btn')) {
      playTrack(track.id);
      openFullPlayer();
    }
  });

  el.querySelector('.track-like-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleLike(track.id);
  });

  return el;
}

// ========== RENDER LISTS ==========
function renderTracksList() {
  const list = document.getElementById('tracks-list');
  let filtered = currentGenreFilter === 'all' ? TRACKS : TRACKS.filter(t => t.genre === currentGenreFilter);
  list.innerHTML = '';
  filtered.forEach(t => list.appendChild(createTrackItem(t)));
  document.getElementById('tracks-count').textContent = filtered.length + ' треков';
}

function renderSearchList() {
  const q = searchQuery.toLowerCase().trim();
  const list = document.getElementById('search-list');
  const empty = document.getElementById('search-empty');
  const title = document.getElementById('search-title');
  const count = document.getElementById('search-count');
  const clear = document.getElementById('search-clear');

  let results = q
    ? TRACKS.filter(t => t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q))
    : TRACKS;

  list.innerHTML = '';
  if (q) {
    title.textContent = `Результаты: «${q}»`;
    clear.style.display = 'flex';
  } else {
    title.textContent = 'Все треки';
    clear.style.display = 'none';
  }

  if (results.length === 0) {
    empty.style.display = 'block';
    list.style.display = 'none';
    count.textContent = '';
  } else {
    empty.style.display = 'none';
    list.style.display = 'block';
    count.textContent = results.length + ' треков';
    results.forEach(t => list.appendChild(createTrackItem(t)));
  }
}

function renderFavoritesList() {
  const list = document.getElementById('fav-list');
  const empty = document.getElementById('fav-empty');
  const count = document.getElementById('fav-count');
  const favTracks = TRACKS.filter(t => favorites.has(t.id));
  list.innerHTML = '';
  if (favTracks.length === 0) {
    empty.style.display = 'block';
    list.style.display = 'none';
    count.textContent = '';
  } else {
    empty.style.display = 'none';
    list.style.display = 'block';
    count.textContent = favTracks.length + ' треков';
    favTracks.forEach(t => list.appendChild(createTrackItem(t)));
  }
}

function renderAll() {
  renderTracksList();
  renderSearchList();
  renderFavoritesList();
}

// ========== PLAY LOGIC ==========
function playTrack(trackId) {
  const track = TRACKS.find(t => t.id === trackId);
  if (!track) return;

  const wasPlaying = currentTrackId === trackId && isPlaying;
  if (wasPlaying) return;

  currentTrackId = trackId;
  isPlaying = false;

  // Set blob color
  const color = getColor(track.genre);
  updateBlobColor(color);

  // Update mini player
  miniPlayer.classList.add('visible');
  miniTitle.textContent = track.title;
  miniArtist.textContent = track.artist;
  miniCover.textContent = track.emoji;
  miniCover.style.background = `linear-gradient(135deg, ${color}40, ${color}80)`;
  miniCover.style.borderRadius = '10px';
  updateLikeBtn(track.id);

  // Update full player
  fpArtwork.textContent = track.emoji;
  fpArtwork.style.background = `radial-gradient(circle at 40% 35%, ${color}88, ${color}33)`;
  fpArtwork.style.boxShadow = `0 20px 60px ${color}44`;
  fpTitle.textContent = track.title;
  fpArtist.textContent = track.artist;
  updateLikeBtn(track.id);

  // Load audio
  audioEl.src = PROXY_URL + '/audio/' + encodeURIComponent(track.file_id);
  audioEl.load();
  audioEl.play().then(() => {
    isPlaying = true;
    updatePlayState();
    updateAllCards();
  }).catch(err => {
    console.error('Audio play error:', err);
    showToast('Не удалось загрузить трек');
  });

  // Show blob on main screen
  blobContainer.classList.add('visible');
  updateAllCards();
}

function togglePlayPause() {
  if (!currentTrackId) return;
  if (isPlaying) {
    audioEl.pause();
    isPlaying = false;
  } else {
    audioEl.play().then(() => { isPlaying = true; updatePlayState(); }).catch(() => {});
  }
  updatePlayState();
  updateAllCards();
}

function playNext() {
  if (!currentTrackId) return;
  const list = getPlayQueue();
  const idx = list.findIndex(t => t.id === currentTrackId);
  const next = list[(idx + 1) % list.length];
  if (next) playTrack(next.id);
}

function playPrev() {
  if (!currentTrackId) return;
  if (audioEl.currentTime > 3) {
    audioEl.currentTime = 0;
    return;
  }
  const list = getPlayQueue();
  const idx = list.findIndex(t => t.id === currentTrackId);
  const prev = list[(idx - 1 + list.length) % list.length];
  if (prev) playTrack(prev.id);
}

function getPlayQueue() {
  if (isShuffle) {
    return [...queue].sort(() => Math.random() - 0.5);
  }
  return TRACKS;
}

function updatePlayState() {
  // Mini player
  miniPlayBtn.textContent = isPlaying ? '⏸' : '▶️';
  miniCover.classList.toggle('spinning', isPlaying);

  // Full player
  ctrlPlay.textContent = isPlaying ? '⏸' : '▶';
  ctrlPlay.classList.toggle('playing', isPlaying);
  ctrlPlay.classList.toggle('paused', !isPlaying);
  fpArtwork.classList.toggle('spinning', isPlaying);
}

function updateAllCards() {
  // Update track items in all lists
  document.querySelectorAll('.track-item').forEach(item => {
    const id = parseInt(item.dataset.id);
    const isActive = id === currentTrackId;
    item.classList.toggle('playing', isActive);
    const cover = item.querySelector('.track-cover');
    if (cover) cover.classList.toggle('spinning', isActive && isPlaying);
  });
}

function updateLikeBtn(trackId) {
  const liked = favorites.has(trackId);
  if (miniLikeBtn) miniLikeBtn.textContent = liked ? '❤️' : '🤍';
  if (fpLikeBtn) fpLikeBtn.textContent = liked ? '❤️' : '🤍';
  if (fpLikeBtn) fpLikeBtn.classList.toggle('active', liked);
}

function toggleLike(trackId) {
  if (favorites.has(trackId)) {
    favorites.delete(trackId);
    showToast('Удалено из любимых');
  } else {
    favorites.add(trackId);
    showToast('Добавлено в любимые ❤️');
  }
  saveFavorites();
  updateLikeBtn(trackId);
  renderFavoritesList();
  // Update like buttons in track lists
  document.querySelectorAll(`.track-like-btn[data-id="${trackId}"]`).forEach(btn => {
    btn.textContent = favorites.has(trackId) ? '❤️' : '🤍';
  });
}

// ========== BLOB COLOR ==========
function updateBlobColor(color) {
  blobMain.style.background = `radial-gradient(circle, ${color}88, ${color}22)`;
  blobInner.style.background = color;
  fpBlob1.style.background = color;
  fpBlob2.style.background = color;
}

// ========== FULL PLAYER ==========
function openFullPlayer() {
  fullPlayer.classList.add('open');
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.expand();
  }
}

function closeFullPlayer() {
  fullPlayer.classList.remove('open');
}

// ========== PROGRESS BAR ==========
audioEl.addEventListener('timeupdate', () => {
  if (!audioEl.duration) return;
  const pct = (audioEl.currentTime / audioEl.duration) * 100;
  progressBarFill.style.width = pct + '%';
  miniProgressFill.style.width = pct + '%';
  timeCurrent.textContent = formatTime(audioEl.currentTime);
  timeTotal.textContent = formatTime(audioEl.duration);
});

audioEl.addEventListener('ended', () => {
  if (isRepeat) {
    audioEl.currentTime = 0;
    audioEl.play();
  } else {
    playNext();
  }
});

audioEl.addEventListener('play', () => {
  isPlaying = true;
  updatePlayState();
  updateAllCards();
});

audioEl.addEventListener('pause', () => {
  isPlaying = false;
  updatePlayState();
  updateAllCards();
});

progressBarTrack.addEventListener('click', (e) => {
  const rect = progressBarTrack.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  if (audioEl.duration) {
    audioEl.currentTime = pct * audioEl.duration;
  }
});

// Touch seek
let isSeeking = false;
progressBarTrack.addEventListener('touchstart', (e) => {
  isSeeking = true;
  e.preventDefault();
}, { passive: false });

progressBarTrack.addEventListener('touchmove', (e) => {
  if (!isSeeking) return;
  const touch = e.touches[0];
  const rect = progressBarTrack.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (touch.clientX - rect.left) / rect.width));
  if (audioEl.duration) {
    audioEl.currentTime = pct * audioEl.duration;
  }
  e.preventDefault();
}, { passive: false });

progressBarTrack.addEventListener('touchend', () => { isSeeking = false; });

// ========== CONTROLS ==========
ctrlPlay.addEventListener('click', togglePlayPause);
miniPlayBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlayPause(); });
document.getElementById('ctrl-prev').addEventListener('click', playPrev);
document.getElementById('ctrl-next').addEventListener('click', playNext);
document.getElementById('fp-close').addEventListener('click', closeFullPlayer);

miniPlayer.addEventListener('click', () => {
  if (currentTrackId) openFullPlayer();
});

miniLikeBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (currentTrackId) toggleLike(currentTrackId);
});

fpLikeBtn.addEventListener('click', () => {
  if (currentTrackId) toggleLike(currentTrackId);
});

fpShuffleBtn.addEventListener('click', () => {
  isShuffle = !isShuffle;
  fpShuffleBtn.classList.toggle('active', isShuffle);
  fpShuffleBtn.style.opacity = isShuffle ? '1' : '0.5';
  showToast(isShuffle ? 'Перемешивание включено' : 'Перемешивание выключено');
});

fpRepeatBtn.addEventListener('click', () => {
  isRepeat = !isRepeat;
  fpRepeatBtn.classList.toggle('active', isRepeat);
  fpRepeatBtn.style.opacity = isRepeat ? '1' : '0.5';
  showToast(isRepeat ? 'Повтор включён' : 'Повтор выключен');
});

// Swipe to close full player
let touchStartY = 0;
fullPlayer.addEventListener('touchstart', (e) => {
  touchStartY = e.touches[0].clientY;
}, { passive: true });

fullPlayer.addEventListener('touchend', (e) => {
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (dy > 80) closeFullPlayer();
}, { passive: true });

// ========== NAVIGATION ==========
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    switchTab(tab);
  });
});

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');

  if (tab === 'favorites') renderFavoritesList();
  if (tab === 'search') {
    document.getElementById('search-input').focus();
  }
}

// ========== SEARCH ==========
const searchInput = document.getElementById('search-input');
searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value;
  renderSearchList();
});

document.getElementById('search-clear').addEventListener('click', () => {
  searchInput.value = '';
  searchQuery = '';
  renderSearchList();
  searchInput.focus();
});

// ========== GENRE FILTER ==========
document.querySelectorAll('.genre-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.genre-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    currentGenreFilter = pill.dataset.genre;
    renderTracksList();
  });
});

// ========== TELEGRAM WEBAPP ==========
if (window.Telegram && window.Telegram.WebApp) {
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#000000');
  tg.setBackgroundColor('#000000');
}

// ========== INIT ==========
renderAll();
</script>
</body>
</html>
