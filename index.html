<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0e15" />
  <title>EXCLUSIVE MUSIC BOT</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Fonts -->
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />

  <style>
    /* ===== DESIGN TOKENS ===== */
    :root {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --text-2xl: clamp(2rem, 1.2rem + 2.5vw, 3.5rem);

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;

      --radius-sm: 0.375rem;
      --radius-md: 0.75rem;
      --radius-lg: 1.25rem;
      --radius-xl: 1.75rem;
      --radius-full: 9999px;

      --transition-fast: 140ms cubic-bezier(0.16, 1, 0.3, 1);
      --transition-interactive: 220ms cubic-bezier(0.16, 1, 0.3, 1);
      --transition-slow: 400ms cubic-bezier(0.16, 1, 0.3, 1);

      --font-display: 'Clash Display', 'SF Pro Display', sans-serif;
      --font-body: 'Satoshi', 'SF Pro Text', sans-serif;
    }

    /* ===== DARK THEME ===== */
    [data-theme="dark"] {
      --color-bg: #0f0e15;
      --color-surface: #16151f;
      --color-surface-2: #1d1c28;
      --color-surface-3: #242333;
      --color-border: #2e2c42;
      --color-text: #e8e6f0;
      --color-text-muted: #8b89a0;
      --color-text-faint: #4e4c62;

      --color-accent: #7c5cfc;
      --color-accent-bright: #9d7eff;
      --color-accent-hover: #6b4aeb;
      --color-accent-glow: rgba(124, 92, 252, 0.25);
      --color-accent-highlight: rgba(124, 92, 252, 0.12);

      --color-pink: #fc5ca8;
      --color-pink-glow: rgba(252, 92, 168, 0.2);

      --color-green: #3ec97b;
      --color-green-dim: rgba(62, 201, 123, 0.15);

      --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.6);
      --shadow-glow: 0 0 40px var(--color-accent-glow), 0 0 80px rgba(124, 92, 252, 0.1);
    }

    /* ===== LIGHT THEME ===== */
    [data-theme="light"] {
      --color-bg: #f0eeff;
      --color-surface: #ffffff;
      --color-surface-2: #f5f3ff;
      --color-surface-3: #ede9ff;
      --color-border: #d8d3f5;
      --color-text: #1a1830;
      --color-text-muted: #6b6690;
      --color-text-faint: #b0adc8;

      --color-accent: #6b4aeb;
      --color-accent-bright: #7c5cfc;
      --color-accent-hover: #5a39d6;
      --color-accent-glow: rgba(107, 74, 235, 0.2);
      --color-accent-highlight: rgba(107, 74, 235, 0.1);

      --color-pink: #e0457f;
      --color-pink-glow: rgba(224, 69, 127, 0.15);

      --color-green: #1fa85a;
      --color-green-dim: rgba(31, 168, 90, 0.12);

      --shadow-sm: 0 1px 3px rgba(100,90,200,0.1);
      --shadow-md: 0 4px 16px rgba(100,90,200,0.12);
      --shadow-lg: 0 12px 40px rgba(100,90,200,0.15);
      --shadow-glow: 0 0 40px var(--color-accent-glow);
    }

    /* ===== BASE ===== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      scroll-behavior: smooth;
      overscroll-behavior: none;
    }

    body {
      min-height: 100dvh;
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--color-text);
      background-color: var(--color-bg);
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    img, svg { display: block; max-width: 100%; }
    button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
    input { font: inherit; color: inherit; }

    a, button, [role="button"] {
      transition: color var(--transition-fast), background var(--transition-fast),
        opacity var(--transition-fast), transform var(--transition-fast),
        box-shadow var(--transition-fast);
    }

    :focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 3px;
      border-radius: var(--radius-sm);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ===== APP LAYOUT ===== */
    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-5);
      padding-top: max(var(--space-4), env(safe-area-inset-top));
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--color-accent), var(--color-pink));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px var(--color-accent-glow);
    }

    .logo-text {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(0.75rem, 3.2vw, 1.15rem);
      letter-spacing: 0.04em;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--color-accent-bright), var(--color-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      flex-shrink: 0;
    }

    .icon-btn:hover {
      color: var(--color-text);
      background: var(--color-surface-3);
    }

    .icon-btn:active { transform: scale(0.92); }

    /* ===== SEARCH ===== */
    .search-wrap {
      padding: 0 var(--space-5) var(--space-4);
      flex-shrink: 0;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      padding: var(--space-3) var(--space-5);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .search-box:focus-within {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-highlight);
    }

    .search-box svg { color: var(--color-text-muted); flex-shrink: 0; }

    .search-box input {
      border: none;
      outline: none;
      background: transparent;
      flex: 1;
      font-size: var(--text-sm);
      color: var(--color-text);
    }

    .search-box input::placeholder { color: var(--color-text-faint); }

    .search-clear {
      color: var(--color-text-muted);
      padding: var(--space-1);
      border-radius: var(--radius-full);
      display: none;
    }
    .search-clear:hover { color: var(--color-text); }
    .search-clear.visible { display: flex; }

    /* ===== TABS ===== */
    .tabs {
      display: flex;
      padding: 0 var(--space-5) var(--space-4);
      gap: var(--space-2);
      flex-shrink: 0;
    }

    .tab-btn {
      font-size: var(--text-sm);
      font-weight: 500;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-muted);
      transition: all var(--transition-fast);
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: #fff;
      box-shadow: 0 4px 12px var(--color-accent-glow);
    }

    .tab-btn:hover:not(.active) {
      color: var(--color-text);
      border-color: var(--color-accent);
    }

    /* ===== TRACK LIST ===== */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 0 var(--space-5);
      padding-bottom: calc(var(--space-4) + 180px);
      overscroll-behavior: contain;
      scroll-behavior: smooth;
    }

    .scroll-area::-webkit-scrollbar { width: 3px; }
    .scroll-area::-webkit-scrollbar-track { background: transparent; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: var(--radius-full); }

    .section-label {
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-text-faint);
      margin-bottom: var(--space-3);
      padding-top: var(--space-4);
    }

    /* ===== GENRE CHIPS ===== */
    .genre-row {
      display: flex;
      gap: var(--space-2);
      overflow-x: auto;
      padding-bottom: var(--space-3);
      scrollbar-width: none;
      margin-bottom: var(--space-2);
    }
    .genre-row::-webkit-scrollbar { display: none; }

    .genre-chip {
      font-size: var(--text-xs);
      font-weight: 600;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-muted);
      white-space: nowrap;
      transition: all var(--transition-fast);
      letter-spacing: 0.04em;
    }

    .genre-chip.active {
      border-color: var(--color-accent);
      background: var(--color-accent-highlight);
      color: var(--color-accent-bright);
    }
    .genre-chip:hover:not(.active) {
      border-color: var(--color-accent);
      color: var(--color-text);
    }

    /* ===== TRACK CARD ===== */
    .track-list { display: flex; flex-direction: column; gap: var(--space-2); }

    .track-card {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-4);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all var(--transition-fast);
      position: relative;
      overflow: hidden;
    }

    .track-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--color-accent-highlight), transparent);
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .track-card:hover { border-color: var(--color-accent); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .track-card:hover::before { opacity: 1; }
    .track-card:active { transform: scale(0.98); }

    .track-card.playing {
      border-color: var(--color-accent);
      background: var(--color-surface-2);
      box-shadow: 0 0 0 1px var(--color-accent), var(--shadow-md);
    }

    .track-card.playing::before { opacity: 1; }

    .track-cover {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, var(--color-surface-3), var(--color-border));
    }

    .cover-art {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .cover-bars {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 2px;
      padding: 6px;
      background: rgba(0,0,0,0.5);
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .track-card.playing .cover-bars { opacity: 1; }

    .bar {
      width: 4px;
      background: var(--color-accent-bright);
      border-radius: 2px;
      animation: bounce var(--dur, 0.8s) ease-in-out infinite alternate;
    }
    .bar:nth-child(1) { --dur: 0.6s; animation-delay: 0s; }
    .bar:nth-child(2) { --dur: 0.8s; animation-delay: 0.1s; }
    .bar:nth-child(3) { --dur: 0.7s; animation-delay: 0.05s; }
    .bar:nth-child(4) { --dur: 0.9s; animation-delay: 0.15s; }

    @keyframes bounce {
      from { height: 4px; }
      to { height: 24px; }
    }

    .track-card.paused .bar { animation-play-state: paused; }

    .track-info { flex: 1; min-width: 0; }

    .track-title {
      font-weight: 600;
      font-size: var(--text-sm);
      color: var(--color-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .track-card.playing .track-title { color: var(--color-accent-bright); }

    .track-artist {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-meta {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      flex-shrink: 0;
    }

    .track-duration {
      font-size: var(--text-xs);
      color: var(--color-text-faint);
      font-variant-numeric: tabular-nums;
    }

    .track-like {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      transition: all var(--transition-fast);
    }

    .track-like:hover { color: var(--color-pink); transform: scale(1.15); }
    .track-like.liked { color: var(--color-pink); }
    .track-like.liked svg { fill: var(--color-pink); }

    /* ===== EMPTY / NO RESULTS ===== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-12) var(--space-8);
      gap: var(--space-4);
      text-align: center;
    }

    .empty-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--color-surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .empty-title {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 600;
    }

    .empty-desc {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      max-width: 260px;
    }

    /* ===== PLAYER (BOTTOM) ===== */
    .player-wrap {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      padding: var(--space-3) var(--space-4);
      padding-bottom: max(var(--space-4), env(safe-area-inset-bottom));
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 100;
      transition: transform var(--transition-slow), opacity var(--transition-slow);
    }

    .player-wrap.hidden {
      transform: translateX(-50%) translateY(120%);
      opacity: 0;
      pointer-events: none;
    }

    /* Glow behind player */
    .player-wrap::before {
      content: '';
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 40px;
      background: radial-gradient(ellipse, var(--color-accent-glow) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Mini player (collapsed) */
    .mini-player {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      cursor: pointer;
      margin-bottom: var(--space-3);
      padding: var(--space-2) var(--space-3);
      background: var(--color-surface-2);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      transition: background var(--transition-fast);
    }
    .mini-player:hover { background: var(--color-surface-3); }

    .mini-cover {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--color-accent), var(--color-pink));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
      box-shadow: 0 4px 12px var(--color-accent-glow);
      animation: spin-slow 8s linear infinite;
      animation-play-state: paused;
    }

    .mini-cover.spinning { animation-play-state: running; }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .mini-info { flex: 1; min-width: 0; }

    .mini-title {
      font-weight: 600;
      font-size: var(--text-sm);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--color-accent-bright);
    }

    .mini-artist {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }

    /* Progress bar (mini) */
    .progress-mini {
      width: 100%;
      height: 3px;
      background: var(--color-border);
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-top: var(--space-2);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--color-accent), var(--color-pink));
      border-radius: var(--radius-full);
      transition: width 0.5s linear;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-4);
    }

    .ctrl-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      color: var(--color-text-muted);
      transition: all var(--transition-fast);
    }

    .ctrl-btn:hover { color: var(--color-text); transform: scale(1.1); }
    .ctrl-btn:active { transform: scale(0.9); }

    .ctrl-btn.primary {
      width: 54px;
      height: 54px;
      background: var(--color-accent);
      color: #fff;
      box-shadow: 0 4px 20px var(--color-accent-glow);
    }

    .ctrl-btn.primary:hover {
      background: var(--color-accent-hover);
      transform: scale(1.06);
      box-shadow: 0 6px 28px var(--color-accent-glow);
    }

    .ctrl-btn.active { color: var(--color-accent-bright); }

    /* ===== QUEUE PANEL ===== */
    .queue-panel {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--transition-slow);
    }

    .queue-panel.open {
      pointer-events: all;
      opacity: 1;
    }

    .queue-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .queue-sheet {
      position: relative;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      max-height: 75dvh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform var(--transition-slow);
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }

    .queue-panel.open .queue-sheet {
      transform: translateY(0);
    }

    .queue-handle {
      width: 40px;
      height: 4px;
      background: var(--color-border);
      border-radius: var(--radius-full);
      margin: var(--space-3) auto var(--space-4);
      flex-shrink: 0;
    }

    .queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-5) var(--space-4);
      flex-shrink: 0;
    }

    .queue-title {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 700;
    }

    .queue-count {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      background: var(--color-surface-3);
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
    }

    .queue-list {
      overflow-y: auto;
      padding: 0 var(--space-4);
      padding-bottom: max(var(--space-8), env(safe-area-inset-bottom));
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .queue-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    .queue-item:hover { background: var(--color-surface-2); }

    .queue-num {
      width: 24px;
      font-size: var(--text-xs);
      color: var(--color-text-faint);
      text-align: center;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .queue-item.current .queue-num { color: var(--color-accent-bright); font-weight: 700; }

    .queue-cover {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      background: var(--color-surface-3);
      flex-shrink: 0;

    .queue-info { flex: 1; min-width: 0; }

    .queue-name {
      font-size: var(--text-sm);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .queue-item.current .queue-name { color: var(--color-accent-bright); font-weight: 600; }

    .queue-artist-text {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }

    .queue-dur {
      font-size: var(--text-xs);
      color: var(--color-text-faint);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* ===== VISUALIZER ===== */
    .visualizer {
      height: 40px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 2px;
      margin-bottom: var(--space-2);
      overflow: hidden;
    }

    .viz-bar {
      width: 3px;
      background: linear-gradient(0deg, var(--color-accent), var(--color-pink));
      border-radius: 2px;
      opacity: 0.6;
      animation: viz var(--d, 0.8s) ease-in-out infinite alternate;
      animation-play-state: paused;
    }

    .viz-bar.active { animation-play-state: running; opacity: 1; }

    @keyframes viz {
      from { height: 4px; }
      to { height: var(--h, 30px); }
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      top: max(var(--space-10), env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: var(--color-surface-3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      padding: var(--space-3) var(--space-5);
      font-size: var(--text-sm);
      font-weight: 500;
      z-index: 500;
      white-space: nowrap;
      box-shadow: var(--shadow-lg);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s;
      opacity: 0;
      pointer-events: none;
    }

    .toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ===== FADE IN ANIMATION ===== */
    .track-card {
      animation: fadeUp 0.3s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }

      { id:167, msg_id:189, title:"Over Over exclusive music remix", artist:"Swanky Tunes", genre:"remix", duration:180, emoji:"🔥", file_id:"CQACAgIAAx0Ca5esqQACAVZp26epy2dm_oKEEG96bzcXeZdsYAACtYAAAp9UIEj449eVSWdQWDsE", plays:2371 },
      { id:168, msg_id:190, title:"Life Is a Party exclusive music remix", artist:"MAGES", genre:"remix", duration:170, emoji:"🔥", file_id:"CQACAgIAAx0Ca5esqQACAVhp26erd-99fqocsuEIiwMN15m_ggACx4AAAp9UIEizPgzob-1zUDsE", plays:2384 },
      { id:169, msg_id:191, title:"The Next Episode exclusive music remix", artist:"VOLB3X", genre:"remix", duration:240, emoji:"🔥", file_id:"CQACAgIAAx0Ca5esqQACAVlp26eOw9axUwtBHuOByEBlQfkwNgACbH8AAoN7IUjWjGK4sh39oTsE", plays:2397 },
      { id:170, msg_id:192, title:"Maria, Maria exclusive music remix", artist:"Mari Ferrari, Miss Mary", genre:"remix", duration:210, emoji:"🔥", file_id:"CQACAgIAAx0Ca5esqQACAVpp26es9J44ov0EiAYtNnqBH-VKHwAC838AApsMAUifnzD62rmJvjsE", plays:2410 }
    ];

    // ===== STATE =====
    const state = {
      currentIndex: -1,
      isPlaying: false,
      isShuffled: false,
      repeatMode: 0, // 0=off, 1=all, 2=one
      likedIds: new Set([4, 7, 15]),
      recentIds: [15, 9, 3, 7],
      currentTab: 'all',
      currentGenre: 'all',
      searchQuery: '',
      progress: 0,
      progressTimer: null,
      queue: [],
      filteredTracks: [],
      toastTimer: null,
    };

    // ===== DOM =====
    const $ = id => document.getElementById(id);
    const trackList = $('track-list');
    const emptyState = $('empty-state');
    const playerWrap = $('player-wrap');
    const miniTitle = $('mini-title');
    const miniArtist = $('mini-artist');
    const miniCover = $('mini-cover');
    const miniLike = $('mini-like');
    const progressFill = $('progress-fill');
    const playIcon = $('play-icon');
    const queuePanel = $('queue-panel');
    const queueList = $('queue-list');
    const queueCount = $('queue-count');
    const visualizer = $('visualizer');
    const toast = $('toast');
    const listLabel = $('list-label');

    // ===== VISUALIZER =====
    const VIZ_BARS = 28;
    const vizBars = [];
    for (let i = 0; i < VIZ_BARS; i++) {
      const b = document.createElement('div');
      b.className = 'viz-bar';
      const h = Math.floor(Math.random() * 26) + 6;
      const d = (Math.random() * 0.6 + 0.5).toFixed(2);
      b.style.setProperty('--h', h + 'px');
      b.style.setProperty('--d', d + 's');
      b.style.animationDelay = (Math.random() * 0.3) + 's';
      visualizer.appendChild(b);
      vizBars.push(b);
    }

    function setVizActive(on) {
      vizBars.forEach(b => {
        if (on) b.classList.add('active');
        else b.classList.remove('active');
      });
    }

    // ===== FILTER / RENDER =====
    function getFilteredTracks() {
      let tracks = TRACKS.slice();

      if (state.currentTab === 'liked') {
        tracks = tracks.filter(t => state.likedIds.has(t.id));
      } else if (state.currentTab === 'recent') {
        tracks = state.recentIds.map(id => TRACKS.find(t => t.id === id)).filter(Boolean);
      }

      if (state.currentGenre !== 'all') {
        tracks = tracks.filter(t => t.genre === state.currentGenre);
      }

      if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        tracks = tracks.filter(t =>
          t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q)
        );
      }

      return tracks;
    }

    function formatDur(s) {
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function renderTracks() {
      state.filteredTracks = getFilteredTracks();
      const tracks = state.filteredTracks;

      // Label
      const labels = { all: 'Все треки', liked: 'Любимые', recent: 'Недавние' };
      listLabel.textContent = labels[state.currentTab] || 'Треки';

      trackList.innerHTML = '';
      if (tracks.length === 0) {
        emptyState.style.display = 'flex';
        return;
      }
      emptyState.style.display = 'none';

      const currentTrack = state.currentIndex >= 0 ? state.queue[state.currentIndex] : null;

      tracks.forEach((t, i) => {
        const isPlaying = currentTrack && currentTrack.id === t.id && state.isPlaying;
        const isCurrent = currentTrack && currentTrack.id === t.id;
        const isLiked = state.likedIds.has(t.id);

        const card = document.createElement('div');
        card.className = `track-card${isCurrent ? (state.isPlaying ? ' playing' : ' paused') : ''}`;
        card.style.animationDelay = (i * 0.04) + 's';
        card.setAttribute('role', 'listitem');
        card.setAttribute('data-id', t.id);
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', `${t.title} — ${t.artist}`);

        card.innerHTML = `
          <div class="track-cover">
            <div class="cover-art">${t.emoji}</div>
            <div class="cover-bars" aria-hidden="true">
              <div class="bar"></div><div class="bar"></div>
              <div class="bar"></div><div class="bar"></div>
            </div>
          </div>
          <div class="track-info">
            <div class="track-title">${t.title}</div>
            <div class="track-artist">${t.artist}</div>
          </div>
          <div class="track-meta">
            <div class="track-duration">${formatDur(t.duration)}</div>
            <button class="track-like${isLiked ? ' liked' : ''}" aria-label="${isLiked ? 'Убрать из любимых' : 'В любимые'}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </button>
          </div>
        `;

        card.addEventListener('click', (e) => {
          if (e.target.closest('.track-like')) return;
          playTrack(t);
        });

        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); playTrack(t); }
        });

        card.querySelector('.track-like').addEventListener('click', (e) => {
          e.stopPropagation();
          toggleLike(t.id);
        });

        trackList.appendChild(card);
      });
    }

    // ===== LIKE =====
    function toggleLike(id) {
      if (state.likedIds.has(id)) {
        state.likedIds.delete(id);
        showToast('Удалено из любимых');
      } else {
        state.likedIds.add(id);
        showToast('❤️ Добавлено в любимые');
      }
      renderTracks();
      updateMiniLike();
    }

    function updateMiniLike() {
      if (state.currentIndex < 0) return;
      const t = state.queue[state.currentIndex];
      if (!t) return;
      const liked = state.likedIds.has(t.id);
      miniLike.className = 'track-like' + (liked ? ' liked' : '');
      miniLike.querySelector('svg').setAttribute('fill', liked ? 'currentColor' : 'none');
    }

    // ===== PLAY =====
    function buildQueue(startTrack) {
      let pool = state.filteredTracks.length > 0 ? state.filteredTracks : TRACKS;
      if (state.isShuffled) {
        pool = [...pool].sort(() => Math.random() - 0.5);
        // Move startTrack to front
        const idx = pool.findIndex(t => t.id === startTrack.id);
        if (idx > -1) { pool.splice(idx, 1); pool.unshift(startTrack); }
      }
      state.queue = pool;
      state.currentIndex = pool.findIndex(t => t.id === startTrack.id);
      if (state.currentIndex < 0) state.currentIndex = 0;
    }

    function playTrack(track) {
      // Check if same track — toggle play/pause
      const curTrack = state.currentIndex >= 0 ? state.queue[state.currentIndex] : null;
      if (curTrack && curTrack.id === track.id) {
        togglePlayPause();
        return;
      }

      buildQueue(track);
      startPlaying();

      // Add to recent
      state.recentIds = [track.id, ...state.recentIds.filter(id => id !== track.id)].slice(0, 10);
    }

    // ===== HTML5 AUDIO ENGINE =====
    const audioEl = new Audio();
    audioEl.preload = 'none';

    audioEl.addEventListener('timeupdate', () => {
      if (!audioEl.duration) return;
      state.progress = audioEl.currentTime * 1000;
      const pct = (audioEl.currentTime / audioEl.duration) * 100;
      progressFill.style.width = pct + '%';
    });

    audioEl.addEventListener('ended', () => {
      onTrackEnd();
    });

    audioEl.addEventListener('error', (e) => {
      console.warn('Audio error:', e);
      showToast('Ошибка загрузки — переключаю...');
      setTimeout(() => onTrackEnd(), 1500);
    });

    audioEl.addEventListener('waiting', () => {
      showToast('⏳ Загрузка...');
    });

    audioEl.addEventListener('playing', () => {
      state.isPlaying = true;
      updatePlayIcon();
      miniCover.classList.add('spinning');
      setVizActive(true);
    });

    audioEl.addEventListener('pause', () => {
      miniCover.classList.remove('spinning');
      setVizActive(false);
    });

    function startPlaying() {
      const t = state.queue[state.currentIndex];
      if (!t) return;

      state.isPlaying = true;
      state.progress = 0;
      clearInterval(state.progressTimer);

      // Update player UI
      playerWrap.classList.remove('hidden');
      miniTitle.textContent = t.title;
      miniArtist.textContent = t.artist;
      miniCover.textContent = t.emoji;
      miniCover.classList.add('spinning');
      progressFill.style.width = '0%';

      updatePlayIcon();
      updateMiniLike();
      setVizActive(true);
      renderTracks();
      renderQueue();

      // Реальное воспроизведение через прокси
      if (t.file_id && window.PROXY_URL) {
        audioEl.src = window.PROXY_URL + '/audio/' + encodeURIComponent(t.file_id);
        audioEl.load();
        audioEl.play().catch(err => {
          console.warn('Play error:', err);
          showToast('Нажмите ещё раз для воспроизведения');
        });
      } else {
        // Fallback — симуляция прогресса если прокси не настроен
        const totalMs = t.duration * 1000;
        const interval = 500;
        state.progressTimer = setInterval(() => {
          if (!state.isPlaying) return;
          state.progress = Math.min(state.progress + interval, totalMs);
          const pct = (state.progress / totalMs) * 100;
          progressFill.style.width = pct + '%';
          if (state.progress >= totalMs) {
            clearInterval(state.progressTimer);
            onTrackEnd();
          }
        }, interval);
      }
    }

    function onTrackEnd() {
      if (state.repeatMode === 2) { // repeat one
        state.progress = 0;
        startPlaying();
      } else if (state.currentIndex < state.queue.length - 1) {
        state.currentIndex++;
        startPlaying();
      } else if (state.repeatMode === 1) { // repeat all
        state.currentIndex = 0;
        startPlaying();
      } else {
        // End of queue
        state.isPlaying = false;
        miniCover.classList.remove('spinning');
        setVizActive(false);
        updatePlayIcon();
        renderTracks();
      }
    }

    function togglePlayPause() {
      if (state.currentIndex < 0) return;
      state.isPlaying = !state.isPlaying;
      // Реальная пауза/воспроизведение
      if (window.PROXY_URL) {
        if (state.isPlaying) {
          audioEl.play().catch(e => console.warn(e));
        } else {
          audioEl.pause();
        }
      }
      updatePlayIcon();
      setVizActive(state.isPlaying);
      if (state.isPlaying) miniCover.classList.add('spinning');
      else miniCover.classList.remove('spinning');
      renderTracks();
    }

    function updatePlayIcon() {
      if (state.isPlaying) {
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        $('play-btn').setAttribute('aria-label', 'Пауза');
      } else {
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        $('play-btn').setAttribute('aria-label', 'Воспроизвести');
      }
    }

    // ===== CONTROLS =====
    $('play-btn').addEventListener('click', togglePlayPause);

    $('prev-btn').addEventListener('click', () => {
      if (state.currentIndex > 0) {
        state.currentIndex--;
        state.progress = 0;
        startPlaying();
      } else if (state.repeatMode === 1) {
        state.currentIndex = state.queue.length - 1;
        startPlaying();
      } else {
        state.progress = 0;
        progressFill.style.width = '0%';
      }
    });

    $('next-btn').addEventListener('click', () => {
      if (state.currentIndex < state.queue.length - 1) {
        state.currentIndex++;
        startPlaying();
      } else if (state.repeatMode === 1) {
        state.currentIndex = 0;
        startPlaying();
      } else {
        showToast('Конец очереди');
      }
    });

    $('shuffle-btn').addEventListener('click', () => {
      state.isShuffled = !state.isShuffled;
      $('shuffle-btn').classList.toggle('active', state.isShuffled);
      if (state.currentIndex >= 0 && state.queue[state.currentIndex]) {
        buildQueue(state.queue[state.currentIndex]);
        renderQueue();
      }
      showToast(state.isShuffled ? '🔀 Перемешать: вкл' : 'Перемешать: выкл');
    });

    $('repeat-btn').addEventListener('click', () => {
      state.repeatMode = (state.repeatMode + 1) % 3;
      const btn = $('repeat-btn');
      const modes = ['Повтор: выкл', '🔁 Повтор списка', '🔂 Повтор трека'];
      btn.classList.toggle('active', state.repeatMode > 0);
      if (state.repeatMode === 2) {
        btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><text x="10" y="15" fill="currentColor" font-size="7" stroke="none">1</text></svg>`;
      } else {
        btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`;
      }
      showToast(modes[state.repeatMode]);
    });

    // Progress click
    $('progress-bar').addEventListener('click', (e) => {
      if (state.currentIndex < 0) return;
      const t = state.queue[state.currentIndex];
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      state.progress = Math.round(pct * t.duration * 1000);
      progressFill.style.width = (pct * 100) + '%';
    });

    // Mini like
    miniLike.addEventListener('click', (e) => {
      e.stopPropagation();
      if (state.currentIndex < 0) return;
      toggleLike(state.queue[state.currentIndex].id);
    });

    // ===== QUEUE PANEL =====
    function renderQueue() {
      queueList.innerHTML = '';
      const cur = state.queue[state.currentIndex];
      queueCount.textContent = `${state.queue.length} треков`;

      state.queue.forEach((t, i) => {
        const isCur = cur && t.id === cur.id;
        const item = document.createElement('div');
        item.className = 'queue-item' + (isCur ? ' current' : '');
        item.innerHTML = `
          <div class="queue-num">${isCur ? '▶' : i + 1}</div>
          <div class="queue-cover">${t.emoji}</div>
          <div class="queue-info">
            <div class="queue-name">${t.title}</div>
            <div class="queue-artist-text">${t.artist}</div>
          </div>
          <div class="queue-dur">${formatDur(t.duration)}</div>
        `;
        item.addEventListener('click', () => {
          state.currentIndex = i;
          startPlaying();
          closeQueue();
        });
        queueList.appendChild(item);
      });

      // Scroll to current
      if (cur) {
        setTimeout(() => {
          const curEl = queueList.querySelector('.current');
          if (curEl) curEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      }
    }

    $('queue-btn').addEventListener('click', () => {
      if (state.queue.length === 0) {
        buildQueue(TRACKS[0]);
        renderQueue();
      }
      queuePanel.classList.add('open');
    });

    function closeQueue() { queuePanel.classList.remove('open'); }
    $('queue-backdrop').addEventListener('click', closeQueue);

    // Swipe down to close queue
    let queueTouchY = 0;
    const queueSheet = queuePanel.querySelector('.queue-sheet');
    queueSheet.addEventListener('touchstart', e => { queueTouchY = e.touches[0].clientY; }, { passive: true });
    queueSheet.addEventListener('touchend', e => {
      const dy = e.changedTouches[0].clientY - queueTouchY;
      if (dy > 60) closeQueue();
    }, { passive: true });

    // ===== SEARCH =====
    const searchInput = $('search-input');
    const searchClear = $('search-clear');

    searchInput.addEventListener('input', () => {
      state.searchQuery = searchInput.value.trim();
      searchClear.classList.toggle('visible', state.searchQuery.length > 0);
      renderTracks();
    });

    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      state.searchQuery = '';
      searchClear.classList.remove('visible');
      searchInput.focus();
      renderTracks();
    });

    // ===== TABS =====
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        state.currentTab = btn.dataset.tab;
        renderTracks();
      });
    });

    // ===== GENRE CHIPS =====
    $('genre-row').addEventListener('click', e => {
      const chip = e.target.closest('.genre-chip');
      if (!chip) return;
      document.querySelectorAll('.genre-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      state.currentGenre = chip.dataset.genre;
      renderTracks();
    });

    // ===== THEME TOGGLE =====
    const themeToggle = $('theme-toggle');
    let currentTheme = 'dark';

    themeToggle.addEventListener('click', () => {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      themeToggle.innerHTML = currentTheme === 'dark'
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`;
    });

    // ===== TOAST =====
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('visible');
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => toast.classList.remove('visible'), 2200);
    }

    // ===== KEYBOARD =====
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') { e.preventDefault(); togglePlayPause(); }
      if (e.code === 'ArrowRight') $('next-btn').click();
      if (e.code === 'ArrowLeft') $('prev-btn').click();
    });

    // ===== TELEGRAM WEBAPP INTEGRATION =====
    const tg = window.Telegram?.WebApp;

    if (tg) {
      // Сообщаем Telegram, что WebApp готов
      tg.ready();

      // Раскрываем на весь экран
      tg.expand();

      // Применяем тему Telegram
      const tgTheme = tg.colorScheme; // 'dark' или 'light'
      if (tgTheme) {
        document.documentElement.setAttribute('data-theme', tgTheme);
        currentTheme = tgTheme;
      }

      // Настраиваем кнопку "Назад" в Telegram
      tg.BackButton.onClick(() => {
        if (queuePanel.classList.contains('open')) {
          closeQueue();
        } else {
          tg.close();
        }
      });


      // Haptic feedback при взаимодействии
      if (tg.HapticFeedback) {
        const origPlayTrack = playTrack;
        playTrack = function(track) {
          tg.HapticFeedback.impactOccurred('light');
          origPlayTrack(track);
          // Отправляем file_id боту — бот пришлёт аудиофайл в чат
          try {
            tg.sendData(JSON.stringify({
              action: 'track_selected',
              title: track.title,
              artist: track.artist,
              file_id: track.file_id || ''
            }));
          } catch(e) {
            console.warn('sendData error:', e);
          }
        };

        const origToggleLike = toggleLike;
        toggleLike = function(id) {
          tg.HapticFeedback.notificationOccurred('success');
          origToggleLike(id);
        };
      }

      // Функция отправки данных боту
      window.sendToBot = function(action, data) {
        try {
          const payload = JSON.stringify({ action, ...data });
          tg.sendData(payload);
        } catch (e) {
          console.warn('sendData error:', e);
        }
      };

      // Показываем BackButton когда открыта очередь
      const origOpenQueue = () => {
        queuePanel.classList.add('open');
        tg.BackButton.show();
      };
      $('queue-btn').removeEventListener('click', () => {});
      $('queue-btn').addEventListener('click', () => {
        if (state.queue.length === 0) {
          buildQueue(TRACKS[0]);
          renderQueue();
        }
        queuePanel.classList.add('open');
        tg.BackButton.show();
      });

      const origCloseQueue = closeQueue;
      closeQueue = function() {
        queuePanel.classList.remove('open');
        tg.BackButton.hide();
      };

      console.log('EXCLUSIVE MUSIC BOT: Telegram WebApp SDK подключен', tg.initData ? '(из бота)' : '(вне бота)');
    }

    // ===== INIT =====
    renderTracks();

    // Auto-play first track after 1.5s for demo
    setTimeout(() => {
      if (state.currentIndex < 0) {
        playTrack(TRACKS[0]);
      }
    }, 1500);
  </script>
</body>
