<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EXCLUSIVE MUSIC BOT</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d1a;
      --bg2: #12122a;
      --bg3: #1a1a35;
      --card: #1e1e3a;
      --card2: #252548;
      --accent: #f5a623;
      --accent2: #f07c1c;
      --blue: #4a90e2;
      --purple: #7b5ea7;
      --text: #ffffff;
      --text2: #a0a0c0;
      --text3: #6060a0;
      --border: rgba(255,255,255,0.07);
      --tab-active: #f5a623;
      --radius: 12px;
      --mini-h: 72px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      padding-bottom: calc(var(--mini-h) + env(safe-area-inset-bottom, 0px) + 8px);
    }
    button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
    ul { list-style: none; }
    input { font: inherit; }

    /* ── GRADIENT BG MESH ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 10%, rgba(74,90,226,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 85% 80%, rgba(123,94,167,0.22) 0%, transparent 65%),
        radial-gradient(ellipse 40% 30% at 60% 40%, rgba(245,166,35,0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(13,13,26,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 14px 16px 0;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .header-menu {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 4px;
    }
    .header-menu span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--text2);
      border-radius: 2px;
    }
    .header-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.01em;
    }
    .header-search-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text2);
      border-radius: 50%;
      transition: color 0.18s, background 0.18s;
    }
    .header-search-btn:hover { color: var(--text); background: var(--card); }

    /* ── TABS ── */
    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text3);
      border-bottom: 2px solid transparent;
      transition: color 0.18s, border-color 0.18s;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .tab-btn.active {
      color: var(--tab-active);
      border-bottom-color: var(--tab-active);
    }

    /* ── SEARCH BAR (inline, toggled) ── */
    .search-bar {
      display: none;
      padding: 10px 16px;
      background: rgba(13,13,26,0.98);
      position: sticky;
      top: 0;
      z-index: 49;
    }
    .search-bar.show { display: block; }
    .search-inner {
      position: relative;
    }
    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 10px 16px 10px 40px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.18s;
    }
    .search-input::placeholder { color: var(--text3); }
    .search-input:focus { border-color: rgba(74,90,226,0.5); }
    .search-icon-abs {
      position: absolute;
      left: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--text3);
      pointer-events: none;
    }

    /* ── CONTENT ── */
    .content {
      position: relative;
      z-index: 1;
      padding: 0;
    }

    /* ── SHUFFLE ROW ── */
    .shuffle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 8px;
    }
    .shuffle-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      transition: color 0.18s;
    }
    .shuffle-btn:hover { color: var(--accent); }
    .sort-btn {
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text3);
      border-radius: 6px;
      transition: color 0.18s, background 0.18s;
    }
    .sort-btn:hover { color: var(--text); background: var(--card); }

    /* ── TRACK LIST ── */
    .track-list {
      padding: 0 0 4px;
    }
    .track-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      transition: background 0.15s;
      cursor: pointer;
      position: relative;
    }
    .track-row:active { background: rgba(255,255,255,0.04); }
    .track-row.playing { background: rgba(74,90,226,0.08); }

    .track-thumb {
      width: 50px; height: 50px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--bg3), var(--card2));
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }
    .track-row.playing .track-thumb {
      box-shadow: 0 0 0 2px var(--accent);
    }
    .thumb-eq {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(13,13,26,0.6);
      align-items: flex-end;
      justify-content: center;
      gap: 2px;
      padding-bottom: 8px;
    }
    .track-row.playing .thumb-eq { display: flex; }
    .teq {
      width: 3px;
      border-radius: 2px;
      background: var(--accent);
      animation: teq-bounce 0.7s ease-in-out infinite alternate;
    }
    .teq:nth-child(1) { height: 8px; }
    .teq:nth-child(2) { height: 14px; animation-delay: 0.15s; }
    .teq:nth-child(3) { height: 10px; animation-delay: 0.08s; }
    @keyframes teq-bounce {
      from { transform: scaleY(0.35); }
      to   { transform: scaleY(1); }
    }

    .track-info { flex: 1; min-width: 0; }
    .track-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.35;
    }
    .track-row.playing .track-name { color: var(--accent); }
    .track-artist-name {
      font-size: 12px;
      color: var(--text2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .track-more {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .track-dur {
      font-size: 11px;
      color: var(--text3);
      font-variant-numeric: tabular-nums;
    }
    .track-play-now {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      display: none;
    }
    .track-row.playing .track-play-now { display: flex; }
    .track-dot-btn {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text3);
      border-radius: 50%;
      transition: color 0.15s, background 0.15s;
    }
    .track-dot-btn:hover { color: var(--text2); background: var(--card); }

    /* ── MINI PLAYER ── */
    .mini-player {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      padding: 0 0 env(safe-area-inset-bottom, 0px);
      background: transparent;
    }
    .mini-inner {
      margin: 0 8px 8px;
      background: var(--card2);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .mini-progress-bar {
      height: 2px;
      background: rgba(255,255,255,0.08);
    }
    .mini-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), var(--accent));
      width: 0%;
      transition: width 0.4s linear;
    }
    .mini-body {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
    }
    .mini-thumb {
      width: 46px; height: 46px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--bg3), var(--card2));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .mini-info { flex: 1; min-width: 0; }
    .mini-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-artist {
      font-size: 11px;
      color: var(--text2);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .mc-btn {
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text2);
      border-radius: 50%;
      transition: color 0.15s, transform 0.12s;
    }
    .mc-btn:hover { color: var(--text); }
    .mc-btn:active { transform: scale(0.92); }
    .mc-play {
      width: 40px; height: 40px;
      background: var(--accent);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      box-shadow: 0 2px 12px rgba(245,166,35,0.35);
      transition: transform 0.12s, box-shadow 0.15s;
    }
    .mc-play:hover { transform: scale(1.06); box-shadow: 0 4px 18px rgba(245,166,35,0.5); }
    .mc-play:active { transform: scale(0.95); }

    /* ── FULL PLAYER ── */
    .full-player {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .full-player.open { transform: translateY(0); }

    /* Full player background art */
    .fp-bg-art {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(74,90,226,0.25) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 20% 100%, rgba(123,94,167,0.3) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 60%, rgba(245,166,35,0.1) 0%, transparent 55%);
      z-index: 0;
    }

    .fp-scroll {
      position: relative;
      z-index: 1;
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
      padding: 0 24px 32px;
    }
    .fp-scroll::-webkit-scrollbar { display: none; }

    /* Top bar */
    .fp-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0 10px;
      flex-shrink: 0;
    }
    .fp-down-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text2);
      transition: color 0.15s;
    }
    .fp-down-btn:hover { color: var(--text); }
    .fp-top-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .fp-more-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text2);
    }

    /* Cover art */
    .fp-cover-wrap {
      width: 220px;
      height: 220px;
      margin: 16px auto 28px;
      flex-shrink: 0;
      position: relative;
    }
    .fp-cover-glow {
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(74,90,226,0.3), rgba(123,94,167,0.2), transparent 70%);
      animation: cover-glow-pulse 3s ease-in-out infinite;
      filter: blur(12px);
    }
    @keyframes cover-glow-pulse {
      0%,100% { opacity: 0.6; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    .fp-cover {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      background: linear-gradient(135deg, #1a1a40, #2a2050);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
      overflow: hidden;
    }
    /* Wavy lines on cover */
    .fp-cover::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 18px,
        rgba(74,90,226,0.08) 18px,
        rgba(74,90,226,0.08) 20px
      );
    }

    /* Track info */
    .fp-info {
      text-align: center;
      margin-bottom: 20px;
      flex-shrink: 0;
    }
    .fp-track-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .fp-track-artist {
      font-size: 14px;
      color: var(--text2);
      font-weight: 500;
    }

    /* Action icons row */
    .fp-actions-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 24px;
      flex-shrink: 0;
    }
    .fp-act-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px;
      color: var(--text3);
      border-radius: 50%;
      transition: color 0.15s, transform 0.12s;
    }
    .fp-act-btn:hover { color: var(--text2); transform: scale(1.12); }
    .fp-act-btn.liked { color: #e74c6a; }

    /* Progress */
    .fp-prog-wrap {
      margin-bottom: 20px;
      flex-shrink: 0;
    }
    .fp-prog-bar {
      position: relative;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .fp-prog-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), var(--accent));
      border-radius: 4px;
      width: 0%;
      position: relative;
      transition: width 0.3s linear;
    }
    .fp-prog-thumb {
      position: absolute;
      right: -7px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 6px rgba(74,90,226,0.5);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .fp-prog-bar:hover .fp-prog-thumb { opacity: 1; }
    .fp-times {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text3);
      font-variant-numeric: tabular-nums;
    }

    /* Main controls */
    .fp-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 28px;
      flex-shrink: 0;
    }
    .fp-ctrl {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text2);
      border-radius: 50%;
      transition: color 0.15s, transform 0.12s;
    }
    .fp-ctrl:hover { color: var(--text); transform: scale(1.08); }
    .fp-ctrl:active { transform: scale(0.93); }
    .fp-ctrl.active { color: var(--accent); }
    .fp-play-main {
      width: 64px; height: 64px;
      background: var(--accent);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      box-shadow: 0 4px 20px rgba(245,166,35,0.4);
      transition: transform 0.12s, box-shadow 0.15s;
    }
    .fp-play-main:hover { transform: scale(1.06); box-shadow: 0 6px 28px rgba(245,166,35,0.55); }
    .fp-play-main:active { transform: scale(0.95); }

    /* Extra row */
    .fp-extra-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .fp-extra-btn {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text3);
      border-radius: 50%;
      transition: color 0.15s;
    }
    .fp-extra-btn:hover { color: var(--text2); }
    .fp-extra-btn.active { color: var(--accent); }

    /* Volume row */
    .fp-vol-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      flex-shrink: 0;
    }
    .fp-vol-row svg { color: var(--text3); flex-shrink: 0; }
    .vol-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px rgba(245,166,35,0.4);
      cursor: pointer;
    }

    /* ── LOADING ── */
    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      transition: opacity 0.5s;
    }
    .loading-screen.hidden { opacity: 0; pointer-events: none; }
    .ld-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.05em;
    }
    .ld-subtitle {
      font-size: 12px;
      color: var(--text3);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .ld-bars {
      display: flex;
      gap: 5px;
      align-items: flex-end;
      height: 28px;
    }
    .ld-bar {
      width: 5px;
      border-radius: 3px;
      animation: ld-anim 0.8s ease-in-out infinite alternate;
    }
    .ld-bar:nth-child(1) { background: var(--blue);   height: 12px; }
    .ld-bar:nth-child(2) { background: var(--purple); height: 22px; animation-delay: 0.12s; }
    .ld-bar:nth-child(3) { background: var(--accent);  height: 16px; animation-delay: 0.06s; }
    .ld-bar:nth-child(4) { background: var(--blue);   height: 26px; animation-delay: 0.18s; }
    .ld-bar:nth-child(5) { background: var(--purple); height: 14px; animation-delay: 0.09s; }
    @keyframes ld-anim {
      from { transform: scaleY(0.3); opacity: 0.5; }
      to   { transform: scaleY(1); opacity: 1; }
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--card2);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      z-index: 400;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── EMPTY ── */
    .empty-msg {
      display: none;
      text-align: center;
      padding: 48px 20px;
      color: var(--text3);
      font-size: 14px;
    }
    .empty-msg.show { display: block; }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--card2); border-radius: 3px; }
  </style>
</head>
<body>

<!-- Loading -->
<div class="loading-screen" id="loader">
  <div class="ld-title">Music Player</div>
  <div class="ld-bars">
    <div class="ld-bar"></div>
    <div class="ld-bar"></div>
    <div class="ld-bar"></div>
    <div class="ld-bar"></div>
    <div class="ld-bar"></div>
  </div>
  <div class="ld-subtitle">EXCLUSIVE MUSIC REMIX</div>
</div>

<!-- Header -->
<div class="header" id="header">
  <div class="header-top">
    <button class="header-menu" aria-label="Меню">
      <span></span><span></span><span></span>
    </button>
    <div class="header-title">Music Player</div>
    <button class="header-search-btn" id="search-toggle-btn" aria-label="Поиск">

<!-- Toast -->

<script src="tracks_data.js"></script>
<script>
  const PROXY = 'https://web-production-6791f.up.railway.app';
  const CHANNEL = 'https://t.me/exclusive_music_remix';

  // ── State ──
  let currentTrack = null;
  let currentIdx = 0;
  let isPlaying = false;
  let isShuffle = false;
  let isRepeat = false;
  let currentTab = 'songs';
  let searchQuery = '';
  let queue = [...TRACKS];
  let likes = {};
  try { likes = JSON.parse(localStorage.getItem('xm_likes') || '{}'); } catch(e) {}

  // ── Audio ──
  const audio = new Audio();
  audio.crossOrigin = 'anonymous';

  // ── DOM ──
  const trackList = document.getElementById('track-list');
  const emptyMsg = document.getElementById('empty-msg');
  const miniPlayerEl = document.getElementById('mini-player');
  const miniThumb = document.getElementById('mini-thumb');
  const miniTitle = document.getElementById('mini-title');
  const miniArtist = document.getElementById('mini-artist');
  const miniProg = document.getElementById('mini-prog');
  const miniPlayIcon = document.getElementById('mini-play-icon');
  const fpCover = document.getElementById('fp-cover');
  const fpName = document.getElementById('fp-name');
  const fpArtist = document.getElementById('fp-artist');
  const fpProgFill = document.getElementById('fp-prog-fill');
  const fpCur = document.getElementById('fp-cur');
  const fpDur = document.getElementById('fp-dur');
  const fpPlayIcon = document.getElementById('fp-play-icon');
  const fullPlayerEl = document.getElementById('full-player');
  const fpLikeBtn = document.getElementById('fp-like-btn');

  // ── Helpers ──
  function fmt(s) {
    s = Math.floor(s || 0);
    return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }
  function emoji(g) {
    return { remix:'🔥', love:'❤️', hiphop:'🎤', electronic:'⚡', winter:'❄️', city:'🏙️' }[g] || '🎵';
  }

  // ── Render ──
  function getFiltered() {
    return TRACKS.filter(t => {
      const matchTab = currentTab === 'songs' || t.genre === currentTab;
      const q = searchQuery.toLowerCase();
      const matchSearch = !q || t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q);
      return matchTab && matchSearch;
    });
  }

  function renderList() {
    const list = getFiltered();
    emptyMsg.classList.toggle('show', list.length === 0);
    trackList.innerHTML = '';
    list.forEach((t, idx) => {
      const playing = currentTrack && currentTrack.id === t.id;
      const li = document.createElement('li');
      li.className = 'track-row' + (playing ? ' playing' : '');
      li.innerHTML = `
        <div class="track-thumb">
          <span>${emoji(t.genre)}</span>
          <div class="thumb-eq">
            <div class="teq"></div><div class="teq"></div><div class="teq"></div>
          </div>
        </div>
        <div class="track-info">
          <div class="track-name">${t.title}</div>
          <div class="track-artist-name">${t.artist}</div>
        </div>
        <div class="track-more">
          <span class="track-dur">${fmt(t.duration)}</span>
          ${playing ? `<div class="track-play-now"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>` : ''}
          <button class="track-dot-btn" data-id="${t.id}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
          </button>
        </div>
      `;
      li.addEventListener('click', e => {
        if (e.target.closest('.track-dot-btn')) { toggleLike(t.id); return; }
        queue = getFiltered();
        const qi = queue.findIndex(x => x.id === t.id);
        playTrack(t, qi);
      });
      trackList.appendChild(li);
    });
  }

  // ── Play ──
  function playTrack(track, qIdx) {
    currentTrack = track;
    currentIdx = qIdx !== undefined ? qIdx : queue.findIndex(x => x.id === track.id);
    audio.src = PROXY + '/audio/' + encodeURIComponent(track.file_id);
    audio.load();
    audio.play().then(() => setPlaying(true)).catch(() => showToast('⚠️ Ошибка'));
    updateUI();
    miniPlayerEl.style.display = 'block';
    renderList();
  }

  function setPlaying(v) {
    isPlaying = v;
    const pause = `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`;
    const play = `<polygon points="5 3 19 12 5 21 5 3"/>`;
    const ic = v ? pause : play;
    miniPlayIcon.innerHTML = ic;
    fpPlayIcon.innerHTML = ic;
  }

  function updateUI() {
    if (!currentTrack) return;
    const e = emoji(currentTrack.genre);
    miniThumb.textContent = e;
    miniTitle.textContent = currentTrack.title;
    miniArtist.textContent = currentTrack.artist;
    fpCover.innerHTML = `<div style="position:absolute;inset:0;opacity:0.06;background:repeating-linear-gradient(45deg,transparent,transparent 18px,rgba(255,255,255,0.5) 18px,rgba(255,255,255,0.5) 20px)"></div><span style="position:relative;z-index:1">${e}</span>`;
    fpName.textContent = currentTrack.title;
    fpArtist.textContent = currentTrack.artist;
    fpDur.textContent = fmt(currentTrack.duration);
    updateLikeBtn();
  }

  function updateLikeBtn() {
    if (!currentTrack) return;
    const liked = !!likes[currentTrack.id];
    fpLikeBtn.innerHTML = liked
      ? `<svg width="22" height="22" viewBox="0 0 24 24" fill="#e74c6a" stroke="#e74c6a" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`
      : `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
  }

  function togglePlay() {
    if (!currentTrack) { if (TRACKS.length) { queue = [...TRACKS]; playTrack(TRACKS[0], 0); } return; }
    if (isPlaying) { audio.pause(); setPlaying(false); }
    else { audio.play().then(() => setPlaying(true)).catch(() => {}); }
  }

  function playNext() {
    if (!queue.length) return;
    let ni = isShuffle ? Math.floor(Math.random() * queue.length) : (currentIdx + 1) % queue.length;
    playTrack(queue[ni], ni);
  }
  function playPrev() {
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    const pi = (currentIdx - 1 + queue.length) % queue.length;
    playTrack(queue[pi], pi);
  }

  function toggleLike(id) {
    if (likes[id]) delete likes[id]; else likes[id] = true;
    try { localStorage.setItem('xm_likes', JSON.stringify(likes)); } catch(e) {}
    updateLikeBtn();
    showToast(likes[id] ? '❤️ Добавлено в избранное' : 'Убрано из избранного');
  }

  // ── Audio events ──
  audio.addEventListener('ended', () => { if (isRepeat) { audio.currentTime=0; audio.play(); } else playNext(); });
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const p = (audio.currentTime / audio.duration) * 100;
    miniProg.style.width = p + '%';
    fpProgFill.style.width = p + '%';
    fpCur.textContent = fmt(audio.currentTime);
  });
  audio.addEventListener('error', () => { showToast('⚠️ Не удалось загрузить трек'); setPlaying(false); });

  // ── Progress seek ──
  document.getElementById('fp-prog-bar').addEventListener('click', e => {
    if (!audio.duration) return;
    const r = e.currentTarget.getBoundingClientRect();
    audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
  });

  // ── Volume ──
  document.getElementById('fp-vol').addEventListener('input', e => { audio.volume = e.target.value / 100; });

  // ── Controls ──
  document.getElementById('mini-play').addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
  document.getElementById('mini-prev').addEventListener('click', e => { e.stopPropagation(); playPrev(); });
  document.getElementById('mini-next').addEventListener('click', e => { e.stopPropagation(); playNext(); });
  document.getElementById('fp-play').addEventListener('click', togglePlay);
  document.getElementById('fp-prev').addEventListener('click', playPrev);
  document.getElementById('fp-next').addEventListener('click', playNext);
  document.getElementById('fp-like-btn').addEventListener('click', () => { if (currentTrack) toggleLike(currentTrack.id); });
  document.getElementById('fp-channel-btn').addEventListener('click', () => window.open(CHANNEL, '_blank'));

  // Shuffle
  document.getElementById('fp-shuffle-btn').addEventListener('click', () => {
    isShuffle = !isShuffle;
    document.getElementById('fp-shuffle-btn').classList.toggle('active', isShuffle);
    showToast(isShuffle ? '🔀 Перемешать вкл' : '🔀 Перемешать выкл');
  });
  document.getElementById('shuffle-btn').addEventListener('click', () => {
    isShuffle = true;
    queue = [...TRACKS].sort(() => Math.random() - 0.5);
    playTrack(queue[0], 0);
    showToast('🔀 Случайное воспроизведение');
  });
  // Repeat
  document.getElementById('fp-repeat-btn').addEventListener('click', () => {
    isRepeat = !isRepeat;
    document.getElementById('fp-repeat-btn').classList.toggle('active', isRepeat);
    showToast(isRepeat ? '🔁 Повтор вкл' : '🔁 Повтор выкл');
  });

  // ── Full player open/close ──
  document.getElementById('mini-inner').addEventListener('click', e => {
    if (e.target.closest('button')) return;
    fullPlayerEl.classList.add('open');
    document.body.style.overflow = 'hidden';
  });
  document.getElementById('fp-close').addEventListener('click', () => {
    fullPlayerEl.classList.remove('open');
    document.body.style.overflow = '';
  });

  // Swipe down to close
  let tsy = 0;
  fullPlayerEl.addEventListener('touchstart', e => { tsy = e.touches[0].clientY; }, {passive:true});
  fullPlayerEl.addEventListener('touchend', e => {
    if (e.changedTouches[0].clientY - tsy > 90) {
      fullPlayerEl.classList.remove('open');
      document.body.style.overflow = '';
    }
  }, {passive:true});

  // ── Tabs ──
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      searchQuery = '';
      document.getElementById('search-input').value = '';
      renderList();
    });
  });

  // ── Search ──
  document.getElementById('search-toggle-btn').addEventListener('click', () => {
    const bar = document.getElementById('search-bar');
    bar.classList.toggle('show');
    if (bar.classList.contains('show')) {
      document.getElementById('search-input').focus();
    } else {
      searchQuery = '';
      document.getElementById('search-input').value = '';
      renderList();
    }
  });
  document.getElementById('search-input').addEventListener('input', e => {
    searchQuery = e.target.value;
    renderList();
  });

  // ── Toast ──
  let toastT;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('show'), 2400);
  }

  // ── Telegram ──
  try {
    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready(); tg.expand();
      tg.setHeaderColor('#0d0d1a');
      tg.setBackgroundColor('#0d0d1a');
    }
  } catch(e) {}

  // ── Init ──
  queue = [...TRACKS];
  renderList();
  setTimeout(() => document.getElementById('loader').classList.add('hidden'), 1100);
</script>
