/* ═══════════════════════════════════════════
   APP SHELL
═══════════════════════════════════════════ */
#app{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  overflow:hidden;
}

/* ═══════════════════════════════════════════
   PAGES
═══════════════════════════════════════════ */
.page{
  position:absolute;inset:0;
  bottom:calc(56px + env(safe-area-inset-bottom));
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  display:none;
  background:transparent;
  /* space for mini player */
  padding-bottom:72px;
}
.page.active{display:block;}
/* player page overrides */
#pg-player{
  overflow:hidden;
  padding-bottom:0;
  display:none;
}
#pg-player.active{display:flex;flex-direction:column;}

/* ═══════════════════════════════════════════
   BOTTOM NAV — exact Apple Music
═══════════════════════════════════════════ */
#nav{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(56px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(0,5,20,0.75);
  border-top:0.5px solid rgba(0,180,255,0.2);
  display:flex;align-items:flex-start;
  z-index:200;
  -webkit-backdrop-filter:blur(24px);
  backdrop-filter:blur(24px);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:8px 0 0;gap:3px;
  background:none;border:none;
  color:rgba(255,255,255,0.4);
  font-size:10px;font-weight:500;
  letter-spacing:0.1px;
  transition:color 0.15s;
  min-width:0;
}
.nav-item svg{width:24px;height:24px;flex-shrink:0;}
.nav-item.active{color:#00B4FF;}
.nav-item span{font-size:10px;white-space:nowrap;}

/* ═══════════════════════════════════════════
   MINI PLAYER — Apple Music style
═══════════════════════════════════════════ */
#mini{
  position:fixed;
  bottom:calc(56px + env(safe-area-inset-bottom));
  left:0;right:0;
  height:64px;
  background:rgba(0,5,20,0.75);
  border-top:0.5px solid rgba(0,180,255,0.2);
  -webkit-backdrop-filter:blur(30px);
  backdrop-filter:blur(30px);
  display:none;
  align-items:center;
  padding:0 16px;
  gap:12px;
  z-index:199;
  cursor:pointer;
}
#mini.show{display:flex;}
/* progress line at bottom of mini */
#mini::after{
  content:'';
  position:absolute;bottom:0;left:0;
  height:2px;background:rgba(255,255,255,0.15);
  width:100%;
}
#mini-progress-line{
  position:absolute;bottom:0;left:0;
  height:2px;background:#00B4FF;
  width:0%;transition:width 0.5s linear;
  z-index:1;
}
#mini-art{
  width:44px;height:44px;border-radius:8px;
  flex-shrink:0;overflow:hidden;
  background:rgba(255,255,255,0.1);
}
#mini-art img{width:100%;height:100%;object-fit:cover;display:block;}
#mini-info{flex:1;min-width:0;}
#mini-title{font-size:14px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#mini-artist{font-size:12px;color:rgba(255,255,255,0.5);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#mini-controls{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.mini-btn{
  width:36px;height:36px;
  background:none;border:none;
  color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.mini-btn svg{width:22px;height:22px;}
#mini-play-btn svg{width:28px;height:28px;}

/* ═══════════════════════════════════════════
   PAGE 1 — SONGS (Apple Music Library)
═══════════════════════════════════════════ */
#pg-songs{
  background: transparent;
}

.lib-header{padding:56px 16px 8px;}
.lib-title{font-size:34px;font-weight:700;letter-spacing:-0.5px;color:#fff;}
.lib-sub{font-size:13px;color:rgba(255,255,255,0.45);margin-top:4px;}

.filter-bar{
  display:flex;gap:8px;
  padding:12px 16px;
  overflow-x:auto;scrollbar-width:none;
}
.filter-bar::-webkit-scrollbar{display:none;}
.f-pill{
  flex-shrink:0;
  padding:6px 16px;border-radius:16px;
  font-size:13px;font-weight:500;
  background:rgba(0,10,30,0.55);
  border:1px solid rgba(0,180,255,0.15);
  color:rgba(255,255,255,0.75);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  transition:all 0.2s;
  white-space:nowrap;
}
.f-pill.on{background:#00B4FF;color:#fff;}

#track-list{}
.t-row{
  display:flex;align-items:center;
  padding:8px 16px;gap:12px;
  cursor:pointer;
  position:relative;
}
.t-row:active{background:rgba(255,255,255,0.06);}
.t-row.now .t-title{color:#00B4FF;}

/* number / eq */
.t-idx{
  width:18px;text-align:center;
  font-size:14px;color:rgba(255,255,255,0.35);
  flex-shrink:0;
}
.t-eq{
  width:18px;height:16px;
  display:none;align-items:flex-end;justify-content:center;
  gap:1.5px;flex-shrink:0;
}
.t-row.now .t-idx{display:none;}
.t-row.now .t-eq{display:flex;}
.eq-b{width:3px;background:#00B4FF;border-radius:2px 2px 0 0;}
@keyframes eqA{0%,100%{height:3px}50%{height:14px}}
@keyframes eqB{0%,100%{height:8px}50%{height:3px}}
@keyframes eqC{0%,100%{height:5px}50%{height:16px}}
.eq-b:nth-child(1){animation:eqA 0.65s ease infinite;}
.eq-b:nth-child(2){animation:eqB 0.5s ease infinite;}
.eq-b:nth-child(3){animation:eqC 0.75s ease infinite;}

/* square cover */
.t-cover{
  width:48px;height:48px;border-radius:8px;
  flex-shrink:0;overflow:hidden;
  background:#000;
}
.t-cover img{width:100%;height:100%;object-fit:cover;display:block;}

.t-info{flex:1;min-width:0;}
.t-title{font-size:16px;font-weight:400;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-artist{font-size:13px;color:rgba(255,255,255,0.5);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-dur{font-size:13px;color:rgba(255,255,255,0.35);flex-shrink:0;}
.t-sep{height:0.5px;background:rgba(255,255,255,0.07);margin-left:76px;}

/* ═══════════════════════════════════════════
   PAGE 2 — SEARCH
═══════════════════════════════════════════ */
.srch-header{padding:56px 16px 12px;}
.srch-title{font-size:34px;font-weight:700;letter-spacing:-0.5px;}
.srch-bar-wrap{padding:0 16px 16px;}
.srch-bar{
  display:flex;align-items:center;gap:10px;
  background:rgba(0,10,30,0.55);
  border:1px solid rgba(0,180,255,0.18);
  border-radius:12px;padding:10px 14px;
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
}
.srch-bar svg{color:rgba(255,255,255,0.45);flex-shrink:0;}
.srch-bar input{
  flex:1;background:none;border:none;outline:none;
  color:#fff;font-size:16px;font-family:inherit;
}
.srch-bar input::placeholder{color:rgba(255,255,255,0.35);}
.srch-chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 16px;}
.srch-chip{
  padding:7px 16px;border-radius:16px;
  background:rgba(0,10,30,0.55);
  border:1px solid rgba(0,180,255,0.15);
  color:rgba(255,255,255,0.7);
  font-size:13px;
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
}
.srch-chip:active{background:rgba(255,255,255,0.15);}
.srch-sec{font-size:17px;font-weight:600;padding:12px 16px 6px;}
#srch-results{}

/* ═══════════════════════════════════════════
   PAGE 3 — GENRES
═══════════════════════════════════════════ */
.gen-header{padding:56px 16px 16px;}
.gen-title{font-size:34px;font-weight:700;letter-spacing:-0.5px;}
.gen-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;padding:0 16px 16px;
}
.gen-card{
  height:110px;border-radius:14px;
  display:flex;flex-direction:column;
  justify-content:flex-end;padding:12px 14px;
  cursor:pointer;overflow:hidden;
  transition:transform 0.15s;
  position:relative;
}
.gen-card:active{transform:scale(0.97);}
.gen-name{font-size:17px;font-weight:700;color:#fff;}
.gen-count{font-size:12px;color:rgba(255,255,255,0.65);margin-top:2px;}

/* ═══════════════════════════════════════════
   PAGE 4 — PLAYER (Apple Music exact)
═══════════════════════════════════════════ */
#pg-player{
  position:absolute;
  top:0;left:0;right:0;
  bottom:calc(56px + env(safe-area-inset-bottom));
  background:transparent;
  overflow:hidden;
}

/* blurred background art */
.pl-bg{position:absolute;inset:0;z-index:0;overflow:hidden;}
.pl-bg img{
  position:absolute;
  top:-10%;left:-10%;
  width:120%;height:120%;
  object-fit:cover;
  filter:blur(70px) brightness(0.25) saturate(2.5);
}
.pl-bg-grad{
  position:absolute;inset:0;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,0.1) 0%,
    rgba(0,0,0,0.4) 40%,
    rgba(0,0,0,0.8) 75%,
    rgba(0,0,0,0.95) 100%
  );
}

/* inner layout */
.pl-inner{
  position:relative;z-index:1;
  height:100%;
  display:flex;flex-direction:column;
  padding:0 24px;
  padding-top:max(14px, env(safe-area-inset-top));
  overflow:hidden;
}

/* top bar */
.pl-topbar{
  display:flex;align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
  flex-shrink:0;
}
.pl-circ{
  width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,0.15);
  border:none;color:rgba(255,255,255,0.8);
  display:flex;align-items:center;justify-content:center;
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  flex-shrink:0;
}
.pl-circ svg{width:16px;height:16px;}
.pl-label{
  font-size:12px;font-weight:600;
  color:rgba(255,255,255,0.55);
  letter-spacing:1px;text-transform:uppercase;
}

/* artwork — the hero element */
.pl-art-wrap{
  flex:1;min-height:0;
  display:flex;align-items:center;justify-content:center;
  padding:6px 0;
}
.pl-art{
  /* Apple Music: artwork is a square taking ~88% of width */
  width:min(86vw,320px);
  height:min(86vw,320px);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,0.8);
  /* paused = shrunk slightly */
  transform:scale(0.91);
  transition:transform 0.45s cubic-bezier(0.34,1.4,0.64,1),
             box-shadow 0.45s ease;
}
.pl-art.play{
  transform:scale(1.0);
  box-shadow:0 38px 100px rgba(0,0,0,0.9),
             0 0 80px rgba(0,80,200,0.25);
}
.pl-art img{width:100%;height:100%;object-fit:cover;display:block;}

/* track info */
.pl-info{
  display:flex;align-items:center;
  gap:12px;
  flex-shrink:0;
  margin-top:4px;
}
.pl-texts{flex:1;min-width:0;}
.pl-track{
  font-size:21px;font-weight:700;
  color:#fff;letter-spacing:-0.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pl-artist{
  font-size:17px;color:#00B4FF;
  margin-top:3px;font-weight:400;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pl-heart{
  width:36px;height:36px;
  background:none;border:none;
  font-size:22px;color:rgba(255,255,255,0.35);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:color 0.2s;
}
.pl-heart.on{color:#00B4FF;}

/* progress */
.pl-prog-wrap{
  margin-top:16px;flex-shrink:0;
}
.pl-prog{
  width:100%;height:3px;
  -webkit-appearance:none;appearance:none;
  background:rgba(255,255,255,0.2);
  border-radius:3px;outline:none;cursor:pointer;
  display:block;
}
.pl-prog::-webkit-slider-runnable-track{
  height:3px;border-radius:3px;
  background:linear-gradient(
    to right,
    #fff var(--p,0%),
    rgba(255,255,255,0.2) var(--p,0%)
  );
}
.pl-prog::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:14px;height:14px;border-radius:50%;
  background:#fff;margin-top:-5.5px;
  box-shadow:0 2px 6px rgba(0,0,0,0.5);
}
.pl-prog::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:#fff;border:none;
}
.pl-times{
  display:flex;justify-content:space-between;
  margin-top:5px;
}
.pl-time{font-size:11px;color:rgba(255,255,255,0.4);font-variant-numeric:tabular-nums;}

/* controls row */
.pl-ctrls{
  display:flex;align-items:center;
  justify-content:space-between;
  margin-top:20px;flex-shrink:0;
}
.pl-side{
  width:44px;height:44px;
  background:none;border:none;
  color:rgba(255,255,255,0.5);
  display:flex;align-items:center;justify-content:center;
}
.pl-side svg{width:22px;height:22px;}
.pl-side.on{color:#00B4FF;}
.pl-side:active,.pl-skip:active{opacity:0.6;}
.pl-skip{
  width:50px;height:50px;
  background:none;border:none;
  color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.pl-skip svg{width:34px;height:34px;}
/* big white play button */
.pl-play{
  width:72px;height:72px;border-radius:50%;
  background:#fff;border:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px rgba(0,0,0,0.5);
  transition:transform 0.1s;
  flex-shrink:0;
}
.pl-play:active{transform:scale(0.93);}
.pl-play svg{width:30px;height:30px;fill:#000;}

/* volume */
.pl-vol{
  display:flex;align-items:center;gap:10px;
  margin-top:18px;flex-shrink:0;
}
.pl-vol-ic{
  color:rgba(255,255,255,0.4);
  display:flex;align-items:center;
  flex-shrink:0;
}
.pl-vol-ic svg{width:16px;height:16px;}
.pl-vol-sl{
  flex:1;height:3px;
  -webkit-appearance:none;appearance:none;
  background:rgba(255,255,255,0.2);
  border-radius:3px;outline:none;cursor:pointer;
}
.pl-vol-sl::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:14px;height:14px;border-radius:50%;
  background:rgba(255,255,255,0.9);
}
.pl-vol-sl::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:rgba(255,255,255,0.9);border:none;
}
.pl-src{
  font-size:10px;color:rgba(255,255,255,0.18);
  text-align:center;margin-top:12px;
  letter-spacing:1.2px;text-transform:uppercase;
  flex-shrink:0;padding-bottom:6px;
}

/* ═══════════════════════════════════════════
   PAGE 5 — VK
═══════════════════════════════════════════ */
.vk-wrap{padding:56px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:16px;}
.vk-icon{
  width:72px;height:72px;border-radius:18px;
  background:linear-gradient(135deg,#2787F5,#1565C0);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 40px rgba(39,135,245,0.35);
  margin-top:24px;
}
.vk-head{font-size:22px;font-weight:700;text-align:center;}
.vk-sub{font-size:14px;color:rgba(255,255,255,0.45);text-align:center;line-height:1.5;}
.vk-btn{
  width:100%;padding:15px;border-radius:14px;
  background:#2787F5;color:#fff;
  font-size:16px;font-weight:600;border:none;
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:8px;
}
.vk-user-card{
  width:100%;
  background:rgba(255,255,255,0.07);
  border-radius:16px;padding:14px 16px;
  display:flex;align-items:center;gap:12px;
}
.vk-av{width:48px;height:48px;border-radius:50%;background:#1565C0;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden;}
.vk-av img{width:100%;height:100%;object-fit:cover;}
.vk-uname{font-size:16px;font-weight:600;}
.vk-usub{font-size:13px;color:rgba(255,255,255,0.45);margin-top:2px;}
.vk-out{background:none;border:none;color:rgba(255,255,255,0.4);font-size:14px;margin-top:4px;}

/* ═══════════════════════════════════════════

  background:linear-gradient(to bottom,rgba(0,0,0,0.7) 0%,rgba(0,0,0,0.0) 30%,rgba(0,0,0,0.0) 55%,rgba(0,0,0,0.78) 100%);

}

.sp-logo{
  position:relative;z-index:4;

}
@keyframes logoIn{0%{opacity:0;transform:scale(0.7) translateY(30px);}100%{opacity:1;transform:scale(1) translateY(0);}}
@keyframes logoPulse{0%,100%{filter:drop-shadow(0 0 18px rgba(0,180,255,0.7)) drop-shadow(0 0 40px rgba(0,180,255,0.3));}50%{filter:drop-shadow(0 0 35px rgba(0,180,255,1)) drop-shadow(0 0 80px rgba(0,180,255,0.6));}}
.sp-eq{
  position:absolute;bottom:90px;left:0;right:0;
  display:flex;align-items:flex-end;justify-content:center;
  gap:4px;height:40px;z-index:4;
}
.sp-bar{width:4px;border-radius:2px;background:linear-gradient(to top,#0044cc,#00B4FF);box-shadow:0 0 6px rgba(0,180,255,0.8);transform-origin:bottom;}
.sp-bar:nth-child(1){animation:eq 0.6s ease-in-out infinite alternate;}
.sp-bar:nth-child(2){animation:eq 0.4s ease-in-out 0.1s infinite alternate;}
.sp-bar:nth-child(3){animation:eq 0.5s ease-in-out 0.05s infinite alternate;}
.sp-bar:nth-child(4){animation:eq 0.35s ease-in-out 0.15s infinite alternate;}
.sp-bar:nth-child(5){animation:eq 0.55s ease-in-out 0.08s infinite alternate;}
.sp-bar:nth-child(6){animation:eq 0.45s ease-in-out 0.2s infinite alternate;}
.sp-bar:nth-child(7){animation:eq 0.38s ease-in-out 0.12s infinite alternate;}
.sp-bar:nth-child(8){animation:eq 0.52s ease-in-out 0.06s infinite alternate;}
.sp-bar:nth-child(9){animation:eq 0.42s ease-in-out 0.18s infinite alternate;}
.sp-bar:nth-child(10){animation:eq 0.48s ease-in-out 0.03s infinite alternate;}
@keyframes eq{0%{height:4px;opacity:0.5;}100%{height:36px;opacity:1;}}
.sp-particles{position:absolute;inset:0;z-index:2;pointer-events:none;}
.sp-p{position:absolute;width:3px;height:3px;border-radius:50%;background:#00B4FF;box-shadow:0 0 6px #00B4FF;animation:pfloat linear infinite;opacity:0;}
@keyframes pfloat{0%{opacity:0;transform:translateY(0) scale(0);}10%{opacity:1;transform:translateY(-20px) scale(1);}90%{opacity:0.6;}100%{opacity:0;transform:translateY(-600px) scale(0.5);}}
.sp-bottom{position:absolute;bottom:44px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:5;}
.sp-bar-wrap{width:130px;height:2px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;}
.sp-progress{height:100%;width:0%;background:linear-gradient(90deg,#003d99,#00B4FF,#7ee8ff);box-shadow:0 0 12px rgba(0,180,255,1);animation:loadBar 35s linear forwards;}
@keyframes loadBar{0%{width:0%;}100%{width:100%;}}
.sp-dots{display:flex;gap:6px;}
.sp-dots span{width:5px;height:5px;border-radius:50%;background:#00B4FF;box-shadow:0 0 6px #00B4FF;animation:dotP 1.2s ease-in-out infinite;}
.sp-dots span:nth-child(2){animation-delay:0.2s;}
.sp-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes dotP{0%,100%{opacity:0.25;transform:scale(1);}50%{opacity:1;transform:scale(1.5);}}

const CAR_PHOTOS = [
  'https://nikolay21werner-del.github.io/exclusive-music-bot/cover_lambo.png',
  'https://nikolay21werner-del.github.io/exclusive-music-bot/cover_ferrari.png',

  'https://nikolay21werner-del.github.io/exclusive-music-bot/cover_porsche.png',
  'https://nikolay21werner-del.github.io/exclusive-music-bot/cover_aston.png',
];
const GENRE_COLORS = {
  remix:      'linear-gradient(135deg,#1a3a6e,#0055bb)',
  love:       'linear-gradient(135deg,#6e1a2a,#bb0033)',
  hiphop:     'linear-gradient(135deg,#1a1a3e,#3a1a6e)',
  electronic: 'linear-gradient(135deg,#0a2a1a,#0a6e3a)',
  winter:     'linear-gradient(135deg,#0a1a3e,#0a4a8e)',
  city:       'linear-gradient(135deg,#1a2a1a,#2a5a2a)',
};
const GENRE_NAMES = {remix:'Remix',love:'Love',hiphop:'Hip-Hop',electronic:'Electronic',winter:'Winter',city:'City'};

const PROXY = 'https://web-production-6791f.up.railway.app';
const DEEZER_PROXY = 'https://corsproxy.io/?';
const VK_APP_ID = '54589059';

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let curTrack = null, curIdx = 0;
let playing = false, shuffle = false, repeat = false;
let carIdx = 0, curPhoto = '';
let liked = new Set();
let curPage = 'songs';
let filtered = [...TRACKS];
let srchTimer = null;
const audio = document.getElementById('audio');

// ═══════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(s){s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

// ═══════════════════════════════════════════════════════
// RENDER SONGS
// ═══════════════════════════════════════════════════════
function renderSongs(tracks) {
  filtered = tracks;
  const list = document.getElementById('track-list');
  list.innerHTML = '';
  tracks.forEach(function(t, i) {
    const photo = CAR_PHOTOS[t.id % CAR_PHOTOS.length];
    const isNow = curTrack && curTrack.id === t.id;
    const row = document.createElement('div');
    row.className = 't-row' + (isNow ? ' now' : '');
    row.dataset.id = t.id;
    row.innerHTML =
      '<div class="t-eq"><span class="eq-b"></span><span class="eq-b"></span><span class="eq-b"></span></div>' +
      '<span class="t-idx">' + (i+1) + '</span>' +
      '<div class="t-cover"><img src="' + esc(photo) + '" loading="lazy" alt=""></div>' +
      '<div class="t-info"><div class="t-title">' + esc(t.title) + '</div><div class="t-artist">' + esc(t.artist) + '</div></div>' +
      '<span class="t-dur">' + fmt(t.duration) + '</span>';
    row.addEventListener('click', function(){playLocal(t.id);});
    const sep = document.createElement('div');
    sep.className = 't-sep';
    list.appendChild(row);
    list.appendChild(sep);
  });
}

function setGenre(g, el) {
  document.querySelectorAll('.f-pill').forEach(function(b){b.classList.toggle('on', b.dataset.g === g);});
  renderSongs(g === 'all' ? TRACKS : TRACKS.filter(function(t){return t.genre === g;}));
}

// ═══════════════════════════════════════════════════════
// PLAY
// ═══════════════════════════════════════════════════════
function playLocal(id) {
  const t = TRACKS.find(function(x){return x.id === id;});
  if (!t) return;
  const idx = filtered.indexOf(t);
  curIdx = idx >= 0 ? idx : 0;
  loadTrack(t);
  audio.play().catch(function(){});
  playing = true;
  updateIcons();
  showPage('player');
}

function loadTrack(t) {
  if (!t) return;
  curTrack = t;
  // Railway proxy is down — audio plays via Telegram file_id sent through bot
  // For now show track info without audio src to avoid error loop
  audio.src = '';
  curPhoto = CAR_PHOTOS[carIdx++ % CAR_PHOTOS.length];
  updatePlayerUI();
  updateMini();
  document.querySelectorAll('.t-row').forEach(function(r){
    r.classList.toggle('now', r.dataset.id == t.id);
  });
}

function updatePlayerUI() {
  if (!curTrack) return;
  document.getElementById('pl-title').textContent = curTrack.title;
  document.getElementById('pl-artist').textContent = curTrack.artist;
  document.getElementById('pl-dur').textContent = fmt(curTrack.duration);
  document.getElementById('pl-src').textContent = 'EXCLUSIVE · ' + curTrack.artist.toUpperCase();
  // artwork
  document.getElementById('pl-art-img').src = curPhoto;
  document.getElementById('pl-bg-img').src = curPhoto;
  // heart
  const h = document.getElementById('pl-heart');
  const isLiked = liked.has(curTrack.id);
  h.classList.toggle('on', isLiked);
  h.innerHTML = isLiked
    ? '<svg viewBox="0 0 24 24" fill="#00B4FF" stroke="#00B4FF" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
  // art scale
  document.getElementById('pl-art').classList.toggle('play', playing);
}

function updateMini() {
  if (!curTrack) return;
  document.getElementById('mini-title').textContent = curTrack.title;
  document.getElementById('mini-artist').textContent = curTrack.artist;
  document.getElementById('mini-img').src = curPhoto;
  document.getElementById('mini').classList.add('show');
}

function togglePlay() {
  if (!curTrack) {
    if (TRACKS.length) playLocal(TRACKS[0].id);
    return;
  }
  if (playing) {
    audio.pause(); playing = false;
  } else {
    audio.play().catch(function(){}); playing = true;
  }
  updateIcons();
  document.getElementById('pl-art').classList.toggle('play', playing);
}

function updateIcons() {
  const pause = '<rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/>';
  const play = '<polygon points="5 3 19 12 5 21"/>';
  const ic = playing ? pause : play;
  document.getElementById('pl-play-ic').innerHTML = ic;
  document.getElementById('mini-play-ic').innerHTML = ic;
}

function prevTrack() {
  if (!filtered.length) return;
  curIdx = (curIdx - 1 + filtered.length) % filtered.length;
  loadTrack(filtered[curIdx]);
  if (playing) audio.play().catch(function(){});
}

function nextTrack() {
  if (!filtered.length) return;
  curIdx = shuffle ? Math.floor(Math.random()*filtered.length) : (curIdx+1)%filtered.length;
  loadTrack(filtered[curIdx]);
  if (playing) audio.play().catch(function(){});
}

function toggleShuffle() {
  shuffle = !shuffle;
  document.getElementById('pl-shuf').classList.toggle('on', shuffle);
}
function toggleRepeat() {
  repeat = !repeat;
  audio.loop = repeat;
  document.getElementById('pl-rep').classList.toggle('on', repeat);
}
function toggleHeart() {
  if (!curTrack) return;
  if (liked.has(curTrack.id)) liked.delete(curTrack.id);
  else liked.add(curTrack.id);
  updatePlayerUI();
}

function seekTo(v) {
  if (audio.duration) audio.currentTime = (v/100)*audio.duration;
}
function setVol(v) { audio.volume = v/100; }

// ═══════════════════════════════════════════════════════
// AUDIO EVENTS
// ═══════════════════════════════════════════════════════
audio.addEventListener('timeupdate', function() {
  if (!audio.duration) return;
  const pct = (audio.currentTime/audio.duration)*100;
  const seek = document.getElementById('pl-seek');
  if (seek && !seek.matches(':active')) {
    seek.value = pct;
    seek.style.setProperty('--p', pct + '%');
  }
  document.getElementById('pl-cur').textContent = fmt(audio.currentTime);
  // mini progress
  document.getElementById('mini-progress-line').style.width = pct + '%';
});
audio.addEventListener('ended', function(){ if (!repeat) nextTrack(); });
audio.addEventListener('play', function(){ playing=true; updateIcons(); document.getElementById('pl-art').classList.add('play'); });
audio.addEventListener('pause', function(){ playing=false; updateIcons(); document.getElementById('pl-art').classList.remove('play'); });
audio.addEventListener('error', function(){
  // Railway proxy is down — show error in player, don't loop
  if (document.getElementById('pl-src')) {
    document.getElementById('pl-src').textContent = 'НЕТ ПОДКЛЮЧЕНИЯ';
  }
});

// ═══════════════════════════════════════════════════════
// WORLD PLAYBACK (fallback)
// ═══════════════════════════════════════════════════════
async function playWorld(t) {
  curTrack = t;
  curPhoto = CAR_PHOTOS[carIdx++ % CAR_PHOTOS.length];
  updatePlayerUI();
  updateMini();
  if (t._deezer_preview) {
    audio.src = t._deezer_preview;
    audio.play().catch(function(){});
    playing = true; updateIcons();
    document.getElementById('pl-src').textContent = 'DEEZER PREVIEW';
    return;
  }
  if (t._itunes_preview) {
    audio.src = t._itunes_preview;
    audio.play().catch(function(){});
    playing = true; updateIcons();
    document.getElementById('pl-src').textContent = 'ITUNES PREVIEW';
    return;
  }
  document.getElementById('pl-src').textContent = 'EXCLUSIVE';
  // Proxy unavailable — gracefully degrade, show track info only
}

// ═══════════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════════
function onSearch(q) {
  clearTimeout(srchTimer);
  if (!q.trim()) { document.getElementById('srch-results').innerHTML=''; return; }
  srchTimer = setTimeout(function(){doSearch(q);}, 350);
}
function doSearch(q) {
  document.getElementById('srch-input').value = q;
  const local = TRACKS.filter(function(t){
    return t.title.toLowerCase().includes(q.toLowerCase()) || t.artist.toLowerCase().includes(q.toLowerCase());
  });
  const box = document.getElementById('srch-results');
  box.innerHTML = '<div class="srch-sec">Локальные</div>';
  if (local.length) {
    local.slice(0,10).forEach(function(t){ box.appendChild(buildRow(t,'local')); });
  } else {
    box.innerHTML += '<div style="padding:12px 16px;color:rgba(255,255,255,0.35);font-size:14px;">Не найдено</div>';
  }
  fetchDeezer(q).then(function(res){
    if (!res.length) return;
    const h = document.createElement('div'); h.className='srch-sec'; h.textContent='Deezer';
    box.appendChild(h);
    res.slice(0,8).forEach(function(t){ box.appendChild(buildRow(t,'world')); });
  }).catch(function(){});
  fetchItunes(q).then(function(res){
    if (!res.length) return;
    const h = document.createElement('div'); h.className='srch-sec'; h.textContent='iTunes';
    box.appendChild(h);
    res.slice(0,8).forEach(function(t){ box.appendChild(buildRow(t,'world')); });
  }).catch(function(){});
}

function buildRow(t, src) {
  const photo = t.cover || CAR_PHOTOS[0];
  const row = document.createElement('div');
  row.className = 't-row';
  row.innerHTML =
    '<div class="t-cover"><img src="' + esc(photo) + '" loading="lazy" alt=""></div>' +
    '<div class="t-info"><div class="t-title">' + esc(t.title) + '</div><div class="t-artist">' + esc(t.artist) + '</div></div>' +
    '<span class="t-dur">' + fmt(t.duration) + '</span>';
  row.addEventListener('click', function(){ src==='local' ? playLocal(t.id) : playWorld(t); });
  return row;
}

async function fetchDeezer(q) {
  const url = DEEZER_PROXY + encodeURIComponent('https://api.deezer.com/search?q=' + encodeURIComponent(q) + '&limit=20');
  const d = await (await fetch(url)).json();
  if (!d.data) return [];
  return d.data.map(function(x){return {title:x.title,artist:x.artist.name,duration:x.duration,cover:x.album.cover_small,genre:'remix',_deezer_preview:x.preview};});
}
async function fetchItunes(q) {
  const d = await (await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(q)+'&media=music&limit=20&entity=song')).json();
  if (!d.results) return [];
  return d.results.map(function(x){return {title:x.trackName,artist:x.artistName,duration:Math.round((x.trackTimeMillis||0)/1000),cover:x.artworkUrl60,genre:'remix',_itunes_preview:x.previewUrl};});
}

// ═══════════════════════════════════════════════════════
// GENRES PAGE
// ═══════════════════════════════════════════════════════
function initGenres() {
  const counts = {};
  TRACKS.forEach(function(t){ counts[t.genre]=(counts[t.genre]||0)+1; });
  const grid = document.getElementById('gen-grid');
  ['remix','love','hiphop','electronic','winter','city'].forEach(function(g){
    const card = document.createElement('div');
    card.className = 'gen-card';
    card.style.background = GENRE_COLORS[g] || '#1c1c1e';
    card.innerHTML = '<div class="gen-name">' + (GENRE_NAMES[g]||g) + '</div><div class="gen-count">' + (counts[g]||0) + ' треков</div>';
    card.addEventListener('click', function(){
      showPage('songs');
      document.querySelectorAll('.f-pill').forEach(function(b){b.classList.toggle('on',b.dataset.g===g);});
      renderSongs(TRACKS.filter(function(t){return t.genre===g;}));
    });
    grid.appendChild(card);
  });
}

// ═══════════════════════════════════════════════════════
// VK
// ═══════════════════════════════════════════════════════
function vkLogin() {
  const clean = window.location.origin + window.location.pathname;
  window.location.href = 'https://oauth.vk.com/authorize?client_id=' + VK_APP_ID +
    '&display=mobile&redirect_uri=' + encodeURIComponent(clean) +
    '&scope=&response_type=token&v=5.131&revoke=1';
}
async function vkLoadUser() {
  const token = localStorage.getItem('vk_token');
  if (!token) return;
  const wrap = document.getElementById('vk-wrap');
  try {
    const d = await (await fetch('https://api.vk.com/method/users.get?access_token='+token+'&v=5.131&fields=photo_50')).json();
    if (d.response && d.response[0]) {
      const u = d.response[0];
      wrap.innerHTML =
        '<div style="height:40px"></div>' +
        '<div class="vk-user-card"><div class="vk-av">' + (u.photo_50?'<img src="'+u.photo_50+'" alt="">':'👤') + '</div>' +
        '<div><div class="vk-uname">' + esc(u.first_name+' '+u.last_name) + '</div><div class="vk-usub">VK подключён</div></div></div>' +
        '<button class="vk-btn" style="margin-top:8px" onclick="showPage(&apos;search&apos;)">🔍 Глобальный поиск</button>' +
        '<button class="vk-btn" style="background:rgba(255,255,255,0.08)" onclick="showPage(&apos;songs&apos;)">🎵 Exclusive треки</button>' +
        '<button class="vk-out" onclick="vkLogout()">Выйти</button>';
    }
  } catch(e) {}
}
function vkLogout() {
  localStorage.removeItem('vk_token');
  location.reload();
}

// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════
function showPage(name) {
  curPage = name;
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.nav-item').forEach(function(b){b.classList.remove('active');});
  const pg = document.getElementById('pg-'+name);
  if (pg) pg.classList.add('active');
  const nb = document.getElementById('nav-'+name);
  if (nb) nb.classList.add('active');
  // hide mini when on player page
  document.getElementById('mini').style.visibility = name==='player' ? 'hidden' : 'visible';
}

// VK token from redirect
(function(){
  const h = window.location.hash;
  if (h && h.includes('access_token')) {
    const p = new URLSearchParams(h.slice(1));
    const t = p.get('access_token');
    if (t) { localStorage.setItem('vk_token', t); history.replaceState(null,'',location.pathname); }

renderSongs(TRACKS);
initGenres();

setTimeout(function(){

    curTrack = TRACKS[0];
