<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EXCLUSIVE MUSIC BOT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ─── Reset & Base ─── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --bg2: #0f0f1a;
    --cyan: #00d4ff;
    --violet: #b400ff;
    --pink: #ff0099;
    --white: #ffffff;
    --gray: #8a8a9a;
    --gray2: #1a1a2e;
    --gray3: #22223a;
    --radius: 16px;
    --mini-h: 72px;
  }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  /* ─── Scrollbar ─── */
  ::-webkit-scrollbar { width: 0; }

  /* ─── Neon Keyframes ─── */
  @keyframes pulse-ring {
    0%   { box-shadow: 0 0 0 0 rgba(0,212,255,.6), 0 0 0 0 rgba(180,0,255,.4); }
    70%  { box-shadow: 0 0 0 18px rgba(0,212,255,0), 0 0 0 28px rgba(180,0,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,212,255,0), 0 0 0 0 rgba(180,0,255,0); }
  }
  @keyframes rotate-cover {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes neon-flicker {
    0%,19%,21%,23%,25%,54%,56%,100% {
      text-shadow: 0 0 8px #00d4ff, 0 0 20px #00d4ff, 0 0 40px #b400ff, 0 0 80px #b400ff;
    }
    20%,24%,55% { text-shadow: none; }
  }
  @keyframes gradient-border {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes toast-in  { from { transform: translateY(80px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes toast-out { from { transform: translateY(0); opacity: 1; } to { transform: translateY(80px); opacity: 0; } }
  @keyframes waveBar {
    0%,100% { transform: scaleY(.3); }
    50%      { transform: scaleY(1); }
  }
  @keyframes swipe-hint {
    0%   { transform: translateY(0); opacity: .5; }
    50%  { transform: translateY(6px); opacity: 1; }
    100% { transform: translateY(0); opacity: .5; }
  }

  /* ─── Screen Manager ─── */
  .screen { position: fixed; inset: 0; transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s; will-change: transform; }
  #screen-list { z-index: 1; }
  #screen-player { z-index: 2; transform: translateY(100%); opacity: 0; }
  #screen-player.open { transform: translateY(0); opacity: 1; }

  /* ══════════════════════════════
     SCREEN 1 — TRACK LIST
  ══════════════════════════════ */
  #screen-list {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
  }

  /* Header */
  .header {
    flex-shrink: 0;
    padding: 18px 18px 12px;
    background: linear-gradient(180deg, rgba(180,0,255,.18) 0%, transparent 100%);
    position: relative;
  }
  .header-inner {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-svg {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    filter: drop-shadow(0 0 10px #00d4ff) drop-shadow(0 0 20px #b400ff);
  }
  .header-text { flex: 1; }
  .header-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .06em;
    background: linear-gradient(90deg, #00d4ff, #b400ff, #ff0099);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: neon-flicker 8s infinite;
  }
  .header-subtitle {
    font-size: 11px;
    color: var(--gray);
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-top: 1px;
  }
  .track-count-badge {
    background: linear-gradient(135deg, #00d4ff, #b400ff);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: .04em;
  }

  /* Wave bars decoration */
  .wave-deco {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 20px;
    margin-top: 10px;
  }
  .wave-deco span {
    display: block;
    width: 3px;
    border-radius: 3px;
    background: linear-gradient(0deg, #00d4ff, #b400ff);
    animation: waveBar 1.2s ease-in-out infinite;
  }

  /* Search */
  .search-wrap {
    flex-shrink: 0;
    padding: 0 14px 10px;
  }
  .search-box {
    display: flex;
    align-items: center;
    background: var(--gray2);
    border: 1px solid rgba(0,212,255,.2);
    border-radius: 12px;
    padding: 0 14px;
    gap: 10px;
    transition: border-color .2s;
  }
  .search-box:focus-within {
    border-color: #00d4ff;
    box-shadow: 0 0 12px rgba(0,212,255,.25);
  }
  .search-icon { font-size: 16px; color: var(--gray); flex-shrink: 0; }
  .search-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--white);
    font-size: 15px;
    padding: 11px 0;
    caret-color: #00d4ff;
  }
  .search-input::placeholder { color: var(--gray); }
  .search-clear {
    background: none;
    border: none;
    color: var(--gray);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    display: none;
    line-height: 1;
  }

  /* Filters */
  .filters-wrap {
    flex-shrink: 0;
    padding: 0 14px 10px;
  }
  .filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .filter-btn {
    flex-shrink: 0;
    background: var(--gray2);
    border: 1px solid rgba(255,255,255,.08);
    color: var(--gray);
    font-size: 13px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .filter-btn.active {
    background: linear-gradient(135deg, rgba(0,212,255,.2), rgba(180,0,255,.2));
    border-color: #00d4ff;
    color: var(--white);
    box-shadow: 0 0 12px rgba(0,212,255,.3);
  }

  /* Track List */
  .track-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 14px;
    padding-bottom: calc(var(--mini-h) + 20px);
    -webkit-overflow-scrolling: touch;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: .12em;
    padding: 10px 4px 6px;
  }

  .track-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 14px;
    cursor: pointer;
    transition: background .15s;
    position: relative;
  }
  .track-item:active { background: rgba(0,212,255,.07); }
  .track-item.playing {
    background: linear-gradient(90deg, rgba(0,212,255,.1), rgba(180,0,255,.07));
    border: 1px solid rgba(0,212,255,.2);
  }

  .track-cover {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gray2), var(--gray3));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    position: relative;
    transition: box-shadow .3s;
  }
  .track-item.playing .track-cover {
    box-shadow: 0 0 0 2px #00d4ff, 0 0 12px rgba(0,212,255,.5);
    animation: pulse-ring 2s ease-out infinite;
  }
  .track-cover-bg-remix    { background: linear-gradient(135deg, #1a0030, #3d0066); }
  .track-cover-bg-love     { background: linear-gradient(135deg, #2d0020, #660040); }
  .track-cover-bg-winter   { background: linear-gradient(135deg, #001a33, #003366); }
  .track-cover-bg-hiphop   { background: linear-gradient(135deg, #1a1400, #403300); }
  .track-cover-bg-electronic { background: linear-gradient(135deg, #001a1a, #004040); }
  .track-cover-bg-city     { background: linear-gradient(135deg, #1a1a00, #2d2d1a); }

  .track-info { flex: 1; min-width: 0; }
  .track-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--white);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .track-item.playing .track-title { color: #00d4ff; }
  .track-artist {
    font-size: 12px;
    color: var(--gray);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .track-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    flex-shrink: 0;
  }
  .track-duration {
    font-size: 12px;
    color: var(--gray);
    font-variant-numeric: tabular-nums;
  }
  .like-btn {
    background: none;
    border: none;
    font-size: 16px;
    cursor: pointer;
    padding: 2px;
    opacity: .5;
    transition: opacity .2s, transform .15s;
    line-height: 1;
  }
  .like-btn.liked { opacity: 1; filter: drop-shadow(0 0 4px #ff0099); }
  .like-btn:active { transform: scale(1.3); }

  /* Playing mini-indicator */
  .playing-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
    position: absolute;
    left: 54px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0;
    pointer-events: none;
  }
  .track-item.playing .playing-bars { opacity: 1; }
  .playing-bars span {
    display: block;
    width: 2.5px;
    background: #00d4ff;
    border-radius: 2px;
    animation: waveBar 1s ease-in-out infinite;
  }
  .playing-bars span:nth-child(2) { animation-delay: .2s; }
  .playing-bars span:nth-child(3) { animation-delay: .4s; }
  .paused .playing-bars span { animation-play-state: paused; }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--gray);
  }
  .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  /* ─── Mini Player ─── */
  .mini-player {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    height: var(--mini-h);
    z-index: 10;
    transform: translateY(100%);
    transition: transform .35s cubic-bezier(.4,0,.2,1);
    cursor: pointer;
  }
  .mini-player.visible { transform: translateY(0); }
  .mini-player-bg {
    position: absolute;
    inset: 0;
    background: rgba(15,15,26,.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-top: 1px solid rgba(0,212,255,.2);
  }
  .mini-progress-line {
    position: absolute;
    top: 0;
    left: 0;
    height: 2px;
    width: 0%;
    background: linear-gradient(90deg, #00d4ff, #b400ff, #ff0099);
    border-radius: 0 2px 2px 0;
    transition: width .3s linear;
    box-shadow: 0 0 6px rgba(0,212,255,.7);
  }
  .mini-inner {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 12px;
  }
  .mini-cover {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    border: 2px solid rgba(0,212,255,.4);
  }
  .mini-cover.spinning { animation: rotate-cover 8s linear infinite; }
  .mini-info { flex: 1; min-width: 0; }
  .mini-title {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mini-artist {
    font-size: 11px;
    color: var(--gray);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }
  .mini-controls {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .ctrl-btn {
    background: none;
    border: none;
    color: var(--white);
    font-size: 20px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, transform .1s;
  }
  .ctrl-btn:active { transform: scale(.9); background: rgba(255,255,255,.07); }
  .ctrl-btn.play-main {
    background: linear-gradient(135deg, #00d4ff, #b400ff);
    font-size: 18px;
    width: 40px;
    height: 40px;
    box-shadow: 0 0 14px rgba(0,212,255,.5);
  }
  .ctrl-btn.small { font-size: 16px; color: var(--gray); }
  .ctrl-btn.liked-ctrl { color: #ff0099; }

  /* ══════════════════════════════
     SCREEN 2 — FULL PLAYER
  ══════════════════════════════ */
  #screen-player {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .player-bg {
    position: absolute;
    inset: 0;
    background: var(--bg);
    z-index: 0;
  }
  .player-bg-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 30%, rgba(180,0,255,.3) 0%, rgba(0,212,255,.15) 40%, transparent 70%);
    z-index: 0;
    transition: background .5s;
  }

  .player-content {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Swipe hint arrow */
  .swipe-hint {
    text-align: center;
    padding-top: 10px;
    padding-bottom: 4px;
    color: rgba(255,255,255,.3);
    font-size: 20px;
    animation: swipe-hint 2s ease-in-out infinite;
    flex-shrink: 0;
  }

  /* Back button */
  .player-top {
    display: flex;
    align-items: center;
    padding: 4px 16px 0;
    flex-shrink: 0;
  }
  .back-btn {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    color: var(--white);
    font-size: 20px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
  }
  .back-btn:active { background: rgba(255,255,255,.12); }
  .player-top-label {
    flex: 1;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--gray);
  }
  .player-menu-btn {
    width: 38px;
    height: 38px;
    background: none;
    border: none;
    color: var(--gray);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Big cover */
  .player-cover-wrap {
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    padding: 20px 0 16px;
  }
  .player-cover-ring {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg, #00d4ff, #b400ff, #ff0099, #00d4ff);
    background-size: 300% 300%;
    animation: gradient-border 3s ease infinite;
    box-shadow: 0 0 30px rgba(0,212,255,.4), 0 0 60px rgba(180,0,255,.3);
  }
  .player-cover-ring.pulse { animation: gradient-border 3s ease infinite, pulse-ring 2s ease-out infinite; }
  .player-cover {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--gray2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 72px;
    overflow: hidden;
  }
  .player-cover.spinning { animation: rotate-cover 12s linear infinite; }
  .player-cover.spinning-paused { animation: rotate-cover 12s linear infinite; animation-play-state: paused; }

  /* Track info */
  .player-info {
    flex-shrink: 0;
    padding: 0 24px 8px;
    text-align: center;
  }
  .player-title {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 4px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .player-artist {
    font-size: 14px;
    color: var(--gray);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-genre-badge {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    color: #00d4ff;
    background: rgba(0,212,255,.12);
    border: 1px solid rgba(0,212,255,.2);
    padding: 2px 10px;
    border-radius: 20px;
    letter-spacing: .06em;
    text-transform: uppercase;
  }

  /* Progress */
  .player-progress-wrap {
    flex-shrink: 0;
    padding: 8px 24px;
  }
  .progress-bar-container {
    position: relative;
    height: 4px;
    background: rgba(255,255,255,.1);
    border-radius: 4px;
    cursor: pointer;
    touch-action: none;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #00d4ff, #b400ff);
    box-shadow: 0 0 8px rgba(0,212,255,.6);
    width: 0%;
    transition: width .25s linear;
    pointer-events: none;
  }
  .progress-thumb {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px rgba(0,212,255,.8), 0 2px 8px rgba(0,0,0,.5);
    left: 0%;
    transition: left .25s linear;
    pointer-events: none;
  }
  .time-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 11px;
    color: var(--gray);
    font-variant-numeric: tabular-nums;
  }

  /* Controls */
  .player-controls {
    flex-shrink: 0;
    padding: 8px 20px 6px;
  }
  .controls-row1 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .ctrl-icon {
    background: none;
    border: none;
    color: var(--gray);
    font-size: 22px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
    position: relative;
  }
  .ctrl-icon:active { transform: scale(.88); }
  .ctrl-icon.active {
    color: #00d4ff;
    filter: drop-shadow(0 0 6px #00d4ff);
  }
  .ctrl-icon.active::after {
    content: '';
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #00d4ff;
  }
  .ctrl-like-big {
    color: var(--gray);
    font-size: 24px;
  }
  .ctrl-like-big.liked { color: #ff0099; filter: drop-shadow(0 0 8px #ff0099); }
  .ctrl-play-big {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00d4ff, #b400ff);
    border: none;
    color: #fff;
    font-size: 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(0,212,255,.6), 0 0 40px rgba(180,0,255,.4);
    transition: transform .12s, box-shadow .12s;
    flex-shrink: 0;
  }
  .ctrl-play-big:active { transform: scale(.92); box-shadow: 0 0 10px rgba(0,212,255,.4); }
  .ctrl-icon-nav { color: var(--white); font-size: 26px; }

  .controls-row2 {
    display: flex;
    justify-content: center;
    gap: 24px;
    padding-top: 4px;
  }

  /* ─── Toast ─── */
  .toast {
    position: fixed;
    bottom: calc(var(--mini-h) + 14px);
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(20,20,35,.95);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0,212,255,.3);
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 500;
    color: var(--white);
    z-index: 100;
    white-space: nowrap;
    pointer-events: none;
    animation: toast-in .3s ease forwards;
    box-shadow: 0 4px 20px rgba(0,0,0,.5), 0 0 20px rgba(0,212,255,.2);
  }
  .toast.out { animation: toast-out .3s ease forwards; }
</style>
</head>
<body>

<!-- ══════════ SCREEN 1 — LIST ══════════ -->
<div class="screen" id="screen-list">
  <!-- Header -->
  <div class="header">
    <div class="header-inner">
      <!-- SVG Logo -->
      <svg class="logo-svg" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Exclusive Music">
        <circle cx="22" cy="22" r="20" stroke="url(#lg1)" stroke-width="2"/>
        <circle cx="22" cy="22" r="10" fill="url(#lg2)" opacity=".85"/>
        <circle cx="22" cy="22" r="4" fill="#fff"/>

════════════════════════════════ */
function fmtTime(s) {
  if (isNaN(s) || !isFinite(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function coverClass(genre) {
  const map = { remix:'remix', love:'love', winter:'winter', hiphop:'hiphop', electronic:'electronic', city:'city' };
  return 'track-cover-bg-' + (map[genre] || 'remix');
}

function glowForGenre(genre) {
  const map = {
    remix:    'radial-gradient(ellipse at 50% 30%, rgba(180,0,255,.3) 0%, rgba(0,212,255,.15) 40%, transparent 70%)',
    love:     'radial-gradient(ellipse at 50% 30%, rgba(255,0,153,.3) 0%, rgba(180,0,255,.15) 40%, transparent 70%)',
    winter:   'radial-gradient(ellipse at 50% 30%, rgba(0,180,255,.35) 0%, rgba(0,80,200,.15) 40%, transparent 70%)',
    hiphop:   'radial-gradient(ellipse at 50% 30%, rgba(255,160,0,.25) 0%, rgba(180,0,255,.15) 40%, transparent 70%)',
    electronic:'radial-gradient(ellipse at 50% 30%, rgba(0,255,200,.25) 0%, rgba(0,180,255,.15) 40%, transparent 70%)',
    city:     'radial-gradient(ellipse at 50% 30%, rgba(255,200,0,.2) 0%, rgba(180,0,255,.15) 40%, transparent 70%)',
  };
  return map[genre] || map.remix;
}

function saveLikes() { localStorage.setItem('exclusive_likes', JSON.stringify(likes)); }

/* ════════════════════════════════
   WAVE DECO INIT
════════════════════════════════ */
(function initWave() {
  const wrap = document.getElementById('wave-deco');
  const delays = [0,.1,.2,.35,.15,.4,.05,.25,.3,.1,.45,.2];
  const heights = [8,14,10,18,12,7,16,11,15,9,13,6];
  delays.forEach((d,i) => {
    const s = document.createElement('span');
    s.style.height = heights[i]+'px';
    s.style.animationDelay = d+'s';
    wrap.appendChild(s);
  });
})();

/* ════════════════════════════════
   RENDER TRACK LIST
════════════════════════════════ */
function renderList() {
  const container = document.getElementById('track-list');
  const q = searchQuery.toLowerCase();

  filteredTracks = TRACKS.filter(t => {
    const genreOk = activeGenre === 'all' || t.genre === activeGenre;
    const searchOk = !q || t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q);
    return genreOk && searchOk;
  });

  document.getElementById('count-badge').textContent = filteredTracks.length;

  if (!filteredTracks.length) {
    container.innerHTML = `<div class="empty-state"><div class="emoji">🔍</div><p>Ничего не найдено</p></div>`;
    return;
  }

  container.innerHTML = filteredTracks.map((t, idx) => {
    const playing = currentTrack && currentTrack.id === t.id;
    const liked = !!likes[t.id];
    return `
      <div class="track-item${playing ? ' playing' : ''}" data-idx="${idx}" data-id="${t.id}">
        <div class="track-cover ${coverClass(t.genre)}">${t.emoji}</div>
        <div class="track-info">
          <div class="track-title">${t.title}</div>
          <div class="track-artist">${t.artist}</div>
        </div>
        <div class="track-right">
          <span class="track-duration">${fmtTime(t.duration)}</span>
          <button class="like-btn${liked ? ' liked' : ''}" data-id="${t.id}" aria-label="Лайк">${liked ? '❤️' : '🤍'}</button>
        </div>
        ${playing ? '<div class="playing-bars"><span></span><span></span><span></span></div>' : ''}
      </div>
    `;
  }).join('');
}

/* ════════════════════════════════
   PLAY / PAUSE
════════════════════════════════ */
function playTrack(track, idx) {
  currentTrack = track;
  currentIndex = idx;
  isPlaying = false;

  // Set audio source
  audioEl.src = PROXY_URL + '/audio/' + encodeURIComponent(track.file_id);
  audioEl.load();
  audioEl.play().then(() => {
    isPlaying = true;
    updateUI();
  }).catch(e => {
    console.error('Play error:', e);
    showToast('Ошибка воспроизведения');
    isPlaying = false;
    updateUI();
  });

  updateUI();
  updatePlayerScreen();
}

function togglePlay() {
  if (!currentTrack) return;
  if (isPlaying) {
    audioEl.pause();
    isPlaying = false;
  } else {
    audioEl.play().then(() => { isPlaying = true; updateUI(); }).catch(() => {});
    isPlaying = true;
  }
  updateUI();
}

function playNext() {
  if (!filteredTracks.length) return;
  let idx;
  if (isShuffle) {
    idx = Math.floor(Math.random() * filteredTracks.length);
  } else {
    const cur = filteredTracks.findIndex(t => t.id === currentTrack?.id);
    idx = cur === -1 ? 0 : (cur + 1) % filteredTracks.length;
  }
  playTrack(filteredTracks[idx], idx);
}

function playPrev() {
  if (!filteredTracks.length) return;
  if (audioEl.currentTime > 3) { audioEl.currentTime = 0; return; }
  const cur = filteredTracks.findIndex(t => t.id === currentTrack?.id);
  const idx = cur <= 0 ? filteredTracks.length - 1 : cur - 1;
  playTrack(filteredTracks[idx], idx);
}

/* ════════════════════════════════
   UPDATE UI
════════════════════════════════ */
function updateUI() {
  if (!currentTrack) return;

  const liked = !!likes[currentTrack.id];
  const playIcon = isPlaying ? '⏸' : '▶';

  // Mini player
  const mini = document.getElementById('mini-player');
  mini.classList.add('visible');
  document.getElementById('mini-cover').textContent = currentTrack.emoji;
  document.getElementById('mini-cover').className = 'mini-cover ' + coverClass(currentTrack.genre) + (isPlaying ? ' spinning' : '');
  document.getElementById('mini-title').textContent = currentTrack.title;
  document.getElementById('mini-artist').textContent = currentTrack.artist;
  document.getElementById('mini-play').textContent = playIcon;
  const miniLike = document.getElementById('mini-like');
  miniLike.textContent = liked ? '❤️' : '♡';
  miniLike.className = 'ctrl-btn small' + (liked ? ' liked-ctrl' : '');

  // Full player
  document.getElementById('ctrl-play-big').textContent = playIcon;
  document.getElementById('ctrl-like-big').textContent = liked ? '❤️' : '♡';
  document.getElementById('ctrl-like-big').className = 'ctrl-icon ctrl-like-big' + (liked ? ' liked' : '');

  // Shuffle/repeat
  document.getElementById('ctrl-shuffle').classList.toggle('active', isShuffle);
  document.getElementById('ctrl-repeat').classList.toggle('active', isRepeat);

  // Cover spin
  const cover = document.getElementById('player-cover');
  cover.className = 'player-cover ' + (isPlaying ? 'spinning' : 'spinning-paused');
  const ring = document.getElementById('player-ring');
  ring.classList.toggle('pulse', isPlaying);

  // Re-render list to show playing state
  renderList();
}

function updatePlayerScreen() {
  if (!currentTrack) return;
  document.getElementById('player-title').textContent = currentTrack.title;
  document.getElementById('player-artist').textContent = currentTrack.artist;
  document.getElementById('player-cover').textContent = currentTrack.emoji;
  document.getElementById('mini-cover').textContent = currentTrack.emoji;
  document.getElementById('player-genre-badge').textContent = currentTrack.genre.toUpperCase();
  document.getElementById('player-glow').style.background = glowForGenre(currentTrack.genre);
  document.getElementById('time-total').textContent = fmtTime(currentTrack.duration);
}

/* ════════════════════════════════
   PROGRESS BAR
════════════════════════════════ */
audioEl.addEventListener('timeupdate', () => {
  if (progressDragging) return;
  const dur = audioEl.duration || currentTrack?.duration || 1;
  const pct = (audioEl.currentTime / dur) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-thumb').style.left = pct + '%';
  document.getElementById('mini-progress').style.width = pct + '%';
  document.getElementById('time-cur').textContent = fmtTime(audioEl.currentTime);
  if (!isNaN(audioEl.duration))
    document.getElementById('time-total').textContent = fmtTime(audioEl.duration);
});

audioEl.addEventListener('ended', () => {
  if (isRepeat) {
    audioEl.currentTime = 0;
    audioEl.play();
  } else {
    playNext();
  }
});

audioEl.addEventListener('play',  () => { isPlaying = true;  updateUI(); });
audioEl.addEventListener('pause', () => { isPlaying = false; updateUI(); });

// Progress click / drag
function seekTo(e, el) {
  const rect = el.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const pct = Math.max(0, Math.min(1, x / rect.width));
  const dur = audioEl.duration || currentTrack?.duration || 1;
  audioEl.currentTime = pct * dur;
  document.getElementById('progress-fill').style.width = (pct*100) + '%';
  document.getElementById('progress-thumb').style.left = (pct*100) + '%';
}

const progressBar = document.getElementById('progress-bar');
progressBar.addEventListener('click', e => seekTo(e, progressBar));
progressBar.addEventListener('touchstart', e => { progressDragging = true; seekTo(e, progressBar); }, {passive:true});
progressBar.addEventListener('touchmove',  e => seekTo(e, progressBar), {passive:true});
progressBar.addEventListener('touchend',   () => { progressDragging = false; });

/* ════════════════════════════════
   SCREEN NAVIGATION
════════════════════════════════ */
function openPlayer() {
  document.getElementById('screen-player').classList.add('open');
  playerOpen = true;
}
function closePlayer() {
  document.getElementById('screen-player').classList.remove('open');
  playerOpen = false;
}

document.getElementById('mini-player').addEventListener('click', openPlayer);
document.getElementById('player-back').addEventListener('click', closePlayer);

// Swipe down to close
let touchStartY = 0;
const swipeTarget = document.getElementById('player-swipe-target');
swipeTarget.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, {passive:true});
swipeTarget.addEventListener('touchend', e => {
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (dy > 80) closePlayer();
}, {passive:true});

/* ════════════════════════════════
   TRACK LIST EVENTS
════════════════════════════════ */
document.getElementById('track-list').addEventListener('click', e => {
  // Like button
  const likeBtn = e.target.closest('.like-btn');
  if (likeBtn) {
    e.stopPropagation();
    const id = parseInt(likeBtn.dataset.id);
    toggleLike(id);
    return;
  }
  // Track item
  const item = e.target.closest('.track-item');
  if (item) {
    const idx = parseInt(item.dataset.idx);
    const id = parseInt(item.dataset.id);
    const track = filteredTracks[idx];
    if (currentTrack && currentTrack.id === id) {
      togglePlay();
    } else {
      playTrack(track, idx);
    }
  }
});

function toggleLike(id, fromBig) {
  if (likes[id]) {
    delete likes[id];
    if (!fromBig) showToast('Убрано из лайков');
  } else {
    likes[id] = true;
    showToast('❤️ Добавлено в лайки');
  }
  saveLikes();
  updateUI();
}

/* ════════════════════════════════
   CONTROLS
════════════════════════════════ */
document.getElementById('mini-play').addEventListener('click', togglePlay);
document.getElementById('mini-next').addEventListener('click', playNext);
document.getElementById('mini-like').addEventListener('click', () => { if(currentTrack) toggleLike(currentTrack.id); });
document.getElementById('ctrl-play-big').addEventListener('click', togglePlay);
document.getElementById('ctrl-prev').addEventListener('click', playPrev);
document.getElementById('ctrl-next').addEventListener('click', playNext);
document.getElementById('ctrl-shuffle').addEventListener('click', () => {
  isShuffle = !isShuffle;
  showToast(isShuffle ? '🔀 Перемешать включено' : 'Перемешать выключено');
  updateUI();
});
document.getElementById('ctrl-repeat').addEventListener('click', () => {
  isRepeat = !isRepeat;
  showToast(isRepeat ? '🔁 Повтор включён' : 'Повтор выключен');
  updateUI();
});
document.getElementById('ctrl-like-big').addEventListener('click', () => {
  if(currentTrack) toggleLike(currentTrack.id, true);
  showToast(likes[currentTrack?.id] ? '❤️ Добавлено в лайки' : 'Убрано из лайков');
});

/* ════════════════════════════════
   SEARCH
════════════════════════════════ */
const searchInput = document.getElementById('search-input');
const searchClear = document.getElementById('search-clear');
searchInput.addEventListener('input', e => {
  searchQuery = e.target.value;
  searchClear.style.display = searchQuery ? 'block' : 'none';
  renderList();
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchQuery = '';
  searchClear.style.display = 'none';
  renderList();
});

/* ════════════════════════════════
   FILTERS
════════════════════════════════ */
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeGenre = btn.dataset.genre;
  renderList();
});

/* ════════════════════════════════
   TOAST
════════════════════════════════ */
let toastTimer = null;
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  if (toastTimer) clearTimeout(toastTimer);

  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);

  toastTimer = setTimeout(() => {
    t.classList.add('out');
    setTimeout(() => t.remove(), 300);
  }, 1800);
}

/* ════════════════════════════════
   INIT
════════════════════════════════ */
renderList();
</script>
</body>
</html>
