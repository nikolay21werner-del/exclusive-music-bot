<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EXCLUSIVE MUSIC BOT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,'SF Pro Display','SF Pro Text',system-ui,sans-serif;color:#fff;}

/* ── PAGES ─────────────────────────────────────────── */
.page{position:fixed;inset:0;bottom:0;overflow-y:auto;overflow-x:hidden;display:none;
  padding-bottom:130px; /* nav + mini */
  -webkit-overflow-scrolling:touch;}
.page.active{display:block;}
#pg-player{overflow:hidden!important;padding-bottom:0!important;}

/* ── PAGE 1: SONGS ──────────────────────────────────── */
#pg-songs{background:#000;}

.songs-header{padding:52px 16px 8px;}
.songs-big-title{font-size:34px;font-weight:700;color:#fff;letter-spacing:-0.5px;}
.songs-subtitle{font-size:13px;color:rgba(255,255,255,0.45);margin-top:4px;}

.filter-tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;}
.filter-tabs::-webkit-scrollbar{display:none;}
.genre-tab{flex-shrink:0;padding:6px 16px;border-radius:20px;border:none;
  background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.65);
  font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .2s;}
.genre-tab.active{background:#00B4FF;color:#fff;}

#track-list{padding:0 0 8px;}

.track-row{display:flex;align-items:center;padding:9px 16px;gap:12px;cursor:pointer;
  transition:background .15s;position:relative;}
.track-row:active{background:rgba(255,255,255,0.06);}
.track-row.playing .track-title{color:#00B4FF;}

.track-num{width:20px;text-align:center;font-size:14px;color:rgba(255,255,255,0.35);flex-shrink:0;}
.track-row.playing .track-num{display:none;}
.eq-anim{display:none;width:20px;justify-content:center;align-items:flex-end;height:18px;flex-shrink:0;}
.track-row.playing .eq-anim{display:flex;}

.eq-bar{display:inline-block;width:3px;margin:0 1px;background:#00B4FF;border-radius:2px;vertical-align:bottom;}
@keyframes eq1{0%,100%{height:4px}50%{height:14px}}
@keyframes eq2{0%,100%{height:8px}50%{height:4px}}
@keyframes eq3{0%,100%{height:6px}50%{height:16px}}
.eq-bar:nth-child(1){animation:eq1 0.6s ease infinite;}
.eq-bar:nth-child(2){animation:eq2 0.5s ease infinite;}
.eq-bar:nth-child(3){animation:eq3 0.7s ease infinite;}

.track-cover{width:48px;height:48px;border-radius:8px;flex-shrink:0;overflow:hidden;
  background:rgba(255,255,255,0.08);}
.track-cover img{width:100%;height:100%;object-fit:cover;display:block;}

.track-info{flex:1;min-width:0;}
.track-title{font-size:16px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track-artist{font-size:13px;color:rgba(255,255,255,0.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}

.track-duration{font-size:13px;color:rgba(255,255,255,0.35);flex-shrink:0;}
.track-more{width:28px;height:28px;background:none;border:none;color:rgba(255,255,255,0.35);
  font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;}

.track-sep{height:0.5px;background:rgba(255,255,255,0.08);margin-left:76px;}

/* ── PAGE 2: SEARCH ─────────────────────────────────── */
#pg-search{background:#000;}

.search-header{padding:52px 16px 12px;}
.search-big-title{font-size:34px;font-weight:700;}

.search-bar-wrap{padding:0 16px 12px;}
.search-bar{display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,0.1);border-radius:12px;padding:10px 14px;}
.search-bar svg{flex-shrink:0;color:rgba(255,255,255,0.45);}
.search-bar input{background:none;border:none;outline:none;color:#fff;font-size:16px;
  font-family:inherit;width:100%;placeholder-color:rgba(255,255,255,0.4);}
.search-bar input::placeholder{color:rgba(255,255,255,0.4);}

.search-tags{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 16px;}
.search-tag{padding:7px 16px;border-radius:20px;background:rgba(255,255,255,0.08);
  color:rgba(255,255,255,0.7);font-size:13px;font-family:inherit;border:none;cursor:pointer;}
.search-tag:active{background:rgba(255,255,255,0.15);}

.search-section-title{font-size:17px;font-weight:600;color:#fff;padding:12px 16px 6px;}
#search-results{padding:0;}

/* ── PAGE 3: GENRES ─────────────────────────────────── */
#pg-genres{background:#000;}

.genres-header{padding:52px 16px 16px;}
.genres-big-title{font-size:34px;font-weight:700;}

.genres-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px;}

.genre-card{height:110px;border-radius:12px;padding:16px;cursor:pointer;
  display:flex;flex-direction:column;justify-content:flex-end;
  transition:transform .15s,opacity .15s;overflow:hidden;position:relative;}
.genre-card:active{transform:scale(0.97);}
.genre-card-name{font-size:17px;font-weight:700;color:#fff;line-height:1.2;}
.genre-card-count{font-size:12px;color:rgba(255,255,255,0.65);margin-top:3px;}

/* ── PAGE 4: PLAYER ─────────────────────────────────── */
#pg-player{background:#000;overflow:hidden;padding-bottom:0;display:flex;flex-direction:column;height:100%;position:relative;}

.player-bg{position:absolute;inset:0;z-index:0;overflow:hidden;}
.player-bg-img{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(60px) brightness(0.28) saturate(2.5);}
.player-bg-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.5) 0%,rgba(0,0,0,0.7) 60%,rgba(0,0,0,0.9) 100%);}

.player-inner{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:0 24px;overflow:hidden;}

/* Top bar */
.player-topbar{display:flex;align-items:center;justify-content:space-between;padding-top:env(safe-area-inset-top,12px);padding-top:max(12px,env(safe-area-inset-top,12px));padding-bottom:12px;margin-top:4px;}
.player-topbar-label{font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);}
.player-circle-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.12);
  border:none;color:rgba(255,255,255,0.8);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.player-circle-btn:active{background:rgba(255,255,255,0.2);}

/* Album art */
.player-art-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 0;}
.player-art{width:min(88vw,340px);height:min(88vw,340px);border-radius:18px;overflow:hidden;
  box-shadow:0 28px 70px rgba(0,0,0,0.8),0 0 60px rgba(0,80,200,0.2);
  transition:transform 0.4s cubic-bezier(.34,1.56,.64,1);}
.player-art.paused{transform:scale(0.90);}
.player-art.playing{transform:scale(1.0);}
.player-art img{width:100%;height:100%;object-fit:cover;display:block;}

/* Track info */
.player-info-row{display:flex;align-items:center;gap:12px;padding:0 0 16px;}
.player-info{flex:1;min-width:0;}
.player-title{font-size:22px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-artist{font-size:17px;color:#00B4FF;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-heart{width:36px;height:36px;background:none;border:none;color:rgba(255,255,255,0.6);
  font-size:22px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;}
.player-heart.liked{color:#00B4FF;}

/* Progress */
.player-progress{padding:0 0 6px;}
.progress-track{position:relative;height:3px;background:rgba(255,255,255,0.18);border-radius:3px;cursor:pointer;}
.progress-fill{height:100%;background:#fff;border-radius:3px;pointer-events:none;transition:width .1s linear;}
.progress-thumb{position:absolute;top:50%;right:0;transform:translate(50%,-50%);
  width:12px;height:12px;border-radius:50%;background:#fff;pointer-events:none;}
.progress-times{display:flex;justify-content:space-between;margin-top:6px;}
.progress-time{font-size:11px;color:rgba(255,255,255,0.45);font-variant-numeric:tabular-nums;}

/* Controls */
.player-controls{display:flex;align-items:center;justify-content:space-between;padding:6px 0 16px;}
.ctrl-side{width:44px;height:44px;background:none;border:none;color:rgba(255,255,255,0.5);
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.ctrl-side.active{color:#00B4FF;}
.ctrl-side:active{opacity:0.7;}
.ctrl-skip{width:50px;height:50px;background:none;border:none;color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.ctrl-skip:active{opacity:0.7;}
.ctrl-play{width:72px;height:72px;border-radius:50%;background:#fff;border:none;
  color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);transition:transform .1s;}
.ctrl-play:active{transform:scale(0.95);}

/* Volume */
.player-vol{display:flex;align-items:center;gap:10px;padding:0 0 12px;}
.vol-icon{color:rgba(255,255,255,0.45);flex-shrink:0;}
.vol-slider{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;
  background:rgba(255,255,255,0.25);outline:none;cursor:pointer;}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;cursor:pointer;}
.vol-slider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:none;cursor:pointer;}

.player-source{font-size:11px;color:rgba(255,255,255,0.3);text-align:center;text-transform:uppercase;letter-spacing:0.06em;padding:0 0 env(safe-area-inset-bottom,8px);}

/* ── PAGE 5: VK ─────────────────────────────────────── */
#pg-vk{background:#000;}

.vk-header{padding:52px 16px 16px;}
.vk-big-title{font-size:34px;font-weight:700;}

.vk-center{display:flex;flex-direction:column;align-items:center;padding:32px 24px;gap:20px;text-align:center;}
.vk-logo{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,#2787F5,#5865F2);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(39,135,245,0.35);}
.vk-page-title{font-size:22px;font-weight:700;color:#fff;}
.vk-page-sub{font-size:14px;color:rgba(255,255,255,0.45);line-height:1.55;}
.vk-login-btn{width:100%;max-width:320px;padding:14px 24px;border-radius:14px;border:none;
  background:#2787F5;color:#fff;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;}
.vk-login-btn:active{opacity:0.85;}
.vk-hint{font-size:12px;color:rgba(255,255,255,0.3);line-height:1.6;max-width:280px;}

.vk-user-card{width:100%;max-width:320px;display:flex;align-items:center;gap:14px;
  background:rgba(255,255,255,0.06);border-radius:14px;padding:16px;}
.vk-avatar{width:52px;height:52px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,0.1);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.vk-user-name{font-size:16px;font-weight:600;color:#fff;}
.vk-user-sub{font-size:13px;color:rgba(255,255,255,0.45);margin-top:2px;}

.vk-action-btn{width:100%;max-width:320px;padding:13px 24px;border-radius:14px;border:none;
  background:rgba(255,255,255,0.1);color:#fff;font-size:15px;font-weight:500;font-family:inherit;cursor:pointer;}
.vk-action-btn:active{background:rgba(255,255,255,0.15);}
.vk-logout-btn{background:none;border:none;color:rgba(255,0,60,0.7);font-size:14px;font-family:inherit;cursor:pointer;padding:4px;}

/* ── MINI PLAYER ────────────────────────────────────── */
#mini{position:fixed;bottom:49px;left:0;right:0;z-index:90;
  height:64px;background:rgba(28,28,30,0.95);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:none;flex-direction:column;cursor:pointer;
  border-top:0.5px solid rgba(255,255,255,0.08);}
#mini.visible{display:flex;}
#mini.hide-mini{display:none!important;}

.mini-body{display:flex;align-items:center;height:64px;padding:0 12px 0 14px;gap:10px;}
.mini-thumb{width:44px;height:44px;border-radius:8px;overflow:hidden;
  background:rgba(255,255,255,0.08);flex-shrink:0;}
.mini-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.mini-info{flex:1;min-width:0;}
.mini-title{font-size:14px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-artist{font-size:12px;color:rgba(255,255,255,0.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.mini-controls{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.mini-btn{width:36px;height:36px;background:none;border:none;color:rgba(255,255,255,0.85);
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.mini-btn:active{opacity:0.6;}

.mini-progress{height:2px;background:rgba(255,255,255,0.15);}
.mini-progress-fill{height:100%;background:rgba(255,255,255,0.55);width:0%;transition:width .1s linear;}

/* ── BOTTOM NAV ─────────────────────────────────────── */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:49px;background:rgba(0,0,0,0.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;border-top:0.5px solid rgba(255,255,255,0.12);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;background:none;border:none;color:rgba(255,255,255,0.35);cursor:pointer;padding:0;
  font-family:inherit;}
.nav-btn svg{width:22px;height:22px;}
.nav-btn span{font-size:9px;font-weight:500;letter-spacing:0.01em;}
.nav-btn.active{color:#00B4FF;}
.nav-btn:active{opacity:0.7;}

/* ── SEEK RANGE (songs/progress area) ──────────────── */
input[type=range]{-webkit-appearance:none;appearance:none;}

/* ── SCROLLBAR HIDE ─────────────────────────────────── */
::-webkit-scrollbar{display:none;}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════════ -->
<!-- PAGE 1: МУЗЫКА                                     -->
<!-- ══════════════════════════════════════════════════ -->
<div id="pg-songs" class="page active">
  <div class="songs-header">
    <div class="songs-big-title">Exclusive Music</div>
    <div class="songs-subtitle">@exclusive_music_remix · 170 треков</div>
  </div>
  <div class="filter-tabs">
    <button class="genre-tab active" data-genre="all" onclick="filterSongs('all',this)">Все</button>
    <button class="genre-tab" data-genre="remix" onclick="filterSongs('remix',this)">Remix</button>
    <button class="genre-tab" data-genre="love" onclick="filterSongs('love',this)">Love</button>
    <button class="genre-tab" data-genre="hiphop" onclick="filterSongs('hiphop',this)">Hip-Hop</button>
    <button class="genre-tab" data-genre="electronic" onclick="filterSongs('electronic',this)">Electronic</button>
    <button class="genre-tab" data-genre="winter" onclick="filterSongs('winter',this)">Winter</button>
    <button class="genre-tab" data-genre="city" onclick="filterSongs('city',this)">City</button>
  </div>
  <div id="track-list"></div>
</div>

<!-- ══════════════════════════════════════════════════ -->
<!-- PAGE 2: ПОИСК                                      -->
<!-- ══════════════════════════════════════════════════ -->
<div id="pg-search" class="page">
  <div class="search-header">
    <div class="search-big-title">Поиск</div>
  </div>
  <div class="search-bar-wrap">
    <div class="search-bar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="search-input" type="text" placeholder="Исполнители, песни..." oninput="onSearch(this.value)" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
  </div>
  <div class="search-tags">
    <button class="search-tag" onclick="doTagSearch('The Weeknd')">The Weeknd</button>
    <button class="search-tag" onclick="doTagSearch('Drake')">Drake</button>
    <button class="search-tag" onclick="doTagSearch('Miyagi')">Miyagi</button>
    <button class="search-tag" onclick="doTagSearch('Anna Asti')">Anna Asti</button>
    <button class="search-tag" onclick="doTagSearch('Eminem')">Eminem</button>
  </div>
  <div id="search-results"></div>
</div>

<!-- ══════════════════════════════════════════════════ -->
<!-- PAGE 3: ЖАНРЫ                                      -->
<!-- ══════════════════════════════════════════════════ -->
<div id="pg-genres" class="page">
  <div class="genres-header">
    <div class="genres-big-title">Жанры</div>
  </div>
  <div class="genres-grid" id="genres-grid"></div>
</div>

<!-- ══════════════════════════════════════════════════ -->
<!-- PAGE 4: ПЛЕЕР                                      -->
<!-- ══════════════════════════════════════════════════ -->
<div id="pg-player" class="page">
  <div class="player-bg">
    <img id="player-bg-img" class="player-bg-img" src="" alt="">
    <div class="player-bg-overlay"></div>
  </div>
  <div class="player-inner">
    <!-- Top bar -->
    <div class="player-topbar">
      <button class="player-circle-btn" onclick="showPage('songs')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
      </button>
      <span class="player-topbar-label">Now Playing</span>
      <button class="player-circle-btn" id="player-more-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
        </svg>
      </button>
    </div>

    <!-- Album art -->
    <div class="player-art-wrap">
      <div class="player-art paused" id="player-art">
        <img id="player-art-img" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">
      </div>
    </div>

    <!-- Track info -->
    <div class="player-info-row">
      <div class="player-info">
        <div class="player-title" id="fp-title">—</div>
        <div class="player-artist" id="fp-artist">—</div>
      </div>
      <button class="player-heart" id="fp-heart" onclick="likeCurrentTrack(this)">♡</button>
    </div>

    <!-- Progress -->
    <div class="player-progress" id="progress-area">
      <div class="progress-track" id="progress-track" onclick="seekClick(event)">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        <div class="progress-thumb" id="progress-thumb" style="right:100%"></div>
      </div>
      <div class="progress-times">
        <span class="progress-time" id="fp-time-cur">0:00</span>
        <span class="progress-time" id="fp-time-dur">0:00</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="player-controls">
      <button class="ctrl-side" id="fp-shuffle" onclick="toggleShuffle()" title="Shuffle">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
          <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
        </svg>
      </button>
      <button class="ctrl-skip" onclick="prevTrack()">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="19 20 9 12 19 4 19 20"/><rect x="5" y="4" width="2" height="16" rx="1"/>
        </svg>
      </button>
      <button class="ctrl-play" id="fp-play-btn" onclick="togglePlay()">
        <svg id="fp-play-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </button>
      <button class="ctrl-skip" onclick="nextTrack()">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 4 15 12 5 20 5 4"/><rect x="17" y="4" width="2" height="16" rx="1"/>
        </svg>
      </button>
      <button class="ctrl-side" id="fp-repeat" onclick="toggleRepeat()" title="Repeat">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/>
          <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/>
        </svg>
      </button>
    </div>

    <!-- Volume -->
    <div class="player-vol">
      <span class="vol-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>

  'https://images.unsplash.com/photo-1525609004556-c46c7d6cf023?w=500&q=85',
];

const GENRE_COLORS = {
  remix:      'linear-gradient(135deg,#003388,#0066cc)',
  love:       'linear-gradient(135deg,#002266,#004499)',
  hiphop:     'linear-gradient(135deg,#001a44,#0044aa)',
  electronic: 'linear-gradient(135deg,#002255,#0055bb)',
  winter:     'linear-gradient(135deg,#001133,#003388)',
  city:       'linear-gradient(135deg,#00224d,#005599)',
};
const GENRE_NAMES = {remix:'Remix',love:'Love',hiphop:'Hip-Hop',electronic:'Electronic',winter:'Winter',city:'City'};

let currentTrack = null;
let currentIdx = 0;
let isPlaying = false;
let isShuffle = false;
let isRepeat = false;
let carPhotoIdx = 0;
let liked = new Set();
let currentPage = 'songs';
let filteredTracks = [...TRACKS];
let searchTimeout = null;
let currentPhoto = '';

const audio = document.getElementById('audio');

// ═══════════════════════════════════════════════════════
// FORMAT HELPERS
// ═══════════════════════════════════════════════════════
function fmtTime(s) {
  s = Math.floor(s || 0);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

function genreGrad(genre) {
  return GENRE_COLORS[genre] || GENRE_COLORS.remix;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════════
// RENDER SONGS
// ═══════════════════════════════════════════════════════
function renderSongs(tracks) {
  filteredTracks = tracks;
  var list = document.getElementById('track-list');
  if (!list) return;
  list.innerHTML = '';
  tracks.forEach(function(t, i) {
    var photo = CAR_PHOTOS[t.id % CAR_PHOTOS.length];
    var isCurrentlyPlaying = currentTrack && currentTrack.id === t.id;
    var row = document.createElement('div');
    row.className = 'track-row' + (isCurrentlyPlaying ? ' playing' : '');
    row.dataset.id = t.id;
    row.innerHTML =
      '<div class="eq-anim"><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span></div>' +
      '<span class="track-num">' + (i+1) + '</span>' +
      '<div class="track-cover"><img src="' + escHtml(photo) + '" alt="" loading="lazy"></div>' +
      '<div class="track-info">' +
        '<div class="track-title">' + escHtml(t.title) + '</div>' +
        '<div class="track-artist">' + escHtml(t.artist) + '</div>' +
      '</div>' +
      '<span class="track-duration">' + fmtTime(t.duration) + '</span>' +
      '<button class="track-more" onclick="event.stopPropagation()">···</button>';
    row.addEventListener('click', function() {
      playLocal(t.id);
    });
    var sep = document.createElement('div');
    sep.className = 'track-sep';
    list.appendChild(row);
    list.appendChild(sep);
  });
}

// ═══════════════════════════════════════════════════════
// FILTER
// ═══════════════════════════════════════════════════════
function filterSongs(genre, el) {
  document.querySelectorAll('.genre-tab').forEach(function(t) { t.classList.remove('active'); });
  if (el) el.classList.add('active');
  var tracks = genre === 'all' ? TRACKS : TRACKS.filter(function(t) { return t.genre === genre; });
  renderSongs(tracks);
}

// ═══════════════════════════════════════════════════════
// PLAY LOCAL
// ═══════════════════════════════════════════════════════
function playLocal(id) {
  var t = TRACKS.find(function(x) { return x.id === id; });
  if (!t) return;
  var idx = filteredTracks.indexOf(t);
  currentIdx = idx >= 0 ? idx : 0;
  loadTrack(t);
  audio.play().catch(function(){});
  isPlaying = true;
  updatePlayIcons();
  updateArtScale();
  showPage('player');
}

function loadTrack(t) {
  if (!t) return;
  currentTrack = t;
  var url = PROXY + '/audio/' + encodeURIComponent(t.file_id);
  audio.src = url;
  document.getElementById('fp-source').textContent = 'EXCLUSIVE · 170 треков';
  currentPhoto = CAR_PHOTOS[carPhotoIdx++ % CAR_PHOTOS.length];
  updatePlayerUI(currentPhoto);
  updateMini();
  document.querySelectorAll('.track-row').forEach(function(r) {
    r.classList.toggle('playing', r.dataset.id == t.id);
  });
}

// ═══════════════════════════════════════════════════════
// UPDATE UI
// ═══════════════════════════════════════════════════════
function updatePlayerUI(photo) {
  if (!currentTrack) return;
  document.getElementById('fp-title').textContent = currentTrack.title;
  document.getElementById('fp-artist').textContent = currentTrack.artist;
  document.getElementById('fp-time-dur').textContent = fmtTime(currentTrack.duration);

  if (photo) {
    document.getElementById('player-art-img').src = photo;
    document.getElementById('player-bg-img').src = photo;
  }
  var heart = document.getElementById('fp-heart');
  if (heart) {
    heart.textContent = liked.has(currentTrack.id) ? '♥' : '♡';
    heart.classList.toggle('liked', liked.has(currentTrack.id));
  }
  updateArtScale();
}

function updateMini() {
  if (!currentTrack) return;
  document.getElementById('mini-title').textContent = currentTrack.title;
  document.getElementById('mini-artist').textContent = currentTrack.artist;
  var miniImg = document.getElementById('mini-thumb-img');
  if (currentPhoto) {
    miniImg.src = currentPhoto;
    miniImg.style.display = 'block';
  }
  document.getElementById('mini').classList.add('visible');
}

function updateArtScale() {
  var art = document.getElementById('player-art');
  if (!art) return;
  if (isPlaying) {
    art.classList.remove('paused');
    art.classList.add('playing');
  } else {
    art.classList.remove('playing');
    art.classList.add('paused');
  }
}

// ═══════════════════════════════════════════════════════
// PLAY / PAUSE / SEEK / VOL
// ═══════════════════════════════════════════════════════
function togglePlay() {
  if (!currentTrack) {
    if (TRACKS.length) playLocal(TRACKS[0].id);
    return;
  }
  if (isPlaying) {
    audio.pause();
    isPlaying = false;
  } else {
    audio.play().catch(function(){});
    isPlaying = true;
  }
  updatePlayIcons();
  updateArtScale();
}

function updatePlayIcons() {
  var pauseIcon = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
  var playIcon = '<polygon points="5 3 19 12 5 21 5 3"/>';
  var icon = isPlaying ? pauseIcon : playIcon;
  var pi = document.getElementById('fp-play-icon');
  var mi = document.getElementById('mini-play-icon');
  if (pi) pi.innerHTML = icon;
  if (mi) mi.innerHTML = icon;
}

function seekTo(v) {
  if (audio.duration) {
    audio.currentTime = (v / 100) * audio.duration;
  }
}

function setVol(v) {
  audio.volume = v / 100;
}

function seekClick(e) {
  var track = document.getElementById('progress-track');
  var rect = track.getBoundingClientRect();
  var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  seekTo(pct * 100);
}

function prevTrack() {
  if (!filteredTracks.length) return;
  currentIdx = (currentIdx - 1 + filteredTracks.length) % filteredTracks.length;
  var t = filteredTracks[currentIdx];
  loadTrack(t);
  if (isPlaying) audio.play().catch(function(){});
}

function nextTrack() {
  if (!filteredTracks.length) return;
  if (isShuffle) {
    currentIdx = Math.floor(Math.random() * filteredTracks.length);
  } else {
    currentIdx = (currentIdx + 1) % filteredTracks.length;
  }
  var t = filteredTracks[currentIdx];
  loadTrack(t);
  if (isPlaying) audio.play().catch(function(){});
}

function toggleShuffle() {
  isShuffle = !isShuffle;
  document.getElementById('fp-shuffle').classList.toggle('active', isShuffle);
}

function toggleRepeat() {
  isRepeat = !isRepeat;
  audio.loop = isRepeat;
  document.getElementById('fp-repeat').classList.toggle('active', isRepeat);
}

// ═══════════════════════════════════════════════════════
// AUDIO EVENTS
// ═══════════════════════════════════════════════════════
audio.addEventListener('timeupdate', function() {
  if (!audio.duration) return;
  var pct = (audio.currentTime / audio.duration) * 100;
  var fill = document.getElementById('progress-fill');
  var thumb = document.getElementById('progress-thumb');
  var miniFill = document.getElementById('mini-progress-fill');
  if (fill) fill.style.width = pct + '%';
  if (thumb) thumb.style.right = (100 - pct) + '%';
  if (miniFill) miniFill.style.width = pct + '%';
  document.getElementById('fp-time-cur').textContent = fmtTime(audio.currentTime);
});

audio.addEventListener('ended', function() {
  if (!isRepeat) nextTrack();
});

audio.addEventListener('play', function() {
  isPlaying = true;
  updatePlayIcons();
  updateArtScale();
});

audio.addEventListener('pause', function() {
  isPlaying = false;
  updatePlayIcons();
  updateArtScale();
});

audio.addEventListener('error', function() {
  if (currentTrack) {
    playWorld(currentTrack);
  }
});

// ═══════════════════════════════════════════════════════
// LIKES
// ═══════════════════════════════════════════════════════
function likeCurrentTrack(btn) {
  if (!currentTrack) return;
  var id = currentTrack.id;
  if (liked.has(id)) {
    liked.delete(id);
    btn.textContent = '♡';
    btn.classList.remove('liked');
  } else {
    liked.add(id);
    btn.textContent = '♥';
    btn.classList.add('liked');
  }
  document.querySelectorAll('.track-row[data-id="'+id+'"]').forEach(function(r) {
    var h = r.querySelector('.track-heart');
    if (h) {
      h.textContent = liked.has(id) ? '♥' : '♡';
      h.classList.toggle('liked', liked.has(id));
    }
  });
}

// ═══════════════════════════════════════════════════════
// SHOW PAGE
// ═══════════════════════════════════════════════════════
function showPage(name) {
  currentPage = name;
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });

  var pg = document.getElementById('pg-' + name);
  if (pg) pg.classList.add('active');

  var nb = document.getElementById('nav-' + name);
  if (nb) nb.classList.add('active');

  var mini = document.getElementById('mini');
  if (name === 'player') {
    mini.classList.add('hide-mini');
  } else {
    mini.classList.remove('hide-mini');
  }
}

// ═══════════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════════
function onSearch(q) {
  clearTimeout(searchTimeout);
  if (!q.trim()) {
    document.getElementById('search-results').innerHTML = '';
    return;
  }
  searchTimeout = setTimeout(function() { globalSearch(q); }, 400);
}

function doTagSearch(q) {
  document.getElementById('search-input').value = q;
  globalSearch(q);
}

function globalSearch(q) {
  var local = TRACKS.filter(function(t) {
    return t.title.toLowerCase().includes(q.toLowerCase()) ||
           t.artist.toLowerCase().includes(q.toLowerCase());
  });
  var container = document.getElementById('search-results');
  container.innerHTML = '';
  var secLocal = document.createElement('div');
  secLocal.className = 'search-section-title';
  secLocal.textContent = 'Локальные';
  container.appendChild(secLocal);
  if (local.length) {
    local.slice(0,10).forEach(function(t) {
      container.appendChild(buildSearchRow(t, 'local'));
    });
  } else {
    var empty = document.createElement('div');
    empty.style.cssText = 'color:rgba(255,255,255,0.35);padding:12px 16px;font-size:14px;';
    empty.textContent = 'Не найдено локально';
    container.appendChild(empty);
  }

  fetchDeezer(q).then(function(dz) {
    if (dz.length) {
      var sec = document.createElement('div');
      sec.className = 'search-section-title';
      sec.textContent = 'Deezer';
      container.appendChild(sec);
      dz.slice(0,8).forEach(function(t) { container.appendChild(buildSearchRow(t, 'world')); });
    }
  }).catch(function(){});

  fetchItunes(q).then(function(it) {
    if (it.length) {
      var sec = document.createElement('div');
      sec.className = 'search-section-title';
      sec.textContent = 'iTunes';
      container.appendChild(sec);
      it.slice(0,8).forEach(function(t) { container.appendChild(buildSearchRow(t, 'world')); });
    }
  }).catch(function(){});
}

function buildSearchRow(t, src) {
  var row = document.createElement('div');
  row.className = 'track-row';
  var photo = t.cover || CAR_PHOTOS[(t.id||0) % CAR_PHOTOS.length];
  row.innerHTML =
    '<div class="track-cover"><img src="' + escHtml(photo) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'"></div>' +
    '<div class="track-info">' +
      '<div class="track-title">' + escHtml(t.title) + '</div>' +
      '<div class="track-artist">' + escHtml(t.artist) + '</div>' +
    '</div>' +
    '<span class="track-duration">' + fmtTime(t.duration) + '</span>';
  row.addEventListener('click', function() {
    if (src === 'local') {
      playLocal(t.id);
    } else {
      playWorld(t);
    }
  });
  return row;
}

async function fetchDeezer(q) {
  var url = DEEZER_PROXY + encodeURIComponent('https://api.deezer.com/search?q=' + encodeURIComponent(q) + '&limit=20');
  var resp = await fetch(url);
  var data = await resp.json();
  if (!data.data) return [];
  return data.data.map(function(d) { return {
    title: d.title,
    artist: d.artist.name,
    duration: d.duration,
    cover: d.album.cover_small,
    genre: 'remix',
    _deezer_preview: d.preview,
    _deezer_id: d.id,
  }; });
}

async function fetchItunes(q) {
  var url = 'https://itunes.apple.com/search?term=' + encodeURIComponent(q) + '&media=music&limit=20&entity=song';
  var resp = await fetch(url);
  var data = await resp.json();
  if (!data.results) return [];
  return data.results.map(function(r) { return {
    title: r.trackName,
    artist: r.artistName,
    duration: Math.round((r.trackTimeMillis||0)/1000),
    cover: r.artworkUrl60,
    genre: 'remix',
    _itunes_preview: r.previewUrl,
  }; });
}

async function playWorld(t) {
  currentTrack = t;
  currentPhoto = CAR_PHOTOS[carPhotoIdx++ % CAR_PHOTOS.length];
  updatePlayerUI(currentPhoto);
  updateMini();

  if (t._deezer_preview) {
    audio.src = t._deezer_preview;
    audio.play().catch(function(){});
    isPlaying = true;
    updatePlayIcons();
    updateArtScale();
    document.getElementById('fp-source').textContent = 'Deezer preview';
    showPage('player');
    return;
  }
  if (t._itunes_preview) {
    audio.src = t._itunes_preview;
    audio.play().catch(function(){});
    isPlaying = true;
    updatePlayIcons();
    updateArtScale();
    document.getElementById('fp-source').textContent = 'iTunes preview';
    showPage('player');
    return;
  }
  document.getElementById('fp-source').textContent = 'Загрузка...';
  showPage('player');
  try {
    var resp = await fetch(PROXY + '/yt/url?q=' + encodeURIComponent(t.title + ' ' + t.artist));
    var data = await resp.json();
    if (data.url) {
      audio.src = data.url;
      audio.play().catch(function(){});
      isPlaying = true;
      updatePlayIcons();
      updateArtScale();
      document.getElementById('fp-source').textContent = 'YouTube';
    }
  } catch(e) {
    document.getElementById('fp-source').textContent = 'Ошибка загрузки';
  }
}

// ═══════════════════════════════════════════════════════
// GENRES PAGE
// ═══════════════════════════════════════════════════════
function initGenreCounts() {
  var counts = {};
  TRACKS.forEach(function(t) { counts[t.genre] = (counts[t.genre]||0)+1; });

  var grid = document.getElementById('genres-grid');
  var genres = ['remix','love','hiphop','electronic','winter','city'];
  genres.forEach(function(g) {
    var card = document.createElement('div');
    card.className = 'genre-card';
    card.style.background = genreGrad(g);
    card.innerHTML =
      '<div class="genre-card-name">' + (GENRE_NAMES[g]||g) + '</div>' +
      '<div class="genre-card-count">' + (counts[g]||0) + ' треков</div>';
    card.addEventListener('click', function() {
      showPage('songs');
      document.querySelectorAll('.genre-tab').forEach(function(tab) {
        tab.classList.toggle('active', tab.dataset.genre === g);
      });
      filterSongs(g, null);
    });
    grid.appendChild(card);
  });
}

// ═══════════════════════════════════════════════════════
// VK
// ═══════════════════════════════════════════════════════
function vkLogin() {
  var cleanUrl = window.location.origin + window.location.pathname;
  var redirectUri = encodeURIComponent(cleanUrl);
  var url = 'https://oauth.vk.com/authorize?client_id=' + VK_APP_ID +
    '&display=mobile&redirect_uri=' + redirectUri +
    '&scope=&response_type=token&v=5.131&revoke=1';
  window.location.href = url;
}

async function vkLoadUser() {
  var token = localStorage.getItem('vk_token');
  if (!token) return;
  var content = document.getElementById('vk-content');
  try {
    var resp = await fetch('https://api.vk.com/method/users.get?access_token=' + token + '&v=5.131&fields=photo_50');
    var data = await resp.json();
    if (data.response && data.response[0]) {
      var u = data.response[0];
      content.innerHTML =
        '<div class="vk-center">' +
          '<div class="vk-user-card">' +
            '<div class="vk-avatar">' + (u.photo_50 ? '<img src="'+u.photo_50+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">' : '👤') + '</div>' +
            '<div>' +
              '<div class="vk-user-name">' + escHtml(u.first_name + ' ' + u.last_name) + '</div>' +
              '<div class="vk-user-sub">VK аккаунт подключён</div>' +
            '</div>' +
          '</div>' +
          '<button class="vk-login-btn" onclick="doVkSearch()">Поиск в VK</button>' +
          '<button class="vk-action-btn" onclick="showPage(\'songs\')">Exclusive треки</button>' +
          '<button class="vk-logout-btn" onclick="vkLogout()">Выйти из VK</button>' +
        '</div>';
    }
  } catch(e) {
    content.innerHTML = '<div class="vk-center"><div class="vk-page-sub">Ошибка загрузки профиля</div><button class="vk-login-btn" onclick="vkLogin()">Войти снова</button></div>';
  }
}

function vkLogout() {
  localStorage.removeItem('vk_token');
  document.getElementById('vk-content').innerHTML =
    '<div class="vk-center">' +

      '<div><div class="vk-page-title">ВКонтакте</div><div class="vk-page-sub">Войди и слушай музыку<br>через глобальный поиск</div></div>' +
      '<button class="vk-login-btn" onclick="vkLogin()">Войти через ВКонтакте</button>' +
      '<div class="vk-hint">После входа откроется поиск по 90M+ трекам</div>' +
    '</div>';
}

function doVkSearch() {
  showPage('search');
}

// INIT

try {
  if (window.Telegram && Telegram.WebApp) {
    Telegram.WebApp.ready();

renderSongs(TRACKS);
initGenreCounts();

setTimeout(function() {

    currentTrack = TRACKS[0];

    updatePlayerUI(currentPhoto);
    updateMini();
    document.getElementById('mini').classList.add('visible');

// Handle VK redirect token in URL hash
(function() {
  var h = window.location.hash;
  if (h && h.includes('access_token')) {
    var p = new URLSearchParams(h.slice(1));
    var t = p.get('access_token');
    if (t) {
      localStorage.setItem('vk_token', t);
      history.replaceState(null, '', location.pathname);
    }
  }
})();

if (localStorage.getItem('vk_token')) {
  setTimeout(vkLoadUser, 300);
}
