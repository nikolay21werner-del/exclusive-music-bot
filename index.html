<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EXCLUSIVE MUSIC BOT</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    /* ─── DESIGN TOKENS ─── */
    :root {
      --cyan: #00d4ff;
      --purple: #b400ff;
      --pink: #ff0099;
      --bg: #07070d;
      --surface: #0d0d18;
      --surface-2: #141424;
      --surface-3: #1c1c2e;
      --border: rgba(255,255,255,0.06);
      --text: #f0f0ff;
      --text-muted: rgba(240,240,255,0.55);
      --text-faint: rgba(240,240,255,0.25);
      --font-body: 'Inter', sans-serif;
      --font-display: 'Orbitron', sans-serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
      --transition: 180ms var(--ease-out);
      --radius-sm: 0.5rem;
      --radius-md: 0.875rem;
      --radius-lg: 1.25rem;
      --radius-xl: 1.75rem;
      --radius-full: 9999px;
      --glow-cyan: 0 0 20px rgba(0,212,255,0.4), 0 0 60px rgba(0,212,255,0.15);
      --glow-purple: 0 0 20px rgba(180,0,255,0.4), 0 0 60px rgba(180,0,255,0.15);
      --glow-pink: 0 0 20px rgba(255,0,153,0.4), 0 0 60px rgba(255,0,153,0.15);
      --glow-multi: 0 0 30px rgba(0,212,255,0.25), 0 0 60px rgba(180,0,255,0.15), 0 0 90px rgba(255,0,153,0.1);
      --proxy: 'https://web-production-6791f.up.railway.app';
    }

    /* ─── RESET ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      position: relative;
    }
    img, svg { display: block; max-width: 100%; }
    button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
    ul { list-style: none; }

    /* ─── ANIMATED BG PARTICLES ─── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── AMBIENT GLOW BLOBS ─── */
    .ambient {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.18;
    }
    .ambient-1 {
      width: 400px; height: 400px;
      background: var(--purple);
      top: -100px; left: -100px;
      animation: blob-drift 12s ease-in-out infinite alternate;
    }
    .ambient-2 {
      width: 350px; height: 350px;
      background: var(--cyan);
      bottom: 10%; right: -80px;
      animation: blob-drift 15s ease-in-out infinite alternate-reverse;
    }
    .ambient-3 {
      width: 300px; height: 300px;
      background: var(--pink);
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      animation: blob-pulse 8s ease-in-out infinite;
    }
    @keyframes blob-drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(40px,30px) scale(1.15); }
    }
    @keyframes blob-pulse {
      0%,100% { opacity: 0.1; transform: translate(-50%,-50%) scale(0.9); }
      50%      { opacity: 0.2; transform: translate(-50%,-50%) scale(1.1); }
    }

    /* ─── LAYOUT ─── */
    #app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding-bottom: 100px;
    }

    /* ─── HEADER ─── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(7,7,13,0.98) 70%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: var(--glow-cyan);
      flex-shrink: 0;
      animation: logo-pulse 3s ease-in-out infinite;
    }
    @keyframes logo-pulse {
      0%,100% { box-shadow: var(--glow-cyan); }
      50%      { box-shadow: var(--glow-purple); }
    }
    .logo-text {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.12em;
      line-height: 1.2;
    }
    .logo-text span {
      display: block;
      background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-sub {
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 0.2em;
      font-family: var(--font-body);
      font-weight: 500;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
      transition: all var(--transition);
    }
    .header-btn:hover { color: var(--cyan); border-color: rgba(0,212,255,0.3); box-shadow: var(--glow-cyan); }
    .track-count-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: linear-gradient(90deg, rgba(0,212,255,0.15), rgba(180,0,255,0.15));
      border: 1px solid rgba(0,212,255,0.25);
      color: var(--cyan);
    }

    /* ─── SEARCH ─── */
    .search-wrap {
      padding: 0 16px 12px;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 11px 16px 11px 42px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .search-input::placeholder { color: var(--text-faint); }
    .search-input:focus {
      border-color: rgba(0,212,255,0.4);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.08), var(--glow-cyan);
    }
    .search-icon {
      position: absolute;
      left: 28px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
      pointer-events: none;
    }

    /* ─── GENRE FILTERS ─── */
    .genre-scroll {
      display: flex;
      gap: 8px;
      padding: 0 16px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .genre-scroll::-webkit-scrollbar { display: none; }
    .genre-chip {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      transition: all var(--transition);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .genre-chip:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }
    .genre-chip.active {
      background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(180,0,255,0.2));
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 12px rgba(0,212,255,0.2);
    }

    /* ─── SECTION TITLE ─── */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0 16px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }

    /* ─── TRACK LIST ─── */
    .track-list {
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      transition: all var(--transition);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .track-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,212,255,0.04), rgba(180,0,255,0.04));
      opacity: 0;
      transition: opacity var(--transition);
    }
    .track-item:hover::before { opacity: 1; }
    .track-item:hover {
      border-color: rgba(0,212,255,0.15);
      background: var(--surface-2);
    }
    .track-item.playing {
      background: linear-gradient(135deg, rgba(0,212,255,0.08), rgba(180,0,255,0.08));
      border-color: rgba(0,212,255,0.3);
    }
    .track-item.playing::before { opacity: 1; }

    .track-num {
      width: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-faint);
      font-weight: 500;
      flex-shrink: 0;
    }
    .track-item.playing .track-num { display: none; }
    .track-equalizer {
      display: none;
      width: 24px;
      height: 16px;
      align-items: flex-end;
      justify-content: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .track-item.playing .track-equalizer { display: flex; }
    .eq-bar {
      width: 3px;
      background: var(--cyan);
      border-radius: 2px;
      animation: eq-bounce var(--dur, 0.8s) ease-in-out infinite alternate;
    }
    .eq-bar:nth-child(1) { height: 6px; --dur: 0.6s; }
    .eq-bar:nth-child(2) { height: 12px; --dur: 0.8s; animation-delay: 0.1s; }
    .eq-bar:nth-child(3) { height: 8px; --dur: 0.7s; animation-delay: 0.2s; }
    .eq-bar:nth-child(4) { height: 14px; --dur: 0.9s; animation-delay: 0.05s; }
    @keyframes eq-bounce {
      from { transform: scaleY(0.4); opacity: 0.7; }
      to   { transform: scaleY(1); opacity: 1; }
    }

    .track-cover {
      width: 46px; height: 46px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--surface-3), var(--surface-2));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .track-item.playing .track-cover {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0,212,255,0.35);
    }
    .track-cover-glow {
      position: absolute;
      inset: -4px;
      background: linear-gradient(135deg, var(--purple), var(--cyan), var(--pink));
      opacity: 0;
      transition: opacity var(--transition);
      filter: blur(4px);
    }
    .track-item.playing .track-cover-glow { opacity: 0.4; }

    .track-info { flex: 1; min-width: 0; }
    .track-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .track-item.playing .track-title { color: var(--cyan); }
    .track-artist {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .track-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .like-btn {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      color: var(--text-faint);
      transition: all var(--transition);
    }
    .like-btn:hover { color: var(--pink); }
    .like-btn.liked { color: var(--pink); }
    .like-btn.liked svg { fill: var(--pink); }
    .track-duration {
      font-size: 11px;
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
      min-width: 32px;
      text-align: right;
    }

    /* ─── PLAYER (fixed bottom) ─── */
    .player {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 200;
      padding: env(safe-area-inset-bottom, 0);
    }

    /* Mini player bar */
    .mini-player {
      margin: 0 12px 12px;
      background: rgba(13,13,24,0.85);
      backdrop-filter: blur(32px) saturate(1.5);
      -webkit-backdrop-filter: blur(32px) saturate(1.5);
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: var(--radius-xl);
      padding: 12px 16px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), var(--glow-cyan);
      transition: transform var(--transition), box-shadow var(--transition);
    }
    .mini-player:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.6), var(--glow-purple); }

    .mini-player-inner {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .mini-cover {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
    .mini-cover.spinning { animation: rotate 8s linear infinite; }
    @keyframes rotate { to { transform: rotate(360deg); } }

    .mini-info { flex: 1; min-width: 0; }
    .mini-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-artist {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .mini-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .ctrl-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
      transition: all var(--transition);
    }
    .ctrl-btn:hover { color: var(--cyan); transform: scale(1.1); }
    .ctrl-btn.play-btn {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      color: #fff;
      box-shadow: var(--glow-cyan);
    }
    .ctrl-btn.play-btn:hover { box-shadow: var(--glow-purple); transform: scale(1.05); }
    .ctrl-btn.play-btn:active { transform: scale(0.97); }

    /* Progress bar */
    .mini-progress {
      margin-top: 10px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: var(--radius-full);
      overflow: hidden;
    }
    .mini-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      border-radius: var(--radius-full);
      width: 0%;
      transition: width 0.5s linear;
      box-shadow: 0 0 8px var(--cyan);
    }

    /* ─── FULL PLAYER PANEL ─── */
    .full-player {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      transform: translateY(100%);
      transition: transform 0.45s var(--ease-out);
      overflow: hidden;
    }
    .full-player.open { transform: translateY(0); }

    /* Full player background */
    .fp-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(180,0,255,0.2) 0%, transparent 60%),
                  radial-gradient(ellipse at 100% 100%, rgba(0,212,255,0.15) 0%, transparent 55%),
                  radial-gradient(ellipse at 0% 80%, rgba(255,0,153,0.1) 0%, transparent 50%),
                  var(--bg);
      z-index: 0;
    }

    .fp-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 0 24px 32px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .fp-content::-webkit-scrollbar { display: none; }

    .fp-handle {
      width: 40px; height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: var(--radius-full);
      margin: 12px auto 24px;
      flex-shrink: 0;
    }

    /* Album art */
    .fp-art-wrap {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto 32px;
      flex-shrink: 0;
    }
    .fp-art-ring {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: conic-gradient(var(--cyan), var(--purple), var(--pink), var(--cyan));
      animation: ring-spin 4s linear infinite;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .fp-art-ring.active { opacity: 1; }
    .fp-art-ring-inner {
      position: absolute;
      inset: 3px;
      background: var(--bg);
      border-radius: 50%;
    }
    @keyframes ring-spin { to { transform: rotate(360deg); } }

    .fp-art {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--surface-3), var(--surface-2));
      display: flex; align-items: center; justify-content: center;
      font-size: 80px;
      border: 2px solid rgba(255,255,255,0.06);
      overflow: hidden;
      transition: transform 0.3s var(--ease-out);
    }
    .fp-art.playing { animation: slow-rotate 20s linear infinite; }
    @keyframes slow-rotate { to { transform: rotate(360deg); } }

    /* Waveform visualizer */
    #fp-visualizer {
      width: 100%;
      height: 60px;
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    /* Track info */
    .fp-track-info {
      text-align: center;
      margin-bottom: 24px;
      flex-shrink: 0;
    }
    .fp-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .fp-artist {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .fp-channel {
      font-size: 11px;
      color: var(--text-faint);
      margin-top: 4px;
      letter-spacing: 0.08em;
    }

    /* Progress */
    .fp-progress-wrap {
      margin-bottom: 20px;
      flex-shrink: 0;
    }
    .fp-progress-bar {
      position: relative;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: var(--radius-full);
      cursor: pointer;
      margin-bottom: 8px;
    }
    .fp-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
      border-radius: var(--radius-full);
      width: 0%;
      position: relative;
      transition: width 0.3s linear;
    }
    .fp-progress-fill::after {
      content: '';
      position: absolute;
      right: -6px; top: 50%;
      transform: translateY(-50%);
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: var(--glow-cyan);
      opacity: 0;
      transition: opacity var(--transition);
    }
    .fp-progress-bar:hover .fp-progress-fill::after { opacity: 1; }
    .fp-times {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
    }

    /* Controls */
    .fp-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 24px;
      flex-shrink: 0;
    }
    .fp-ctrl {
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
      transition: all var(--transition);
    }
    .fp-ctrl:hover { color: var(--text); transform: scale(1.1); }
    .fp-ctrl.active { color: var(--cyan); }
    .fp-play-btn {
      width: 68px; height: 68px;
      background: linear-gradient(135deg, var(--cyan), var(--purple), var(--pink));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      box-shadow: 0 0 30px rgba(0,212,255,0.4), 0 0 60px rgba(180,0,255,0.2);
      transition: all var(--transition);
    }
    .fp-play-btn:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(0,212,255,0.6), 0 0 80px rgba(180,0,255,0.3); }
    .fp-play-btn:active { transform: scale(0.97); }

    /* Volume */
    .fp-volume {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-shrink: 0;
    }
    .fp-vol-icon { color: var(--text-faint); flex-shrink: 0; }
    .fp-vol-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: var(--radius-full);
      outline: none;
      cursor: pointer;
    }
    .fp-vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      box-shadow: var(--glow-cyan);
      cursor: pointer;
    }

    /* Extra actions */
    .fp-actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .fp-action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 12px 20px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: all var(--transition);
    }
    .fp-action-btn:hover {
      border-color: rgba(0,212,255,0.3);
      color: var(--cyan);
      box-shadow: var(--glow-cyan);
    }

    /* ─── TOAST ─── */
    .toast {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface-2);
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: var(--radius-full);
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      box-shadow: var(--glow-cyan);
      z-index: 400;
      opacity: 0;
      transition: all 0.3s var(--ease-out);
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ─── LOADING ─── */
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.5s var(--ease-out);
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loader-logo {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.1em;
      background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: logo-flicker 1.5s ease-in-out infinite;
    }
    @keyframes logo-flicker {
      0%,100% { opacity: 1; filter: brightness(1); }
      50%      { opacity: 0.8; filter: brightness(1.3); }
    }
    .loader-bars {
      display: flex;
      gap: 5px;
      align-items: flex-end;
      height: 30px;
    }
    .loader-bar {
      width: 5px;
      border-radius: 3px;
      animation: loader-bounce 0.8s ease-in-out infinite alternate;
    }
    .loader-bar:nth-child(1) { background: var(--cyan); height: 12px; animation-delay: 0s; }
    .loader-bar:nth-child(2) { background: var(--purple); height: 22px; animation-delay: 0.1s; }
    .loader-bar:nth-child(3) { background: var(--pink); height: 16px; animation-delay: 0.2s; }
    .loader-bar:nth-child(4) { background: var(--cyan); height: 28px; animation-delay: 0.05s; }
    .loader-bar:nth-child(5) { background: var(--purple); height: 18px; animation-delay: 0.15s; }
    .loader-bar:nth-child(6) { background: var(--pink); height: 24px; animation-delay: 0.25s; }
    @keyframes loader-bounce {
      from { transform: scaleY(0.4); opacity: 0.6; }
      to   { transform: scaleY(1); opacity: 1; }
    }
    .loader-text {
      font-size: 12px;
      color: var(--text-faint);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* ─── EMPTY STATE ─── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);

    .empty-text { font-size: 14px; }

    /* ─── SCROLLBAR ─── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,212,255,0.4); }

    /* ─── NEON TEXT UTILITY ─── */

    .neon-pink { color: var(--pink); text-shadow: 0 0 10px rgba(255,0,153,0.5); }

    /* ─── MOBILE SAFE ─── */
    @media (max-width: 380px) {

      .fp-content { padding: 0 16px 24px; }

<script>
  // ─── CONSTANTS ───
  const PROXY = 'https://web-production-6791f.up.railway.app';
  const CHANNEL_URL = 'https://t.me/exclusive_music_remix';

  // ─── STATE ───
  let currentTrack = null;
  let currentIndex = 0;
  let isPlaying = false;
  let isShuffle = false;
  let isRepeat = false;
  let filteredTracks = [...TRACKS];
  let currentFilter = 'all';
  let currentSearch = '';
  let likes = JSON.parse(localStorage.getItem('exm_likes') || '{}');
  let queue = [...TRACKS];

  // ─── AUDIO ───
  const audio = new Audio();
  audio.crossOrigin = 'anonymous';

  // ─── AUDIO CONTEXT + VISUALIZER ───
  let audioCtx = null, analyser = null, dataArray = null, source = null, vizRAF = null;

  function initAudioContext() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
    } catch(e) { console.log('Web Audio not supported'); }
  }

  // Canvas visualizer
  const vizCanvas = document.getElementById('fp-visualizer');
  const vizCtx = vizCanvas.getContext('2d');
  function resizeViz() {
    vizCanvas.width = vizCanvas.offsetWidth * devicePixelRatio;
    vizCanvas.height = vizCanvas.offsetHeight * devicePixelRatio;
    vizCtx.scale(devicePixelRatio, devicePixelRatio);
  }
  resizeViz();

  function drawVisualizer() {
    vizRAF = requestAnimationFrame(drawVisualizer);
    const W = vizCanvas.offsetWidth, H = vizCanvas.offsetHeight;
    vizCtx.clearRect(0, 0, W, H);

    if (!analyser || !isPlaying) {
      // Idle wave
      const t = Date.now() / 1000;
      for (let i = 0; i < 64; i++) {
        const x = (i / 63) * W;
        const amp = 4 + Math.sin(i * 0.4 + t * 2) * 3 + Math.sin(i * 0.2 + t) * 2;
        const y = H / 2;
        const grad = vizCtx.createLinearGradient(0, 0, W, 0);
        grad.addColorStop(0, 'rgba(0,212,255,0.4)');
        grad.addColorStop(0.5, 'rgba(180,0,255,0.4)');
        grad.addColorStop(1, 'rgba(255,0,153,0.4)');
        vizCtx.fillStyle = grad;
        vizCtx.fillRect(x, y - amp, Math.max(2, W / 70), amp * 2);
      }
      return;
    }

    analyser.getByteFrequencyData(dataArray);
    const bars = 64;
    const barW = W / bars;

    for (let i = 0; i < bars; i++) {
      const val = dataArray[i] / 255;
      const barH = val * H * 0.9;
      const x = i * barW;
      const grad = vizCtx.createLinearGradient(0, H, 0, H - barH);
      grad.addColorStop(0, 'rgba(0,212,255,0.9)');
      grad.addColorStop(0.5, 'rgba(180,0,255,0.7)');
      grad.addColorStop(1, 'rgba(255,0,153,0.5)');
      vizCtx.fillStyle = grad;
      const bw = Math.max(2, barW - 2);
      vizCtx.fillRect(x, H - barH, bw, barH);
      // Mirror top
      vizCtx.globalAlpha = 0.2;
      vizCtx.fillRect(x, 0, bw, barH * 0.3);
      vizCtx.globalAlpha = 1;
    }
  }
  drawVisualizer();

  // Background canvas particles
  const bgCanvas = document.getElementById('bg-canvas');
  const bgCtx = bgCanvas.getContext('2d');
  let particles = [];
  function resizeBg() {
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;
  }
  resizeBg();
  window.addEventListener('resize', () => { resizeBg(); resizeViz(); });

  function createParticle() {
    return {
      x: Math.random() * bgCanvas.width,
      y: Math.random() * bgCanvas.height,
      r: Math.random() * 1.5 + 0.5,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -Math.random() * 0.5 - 0.2,
      life: 1,
      decay: Math.random() * 0.003 + 0.001,
      color: ['rgba(0,212,255,', 'rgba(180,0,255,', 'rgba(255,0,153,'][Math.floor(Math.random()*3)]
    };
  }
  for (let i = 0; i < 60; i++) particles.push(createParticle());

  function drawBg() {
    requestAnimationFrame(drawBg);
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    particles.forEach((p, i) => {
      p.x += p.vx; p.y += p.vy; p.life -= p.decay;
      if (p.life <= 0) { particles[i] = createParticle(); return; }
      bgCtx.beginPath();
      bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      bgCtx.fillStyle = p.color + p.life * 0.6 + ')';
      bgCtx.fill();
    });
  }
  drawBg();

  // ─── DOM REFS ───
  const trackList = document.getElementById('track-list');
  const emptyState = document.getElementById('empty-state');
  const searchInput = document.getElementById('search-input');
  const sectionTitle = document.getElementById('section-title');
  const trackCountBadge = document.getElementById('track-count-badge');
  const playerEl = document.getElementById('player');
  const miniTitle = document.getElementById('mini-title');
  const miniArtist = document.getElementById('mini-artist');
  const miniCover = document.getElementById('mini-cover');
  const miniPlayIcon = document.getElementById('mini-play-icon');
  const miniProgress = document.getElementById('mini-progress-fill');
  const fullPlayer = document.getElementById('full-player');
  const fpArt = document.getElementById('fp-art');
  const fpRing = document.getElementById('fp-ring');
  const fpTitle = document.getElementById('fp-title');
  const fpArtist = document.getElementById('fp-artist');
  const fpCurrent = document.getElementById('fp-current');
  const fpTotal = document.getElementById('fp-total');
  const fpProgressFill = document.getElementById('fp-progress-fill');
  const fpProgressBar = document.getElementById('fp-progress-bar');
  const fpPlayIcon = document.getElementById('fp-play-icon');
  const fpLikeBtn = document.getElementById('fp-like-btn');

  // ─── FORMAT TIME ───
  function fmt(s) {
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  }

  // ─── EMOJI FOR COVER ───
  function genreEmoji(g) {
    const map = { remix:'🔥', love:'❤️', hiphop:'🎤', electronic:'⚡', winter:'❄️', city:'🏙️' };
    return map[g] || '🎵';
  }

  // ─── RENDER TRACKS ───
  function renderTracks() {
    const q = currentSearch.toLowerCase();
    filteredTracks = TRACKS.filter(t => {
      const matchGenre = currentFilter === 'all' || t.genre === currentFilter;
      const matchSearch = !q || t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q);
      return matchGenre && matchSearch;
    });

    trackCountBadge.textContent = filteredTracks.length + ' треков';
    if (currentFilter !== 'all') {
      const labels = { remix:'🔥 Remix', love:'❤️ Love', hiphop:'🎤 Hip-Hop', electronic:'⚡ Electronic', winter:'❄️ Winter', city:'🏙️ City' };
      sectionTitle.textContent = labels[currentFilter] || currentFilter;
    } else {
      sectionTitle.textContent = q ? 'Результаты поиска' : 'Все треки';
    }

    emptyState.classList.toggle('show', filteredTracks.length === 0);
    trackList.innerHTML = '';

    filteredTracks.forEach((track, idx) => {
      const isActive = currentTrack && currentTrack.id === track.id;
      const isLiked = !!likes[track.id];
      const li = document.createElement('li');
      li.className = 'track-item' + (isActive ? ' playing' : '');
      li.dataset.id = track.id;
      li.innerHTML = `
        <div class="track-num">${idx + 1}</div>
        <div class="track-equalizer">
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
        </div>
        <div class="track-cover">
          <div class="track-cover-glow"></div>
          <span>${genreEmoji(track.genre)}</span>
        </div>
        <div class="track-info">
          <div class="track-title">${track.title}</div>
          <div class="track-artist">${track.artist}</div>
        </div>
        <div class="track-right">
          <button class="like-btn ${isLiked ? 'liked' : ''}" data-id="${track.id}" title="Нравится">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </button>
          <span class="track-duration">${fmt(track.duration)}</span>
        </div>
      `;
      li.addEventListener('click', (e) => {
        if (e.target.closest('.like-btn')) { toggleLike(track.id); return; }
        queue = [...filteredTracks];
        const qi = queue.findIndex(t => t.id === track.id);
        playTrack(track, qi);
      });
      trackList.appendChild(li);
    });
  }

  // ─── PLAY TRACK ───
  function playTrack(track, qIdx) {
    currentTrack = track;
    currentIndex = qIdx !== undefined ? qIdx : queue.findIndex(t => t.id === track.id);
    const url = PROXY + '/audio/' + encodeURIComponent(track.file_id);
    audio.src = url;
    audio.load();

    const playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        initAudioContext();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        setPlaying(true);
      }).catch(e => {
        console.log('Play error:', e);
        showToast('⚠️ Ошибка воспроизведения');
      });
    }

    updateUI();
    playerEl.style.display = 'block';
    renderTracks();
  }

  function setPlaying(playing) {
    isPlaying = playing;
    const pauseIcon = `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`;
    const playIcon = `<polygon points="5 3 19 12 5 21 5 3"/>`;
    const icon = playing ? pauseIcon : playIcon;
    miniPlayIcon.innerHTML = icon;
    fpPlayIcon.innerHTML = icon;
    fpArt.classList.toggle('playing', playing);
    fpRing.classList.toggle('active', playing);
  }

  function updateUI() {
    if (!currentTrack) return;
    const emoji = genreEmoji(currentTrack.genre);
    miniCover.textContent = emoji;
    miniTitle.textContent = currentTrack.title;
    miniArtist.textContent = currentTrack.artist;
    fpArt.textContent = emoji;
    fpTitle.textContent = currentTrack.title;
    fpArtist.textContent = currentTrack.artist;
    fpTotal.textContent = fmt(currentTrack.duration);
    updateLikeBtn();
  }

  function updateLikeBtn() {
    if (!currentTrack) return;
    const liked = !!likes[currentTrack.id];
    fpLikeBtn.innerHTML = `
      <svg width="20" height="20" viewBox="0 0 24 24" fill="${liked ? 'var(--pink)' : 'none'}" stroke="${liked ? 'var(--pink)' : 'currentColor'}" stroke-width="2" stroke-linecap="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      <span>${liked ? 'Убрать' : 'Нравится'}</span>
    `;
  }

  // ─── CONTROLS ───
  function togglePlay() {
    if (!currentTrack) { if (queue.length) playTrack(queue[0], 0); return; }
    if (isPlaying) { audio.pause(); setPlaying(false); }
    else {
      initAudioContext();
      audio.play().then(() => {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        setPlaying(true);
      }).catch(() => showToast('⚠️ Ошибка'));
    }
  }

  function playNext() {
    if (!queue.length) return;
    let next;
    if (isShuffle) {
      const r = Math.floor(Math.random() * queue.length);
      next = r === currentIndex ? (r + 1) % queue.length : r;
    } else {
      next = (currentIndex + 1) % queue.length;
    }
    playTrack(queue[next], next);
  }

  function playPrev() {
    if (!queue.length) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    const prev = (currentIndex - 1 + queue.length) % queue.length;
    playTrack(queue[prev], prev);
  }

  // ─── AUDIO EVENTS ───
  audio.addEventListener('ended', () => {
    if (isRepeat) { audio.currentTime = 0; audio.play(); }
    else playNext();
  });

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    miniProgress.style.width = pct + '%';
    fpProgressFill.style.width = pct + '%';
    fpCurrent.textContent = fmt(audio.currentTime);
  });

  audio.addEventListener('error', () => {
    showToast('⚠️ Не удалось загрузить трек');
    setPlaying(false);
  });

  // ─── PROGRESS BAR SEEK ───
  fpProgressBar.addEventListener('click', (e) => {
    if (!audio.duration) return;
    const rect = fpProgressBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  });

  // ─── VOLUME ───
  document.getElementById('fp-volume').addEventListener('input', (e) => {
    audio.volume = e.target.value / 100;
  });

  // ─── LIKE ───
  function toggleLike(id) {
    if (likes[id]) delete likes[id];
    else likes[id] = true;
    localStorage.setItem('exm_likes', JSON.stringify(likes));
    renderTracks();
    updateLikeBtn();
    showToast(likes[id] ? '❤️ Добавлено в избранное' : '💔 Убрано из избранного');
  }

  // ─── SHUFFLE / REPEAT ───
  document.getElementById('fp-shuffle').addEventListener('click', () => {
    isShuffle = !isShuffle;
    document.getElementById('fp-shuffle').classList.toggle('active', isShuffle);
    showToast(isShuffle ? '🔀 Перемешать включено' : '🔀 Перемешать выключено');
  });
  document.getElementById('fp-repeat').addEventListener('click', () => {
    isRepeat = !isRepeat;
    document.getElementById('fp-repeat').classList.toggle('active', isRepeat);
    showToast(isRepeat ? '🔁 Повтор включен' : '🔁 Повтор выключен');
  });
  document.getElementById('shuffle-all-btn').addEventListener('click', () => {
    isShuffle = true;
    queue = [...TRACKS].sort(() => Math.random() - 0.5);
    playTrack(queue[0], 0);
    showToast('🔀 Воспроизведение в случайном порядке');
  });

  // ─── PLAYER BUTTONS ───
  document.getElementById('mini-play').addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
  document.getElementById('mini-prev').addEventListener('click', (e) => { e.stopPropagation(); playPrev(); });
  document.getElementById('mini-next').addEventListener('click', (e) => { e.stopPropagation(); playNext(); });
  document.getElementById('fp-play').addEventListener('click', togglePlay);
  document.getElementById('fp-prev').addEventListener('click', playPrev);
  document.getElementById('fp-next').addEventListener('click', playNext);
  document.getElementById('fp-like-btn').addEventListener('click', () => { if (currentTrack) toggleLike(currentTrack.id); });
  document.getElementById('fp-channel-btn').addEventListener('click', () => { window.open(CHANNEL_URL, '_blank'); });

  // ─── OPEN / CLOSE FULL PLAYER ───
  document.getElementById('mini-player').addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    openFullPlayer();
  });
  document.getElementById('open-full-btn').addEventListener('click', (e) => { e.stopPropagation(); openFullPlayer(); });
  document.getElementById('fp-close-btn').addEventListener('click', closeFullPlayer);
  document.getElementById('fp-handle').addEventListener('click', closeFullPlayer);

  function openFullPlayer() {
    fullPlayer.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeFullPlayer() {
    fullPlayer.classList.remove('open');
    document.body.style.overflow = '';
  }

  // Swipe down to close
  let touchStartY = 0;
  fullPlayer.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
  fullPlayer.addEventListener('touchend', (e) => {
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (dy > 80) closeFullPlayer();
  }, { passive: true });

  // ─── SEARCH ───
  searchInput.addEventListener('input', (e) => {
    currentSearch = e.target.value;
    renderTracks();
  });

  // ─── GENRE FILTER ───
  document.querySelectorAll('.genre-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.genre-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.genre;
      currentSearch = '';
      searchInput.value = '';
      renderTracks();
    });
  });

  // ─── TOAST ───
  let toastTimeout;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ─── TELEGRAM WEBAPP ───
  try {
    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#07070d');
      tg.setBackgroundColor('#07070d');
    }
  } catch(e) {}

  // ─── INIT ───
  queue = [...TRACKS];
  renderTracks();

  // Hide loader
  setTimeout(() => {
    document.getElementById('loader').classList.add('hidden');
  }, 1200);
</script>
</body>
</html>
