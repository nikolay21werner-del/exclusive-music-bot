<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EXCLUSIVE MUSIC BOT</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
    :root {
      --bg: #0d0d1a;
      --bg2: #12122a;
      --bg3: #1a1a35;
      --card: #1e1e3a;
      --card2: #252548;
      --accent: #f5a623;
      --blue: #4a90e2;
      --purple: #7b5ea7;
      --text: #ffffff;
      --text2: #a0a0c0;
      --text3: #6060a0;
      --border: rgba(255,255,255,0.07);
      --radius: 12px;
      /* Track color — changes per track */
      --tc: #4a90e2;
      --tc2: #7b5ea7;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      padding-bottom: 80px;
      transition: background 0.6s ease;
    }
    button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
    ul { list-style: none; }

    /* ── BG GRADIENT (changes per track) ── */
    .bg-gradient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      transition: background 0.8s ease;
    }

    /* ── HEADER ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(13,13,26,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 14px 16px 0;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .header-menu { display: flex; flex-direction: column; gap: 4px; padding: 4px; }
    .header-menu span { display: block; width: 20px; height: 2px; background: var(--text2); border-radius: 2px; }
    .header-title { font-size: 17px; font-weight: 700; }
    .header-search-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text2); border-radius: 50%;
      transition: color 0.18s;
    }
    .header-search-btn:hover { color: var(--text); }

    .tabs {
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text3);
      border-bottom: 2px solid transparent;
      transition: color 0.18s, border-color 0.18s;
      white-space: nowrap;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .search-bar { display: none; padding: 10px 16px; background: rgba(13,13,26,0.98); }
    .search-bar.show { display: block; }
    .search-inner { position: relative; }
    .search-input {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 24px; padding: 10px 16px 10px 40px;
      font-size: 14px; color: var(--text); outline: none;
      transition: border-color 0.18s;
    }
    .search-input::placeholder { color: var(--text3); }
    .search-input:focus { border-color: rgba(74,90,226,0.5); }
    .search-icon-abs {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%); color: var(--text3); pointer-events: none;
    }

    /* ── CONTENT ── */
    .content { position: relative; z-index: 1; }

    .shuffle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px 8px;
    }
    .shuffle-btn {
      display: flex; align-items: center; gap: 7px;
      font-size: 13px; font-weight: 600; color: var(--text2);
      transition: color 0.18s;
    }
    .shuffle-btn:hover { color: var(--accent); }

    /* ── TRACK LIST ── */
    .track-list { padding: 0 0 4px; }
    .track-row {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .track-row:active { background: rgba(255,255,255,0.04); }
    .track-row.playing { background: rgba(255,255,255,0.05); }

    .track-thumb {
      width: 50px; height: 50px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--bg3), var(--card2));
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
      position: relative; overflow: hidden;
      transition: box-shadow 0.3s;
    }
    .track-row.playing .track-thumb { box-shadow: 0 0 0 2px var(--accent); }
    .thumb-eq {
      display: none; position: absolute; inset: 0;
      background: rgba(13,13,26,0.55);
      align-items: flex-end; justify-content: center; gap: 2px; padding-bottom: 8px;
    }
    .track-row.playing .thumb-eq { display: flex; }
    .teq {
      width: 3px; border-radius: 2px; background: var(--accent);
      animation: teq-b 0.7s ease-in-out infinite alternate;
    }
    .teq:nth-child(1){height:8px;} .teq:nth-child(2){height:14px;animation-delay:0.15s;}
    .teq:nth-child(3){height:10px;animation-delay:0.08s;}
    @keyframes teq-b { from{transform:scaleY(.35)} to{transform:scaleY(1)} }

    .track-info { flex: 1; min-width: 0; }
    .track-name {
      font-size: 14px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.35;
    }
    .track-row.playing .track-name { color: var(--accent); }
    .track-artist-name {
      font-size: 12px; color: var(--text2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
    }
    .track-more { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .track-dur { font-size: 11px; color: var(--text3); font-variant-numeric: tabular-nums; }
    .track-dot-btn {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text3); border-radius: 50%;
      transition: color 0.15s;
    }
    .track-dot-btn:hover { color: var(--text2); }

    .empty-msg { display: none; text-align: center; padding: 48px 20px; color: var(--text3); font-size: 14px; }
    .empty-msg.show { display: block; }

    /* ── MINI PLAYER ── */
    .mini-player {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      padding: 0 0 env(safe-area-inset-bottom, 0px);
    }
    .mini-inner {
      margin: 0 8px 8px;
      background: var(--card2);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px; overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.55);
      cursor: pointer;
    }
    .mini-prog-bar { height: 2px; background: rgba(255,255,255,0.08); }
    .mini-prog-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--tc), var(--accent));
      width: 0%;
      transition: width 0.4s linear, background 0.6s;
    }
    .mini-body { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
    .mini-thumb {
      width: 46px; height: 46px; border-radius: 8px;
      background: linear-gradient(135deg, var(--tc2), var(--tc));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
      transition: background 0.6s;
    }
    .mini-info { flex: 1; min-width: 0; }
    .mini-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-artist { font-size: 11px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-controls { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .mc-btn {
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text2); border-radius: 50%;
      transition: color 0.15s, transform 0.12s;
    }
    .mc-btn:hover { color: var(--text); }
    .mc-btn:active { transform: scale(0.92); }
    .mc-play {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      background: var(--tc);
      box-shadow: 0 2px 14px rgba(0,0,0,0.4);
      transition: transform 0.12s, background 0.6s;
    }
    .mc-play:hover { transform: scale(1.06); }
    .mc-play:active { transform: scale(0.95); }

    /* ── FULL PLAYER ── */
    .full-player {
      position: fixed; inset: 0; z-index: 200;
      transform: translateY(100%);
      transition: transform 0.42s cubic-bezier(0.16,1,0.3,1);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .full-player.open { transform: translateY(0); }

    /* Dynamic BG inside full player */
    .fp-bg {
      position: absolute; inset: 0; z-index: 0;
      transition: background 0.8s ease;
    }

    .fp-scroll {
      position: relative; z-index: 1;
      flex: 1; overflow-y: auto; scrollbar-width: none;
      display: flex; flex-direction: column;
      padding: 0 24px 36px;
    }
    .fp-scroll::-webkit-scrollbar { display: none; }

    .fp-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0 8px; flex-shrink: 0;
    }
    .fp-down-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.7);
    }
    .fp-top-label { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7); letter-spacing: 0.1em; text-transform: uppercase; }
    .fp-more-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.6); }

    /* ── CIRCLE COVER WITH WAVEFORM RING ── */
    .fp-art-section {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 10px 0 24px;
      position: relative;
    }
    .fp-canvas-wrap {
      position: relative;
      width: 280px; height: 280px;
    }
    #ring-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
    }
    .fp-cover-circle {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 190px; height: 190px;
      border-radius: 50%;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 72px;
      /* Cover background changes per track */
      background: linear-gradient(135deg, var(--tc2), var(--tc));
      transition: background 0.8s;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    /* Pattern lines on cover */
    .fp-cover-circle::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        135deg, transparent, transparent 14px,
        rgba(255,255,255,0.05) 14px, rgba(255,255,255,0.05) 16px
      );
    }
    .fp-cover-emoji { position: relative; z-index: 1; font-size: 70px; transition: opacity 0.3s; }

    /* Track nav arrows on sides of cover */
    .fp-side-prev, .fp-side-next {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.5);
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      transition: color 0.2s, background 0.2s;
    }
    .fp-side-prev { left: -2px; }
    .fp-side-next { right: -2px; }
    .fp-side-prev:hover, .fp-side-next:hover { color: #fff; background: rgba(255,255,255,0.14); }

    /* ── TRACK INFO ── */
    .fp-info {
      text-align: center; margin-bottom: 8px; flex-shrink: 0;
    }
    .fp-track-name {
      font-size: 19px; font-weight: 700; color: var(--text);
      line-height: 1.3; margin-bottom: 5px;
    }
    .fp-track-artist { font-size: 14px; color: rgba(255,255,255,0.65); font-weight: 400; }

    /* ── ACTIONS ── */
    .fp-actions-row {
      display: flex; align-items: center; justify-content: center;
      gap: 28px; margin: 14px 0; flex-shrink: 0;
    }
    .fp-act { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.5); border-radius: 50%; transition: color 0.15s; }
    .fp-act:hover { color: rgba(255,255,255,0.9); }
    .fp-act.liked { color: #e74c6a; }
    .fp-act-label { font-size: 10px; color: rgba(255,255,255,0.45); text-align: center; letter-spacing: 0.06em; }
    .fp-act-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }

    /* ── PROGRESS ── */
    .fp-prog-wrap { margin-bottom: 16px; flex-shrink: 0; }
    .fp-prog-bar {
      position: relative; height: 4px;
      background: rgba(255,255,255,0.12);
      border-radius: 4px; margin-bottom: 8px; cursor: pointer;
    }
    .fp-prog-fill {
      height: 100%; border-radius: 4px;
      background: var(--tc);
      width: 0%; position: relative;
      transition: width 0.3s linear, background 0.6s;
    }
    .fp-prog-thumb {
      position: absolute; right: -7px; top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px rgba(0,0,0,0.4);
      opacity: 0; transition: opacity 0.15s;
    }
    .fp-prog-bar:hover .fp-prog-thumb { opacity: 1; }
    .fp-times {
      display: flex; justify-content: space-between;
      font-size: 11px; color: rgba(255,255,255,0.45);
      font-variant-numeric: tabular-nums;
    }

    /* ── CONTROLS ── */
    .fp-controls {
      display: flex; align-items: center; justify-content: center;
      gap: 18px; margin-bottom: 24px; flex-shrink: 0;
    }
    .fp-ctrl {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.5); border-radius: 50%;
      transition: color 0.15s, transform 0.12s;
    }
    .fp-ctrl:hover { color: rgba(255,255,255,0.9); transform: scale(1.08); }
    .fp-ctrl:active { transform: scale(0.93); }
    .fp-ctrl.active { color: var(--tc); }
    .fp-play-main {
      width: 68px; height: 68px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      background: var(--tc);
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      transition: transform 0.12s, background 0.6s, box-shadow 0.3s;
    }
    .fp-play-main:hover { transform: scale(1.05); }
    .fp-play-main:active { transform: scale(0.95); }

    /* Bottom row */
    .fp-bottom-row {
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .fp-bot-btn {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.45);
      transition: color 0.15s;
    }
    .fp-bot-btn:hover { color: rgba(255,255,255,0.8); }
    .fp-bot-btn.active { color: var(--tc); }

    /* Counter */
    .fp-counter {
      font-size: 12px; color: rgba(255,255,255,0.4);
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 90px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--card2); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px; padding: 9px 18px;
      font-size: 13px; font-weight: 500; color: var(--text);
      z-index: 400; opacity: 0;
      transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
      pointer-events: none; white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--card2); border-radius: 3px; }
  </style>
</head>
<body>

  <div class="ld-bars">
    <div class="ld-bar"></div><div class="ld-bar"></div>
    <div class="ld-bar"></div><div class="ld-bar"></div><div class="ld-bar"></div>
  </div>
  <div class="ld-subtitle">EXCLUSIVE MUSIC REMIX</div>
</div>

<!-- Dynamic background -->
<div class="bg-gradient" id="bg-gradient"></div>

<!-- Header -->
<div class="header">
  <div class="header-top">
    <button class="header-menu"><span></span><span></span><span></span></button>
    <div class="header-title">Music Player</div>
    <button class="header-search-btn" id="search-toggle-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="songs">Songs</button>
    <button class="tab-btn" data-tab="remix">Remix 🔥</button>
    <button class="tab-btn" data-tab="love">Love ❤️</button>
    <button class="tab-btn" data-tab="hiphop">Hip-Hop 🎤</button>
    <button class="tab-btn" data-tab="electronic">Electronic ⚡</button>
    <button class="tab-btn" data-tab="winter">Winter ❄️</button>
  </div>
</div>

<!-- Search -->
<div class="search-bar" id="search-bar">
  <div class="search-inner">
    <svg class="search-icon-abs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" id="search-input" type="text" placeholder="Поиск..." autocomplete="off">
  </div>
</div>

<!-- Content -->
<div class="content" style="position:relative;z-index:1">
  <div class="shuffle-row">
    <button class="shuffle-btn" id="shuffle-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
      Play shuffle
    </button>
  </div>
  <ul class="track-list" id="track-list"></ul>
  <div class="empty-msg" id="empty-msg">Ничего не найдено</div>
</div>

<!-- Mini player -->
<div class="mini-player" id="mini-player" style="display:none">
  <div class="mini-inner" id="mini-inner">
    <div class="mini-prog-bar"><div class="mini-prog-fill" id="mini-prog"></div></div>
    <div class="mini-body">
      <div class="mini-thumb" id="mini-thumb">🎵</div>
      <div class="mini-info">
        <div class="mini-title" id="mini-title">—</div>
        <div class="mini-artist" id="mini-artist">—</div>
      </div>
      <div class="mini-controls">
        <button class="mc-btn" id="mini-prev">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
        </button>
        <button class="mc-play" id="mini-play">
          <svg id="mini-play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
        <button class="mc-btn" id="mini-next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Full player -->
<div class="full-player" id="full-player">
  <div class="fp-bg" id="fp-bg"></div>
  <div class="fp-scroll">
    <!-- Top bar -->
    <div class="fp-topbar">
      <button class="fp-down-btn" id="fp-close">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <span class="fp-top-label">Сейчас играет</span>
      <button class="fp-more-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
    </div>

    <!-- Circle cover + ring canvas -->
    <div class="fp-art-section">
      <div class="fp-canvas-wrap">
        <canvas id="ring-canvas" width="280" height="280"></canvas>
        <!-- Side nav arrows -->
        <button class="fp-side-prev" id="fp-side-prev">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="fp-side-next" id="fp-side-next">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <!-- Circle cover (inside canvas center) -->
        <div class="fp-cover-circle" id="fp-cover-circle">
          <span class="fp-cover-emoji" id="fp-cover-emoji">🎵</span>
        </div>
      </div>
    </div>

    <!-- Track info -->
    <div class="fp-info">
      <div class="fp-track-name" id="fp-name">Выберите трек</div>
      <div class="fp-track-artist" id="fp-artist">—</div>
    </div>

    <!-- Actions -->

<script>
const PROXY = 'https://web-production-6791f.up.railway.app';
const CHANNEL = 'https://t.me/exclusive_music_remix';

// Per-track color palettes (cycles through)
const PALETTES = [
  { c1: '#4a7fe2', c2: '#7b4db0', bg: 'rgba(74,127,226,0.18)', bg2: 'rgba(123,77,176,0.22)' },
  { c1: '#e2834a', c2: '#b04d4d', bg: 'rgba(226,131,74,0.18)', bg2: 'rgba(176,77,77,0.22)' },
  { c1: '#4ae2a8', c2: '#4d7db0', bg: 'rgba(74,226,168,0.15)', bg2: 'rgba(77,125,176,0.22)' },
  { c1: '#e24a8e', c2: '#7b4db0', bg: 'rgba(226,74,142,0.18)', bg2: 'rgba(123,77,176,0.22)' },
  { c1: '#e2d04a', c2: '#e2834a', bg: 'rgba(226,208,74,0.15)', bg2: 'rgba(226,131,74,0.2)' },
  { c1: '#4ae2e2', c2: '#4a7fe2', bg: 'rgba(74,226,226,0.15)', bg2: 'rgba(74,127,226,0.2)' },
  { c1: '#a04ae2', c2: '#e24a8e', bg: 'rgba(160,74,226,0.18)', bg2: 'rgba(226,74,142,0.2)' },
  { c1: '#4ae260', c2: '#4a7fe2', bg: 'rgba(74,226,96,0.15)', bg2: 'rgba(74,127,226,0.2)' },
];

function getPalette(idx) {
  return PALETTES[idx % PALETTES.length];
}

// ── State ──
let currentTrack = null;
let currentIdx = 0;
let isPlaying = false;
let isShuffle = false;
let isRepeat = false;
let currentTab = 'songs';
let searchQuery = '';
let queue = [...TRACKS];
let likes = {};
try { likes = JSON.parse(localStorage.getItem('xm_likes') || '{}'); } catch(e) {}

// ── Audio ──
const audio = new Audio();
audio.crossOrigin = 'anonymous';

// ── Audio context for ring visualizer ──
let audioCtx = null, analyser = null, dataArray = null, audioSrc = null;
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    audioSrc = audioCtx.createMediaElementSource(audio);
    audioSrc.connect(analyser);
    analyser.connect(audioCtx.destination);
  } catch(e) {}
}

// ── Ring canvas ──
const ringCanvas = document.getElementById('ring-canvas');
const ringCtx = ringCanvas.getContext('2d');
const RING_W = 280, RING_H = 280;
ringCanvas.width = RING_W * devicePixelRatio;
ringCanvas.height = RING_H * devicePixelRatio;
ringCtx.scale(devicePixelRatio, devicePixelRatio);
const CX = RING_W / 2, CY = RING_H / 2;
const INNER_R = 97, OUTER_R_BASE = 110;

let ringColor1 = '#4a7fe2', ringColor2 = '#7b4db0';
let ringRAF = null;

function drawRing() {
  ringRAF = requestAnimationFrame(drawRing);
  ringCtx.clearRect(0, 0, RING_W, RING_H);

  const bars = 64;
  const angleStep = (Math.PI * 2) / bars;

  let freqData = new Array(bars).fill(0);
  if (analyser && isPlaying) {
    analyser.getByteFrequencyData(dataArray);
    for (let i = 0; i < bars; i++) {
      freqData[i] = dataArray[Math.floor(i * dataArray.length / bars)] / 255;
    }
  } else {
    // Idle: gentle pulsing wave
    const t = Date.now() / 1000;
    for (let i = 0; i < bars; i++) {
      freqData[i] = 0.08 + Math.sin(i * 0.3 + t * 2.5) * 0.06 + Math.sin(i * 0.6 + t * 1.5) * 0.04;
    }
  }

  for (let i = 0; i < bars; i++) {
    const angle = i * angleStep - Math.PI / 2;
    const val = freqData[i];
    const barH = val * 44 + 4; // 4px min, up to 48px max
    const x1 = CX + Math.cos(angle) * (INNER_R + 2);
    const y1 = CY + Math.sin(angle) * (INNER_R + 2);
    const x2 = CX + Math.cos(angle) * (INNER_R + 2 + barH);
    const y2 = CY + Math.sin(angle) * (INNER_R + 2 + barH);

    // Color interpolation along the ring
    const t = i / bars;
    const grad = ringCtx.createLinearGradient(x1, y1, x2, y2);
    grad.addColorStop(0, hexAlpha(ringColor1, 0.5 + val * 0.4));
    grad.addColorStop(1, hexAlpha(ringColor2, 0.8 + val * 0.2));

    ringCtx.beginPath();
    ringCtx.moveTo(x1, y1);
    ringCtx.lineTo(x2, y2);
    ringCtx.strokeStyle = grad;
    ringCtx.lineWidth = Math.PI * 2 * INNER_R / bars * 0.72;
    ringCtx.lineCap = 'round';
    ringCtx.globalAlpha = 0.7 + val * 0.3;
    ringCtx.stroke();
    ringCtx.globalAlpha = 1;
  }
}
drawRing();

function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── DOM refs ──
const trackList = document.getElementById('track-list');
const emptyMsg = document.getElementById('empty-msg');
const miniPlayerEl = document.getElementById('mini-player');
const miniThumb = document.getElementById('mini-thumb');
const miniTitle = document.getElementById('mini-title');
const miniArtist = document.getElementById('mini-artist');
const miniProg = document.getElementById('mini-prog');
const miniPlayIcon = document.getElementById('mini-play-icon');
const fpName = document.getElementById('fp-name');
const fpArtist = document.getElementById('fp-artist');
const fpProgFill = document.getElementById('fp-prog-fill');
const fpCur = document.getElementById('fp-cur');
const fpDur = document.getElementById('fp-dur');
const fpPlayIcon = document.getElementById('fp-play-icon');
const fullPlayerEl = document.getElementById('full-player');
const fpLikeBtn = document.getElementById('fp-like-btn');
const fpBg = document.getElementById('fp-bg');
const bgGradientEl = document.getElementById('bg-gradient');
const fpCoverCircle = document.getElementById('fp-cover-circle');
const fpCoverEmoji = document.getElementById('fp-cover-emoji');
const fpCounter = document.getElementById('fp-counter');
const fpPlayMain = document.getElementById('fp-play-main') || document.querySelector('.fp-play-main');

// ── Helpers ──
function fmt(s) { s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function emojiFor(g) { return {remix:'🔥',love:'❤️',hiphop:'🎤',electronic:'⚡',winter:'❄️',city:'🏙️'}[g]||'🎵'; }

// ── Apply palette ──
function applyPalette(trackIndexInAll) {
  const p = getPalette(trackIndexInAll);
  ringColor1 = p.c1;
  ringColor2 = p.c2;

  // CSS vars for buttons etc
  document.documentElement.style.setProperty('--tc', p.c1);
  document.documentElement.style.setProperty('--tc2', p.c2);

  // BG gradient (list screen)
  bgGradientEl.style.background = `
    radial-gradient(ellipse 70% 45% at 15% 5%, ${p.bg} 0%, transparent 70%),
    radial-gradient(ellipse 55% 55% at 88% 85%, ${p.bg2} 0%, transparent 65%),
    radial-gradient(ellipse 40% 35% at 55% 45%, rgba(0,0,0,0) 0%, transparent 60%)
  `;

  // Full player BG
  fpBg.style.background = `
    radial-gradient(ellipse 85% 60% at 50% -5%, ${p.bg} 0%, transparent 65%),
    radial-gradient(ellipse 65% 55% at 15% 100%, ${p.bg2} 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 50%, ${hexAlpha(p.c1, 0.08)} 0%, transparent 55%),
    #0d0d1a
  `;

  // Cover circle
  fpCoverCircle.style.background = `linear-gradient(135deg, ${p.c2}, ${p.c1})`;
  miniThumb.style.background = `linear-gradient(135deg, ${p.c2}, ${p.c1})`;

  // Progress fill
  fpProgFill.style.background = p.c1;
  miniProg.style.background = `linear-gradient(90deg, ${p.c1}, ${p.c2})`;

  // Play buttons
  document.querySelector('.fp-play-main').style.background = p.c1;
  document.querySelector('.fp-play-main').style.boxShadow = `0 4px 24px ${hexAlpha(p.c1, 0.45)}`;
  document.querySelector('.mc-play').style.background = p.c1;
}

// ── Render list ──
function getFiltered() {
  return TRACKS.filter(t => {
    const mt = currentTab === 'songs' || t.genre === currentTab;
    const q = searchQuery.toLowerCase();
    return mt && (!q || t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q));
  });
}

function renderList() {
  const list = getFiltered();
  emptyMsg.classList.toggle('show', list.length === 0);
  trackList.innerHTML = '';
  list.forEach(t => {
    const playing = currentTrack && currentTrack.id === t.id;
    const li = document.createElement('li');
    li.className = 'track-row' + (playing ? ' playing' : '');
    li.innerHTML = `
      <div class="track-thumb">
        <span>${emojiFor(t.genre)}</span>
        <div class="thumb-eq"><div class="teq"></div><div class="teq"></div><div class="teq"></div></div>
      </div>
      <div class="track-info">
        <div class="track-name">${t.title}</div>
        <div class="track-artist-name">${t.artist}</div>
      </div>
      <div class="track-more">
        <span class="track-dur">${fmt(t.duration)}</span>
        <button class="track-dot-btn" data-id="${t.id}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        </button>
      </div>
    `;
    li.addEventListener('click', e => {
      if (e.target.closest('.track-dot-btn')) { toggleLike(t.id); return; }
      queue = getFiltered();
      const qi = queue.findIndex(x => x.id === t.id);
      playTrack(t, qi);
    });
    trackList.appendChild(li);
  });
}

// ── Play ──
function playTrack(track, qIdx) {
  currentTrack = track;
  currentIdx = qIdx !== undefined ? qIdx : queue.findIndex(x => x.id === track.id);

  // Apply palette based on track's position in ALL tracks
  const allIdx = TRACKS.findIndex(x => x.id === track.id);
  applyPalette(allIdx);

  audio.src = PROXY + '/audio/' + encodeURIComponent(track.file_id);
  audio.load();
  audio.play()
    .then(() => {
      initAudio();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      setPlaying(true);
    })
    .catch(() => showToast('⚠️ Ошибка воспроизведения'));

  updateUI();
  miniPlayerEl.style.display = 'block';
  renderList();
}

function setPlaying(v) {
  isPlaying = v;
  const pause = `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`;
  const play = `<polygon points="5 3 19 12 5 21 5 3"/>`;
  const ic = v ? pause : play;
  miniPlayIcon.innerHTML = ic;
  fpPlayIcon.innerHTML = ic;
}

function updateUI() {
  if (!currentTrack) return;
  const e = emojiFor(currentTrack.genre);
  miniTitle.textContent = currentTrack.title;
  miniArtist.textContent = currentTrack.artist;
  miniThumb.textContent = e;
  fpCoverEmoji.textContent = e;
  fpName.textContent = currentTrack.title;
  fpArtist.textContent = currentTrack.artist;
  fpDur.textContent = fmt(currentTrack.duration);
  // Counter
  const qi = queue.findIndex(x => x.id === currentTrack.id);
  fpCounter.textContent = (qi + 1) + ' / ' + queue.length;
  updateLikeBtn();
}

function updateLikeBtn() {
  if (!currentTrack) return;
  const liked = !!likes[currentTrack.id];
  fpLikeBtn.innerHTML = liked
    ? `<svg width="22" height="22" viewBox="0 0 24 24" fill="#e74c6a" stroke="#e74c6a" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`
    : `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
}

function togglePlay() {
  if (!currentTrack) { if (TRACKS.length) { queue=[...TRACKS]; playTrack(TRACKS[0],0); } return; }
  if (isPlaying) { audio.pause(); setPlaying(false); }
  else {
    initAudio();
    audio.play().then(() => { if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); setPlaying(true); }).catch(()=>{});
  }
}

function playNext() {
  if (!queue.length) return;
  let ni = isShuffle ? Math.floor(Math.random()*queue.length) : (currentIdx+1)%queue.length;
  playTrack(queue[ni], ni);
}
function playPrev() {
  if (audio.currentTime > 3) { audio.currentTime=0; return; }
  const pi = (currentIdx-1+queue.length)%queue.length;
  playTrack(queue[pi], pi);
}

function toggleLike(id) {
  if (likes[id]) delete likes[id]; else likes[id]=true;
  try { localStorage.setItem('xm_likes', JSON.stringify(likes)); } catch(e) {}
  updateLikeBtn();
  showToast(likes[id] ? '❤️ Добавлено' : 'Убрано из избранного');
}

// ── Audio events ──
audio.addEventListener('ended', ()=>{ if(isRepeat){audio.currentTime=0;audio.play();}else playNext(); });
audio.addEventListener('timeupdate', ()=>{
  if (!audio.duration) return;
  const p = (audio.currentTime/audio.duration)*100;
  miniProg.style.width = p+'%';
  fpProgFill.style.width = p+'%';
  fpCur.textContent = fmt(audio.currentTime);
});
audio.addEventListener('error', ()=>{ showToast('⚠️ Не удалось загрузить трек'); setPlaying(false); });

// ── Seek ──
document.getElementById('fp-prog-bar').addEventListener('click', e=>{
  if (!audio.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX-r.left)/r.width)*audio.duration;
});

// ── Buttons ──
document.getElementById('mini-play').addEventListener('click', e=>{ e.stopPropagation(); togglePlay(); });
document.getElementById('mini-prev').addEventListener('click', e=>{ e.stopPropagation(); playPrev(); });
document.getElementById('mini-next').addEventListener('click', e=>{ e.stopPropagation(); playNext(); });
document.getElementById('fp-play').addEventListener('click', togglePlay);
document.getElementById('fp-prev').addEventListener('click', playPrev);
document.getElementById('fp-next').addEventListener('click', playNext);
document.getElementById('fp-side-prev').addEventListener('click', playPrev);
document.getElementById('fp-side-next').addEventListener('click', playNext);
document.getElementById('fp-like-btn').addEventListener('click', ()=>{ if(currentTrack) toggleLike(currentTrack.id); });
document.getElementById('fp-channel-btn').addEventListener('click', ()=> window.open(CHANNEL,'_blank'));

document.getElementById('fp-shuffle-btn').addEventListener('click', ()=>{
  isShuffle=!isShuffle;
  document.getElementById('fp-shuffle-btn').classList.toggle('active', isShuffle);
  showToast(isShuffle?'🔀 Перемешать вкл':'🔀 Выкл');
});
document.getElementById('fp-repeat-btn').addEventListener('click', ()=>{
  isRepeat=!isRepeat;
  document.getElementById('fp-repeat-btn').classList.toggle('active', isRepeat);
  showToast(isRepeat?'🔁 Повтор вкл':'🔁 Выкл');
});
document.getElementById('shuffle-btn').addEventListener('click', ()=>{
  isShuffle=true; queue=[...TRACKS].sort(()=>Math.random()-0.5);
  playTrack(queue[0],0); showToast('🔀 Случайное воспроизведение');
});

// ── Full player open/close ──
document.getElementById('mini-inner').addEventListener('click', e=>{
  if (e.target.closest('button')) return;
  fullPlayerEl.classList.add('open');
  document.body.style.overflow='hidden';
});
document.getElementById('fp-close').addEventListener('click', ()=>{
  fullPlayerEl.classList.remove('open');
  document.body.style.overflow='';
});
let tsy=0;
fullPlayerEl.addEventListener('touchstart', e=>{ tsy=e.touches[0].clientY; },{passive:true});
fullPlayerEl.addEventListener('touchend', e=>{
  if (e.changedTouches[0].clientY-tsy>90) { fullPlayerEl.classList.remove('open'); document.body.style.overflow=''; }
},{passive:true});

// ── Tabs ──
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTab=btn.dataset.tab;
    searchQuery=''; document.getElementById('search-input').value='';
    renderList();
  });
});

// ── Search ──
document.getElementById('search-toggle-btn').addEventListener('click', ()=>{
  const bar=document.getElementById('search-bar');
  bar.classList.toggle('show');
  if (bar.classList.contains('show')) document.getElementById('search-input').focus();
  else { searchQuery=''; document.getElementById('search-input').value=''; renderList(); }
});
document.getElementById('search-input').addEventListener('input', e=>{ searchQuery=e.target.value; renderList(); });

// ── Toast ──
let toastT;
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400);
}

// ── Telegram ──
try {
  if (window.Telegram&&window.Telegram.WebApp) {
    const tg=window.Telegram.WebApp;
    tg.ready(); tg.expand();
    tg.setHeaderColor('#0d0d1a');
    tg.setBackgroundColor('#0d0d1a');
  }
} catch(e) {}

// ── Init ──
queue=[...TRACKS];
applyPalette(0); // default palette
renderList();

</script>
