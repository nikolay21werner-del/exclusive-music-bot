<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;}
#splash{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:0;
  width:390px;height:844px;
  background:#000;
}
.splash-badge{
  width:140px;height:140px;
  border-radius:50%;
  background:radial-gradient(circle at 40% 35%, #0a1628 0%, #000510 100%);
  border:2.5px solid rgba(0,180,255,0.35);
  box-shadow:0 0 60px rgba(0,180,255,0.35), 0 0 0 1px rgba(0,180,255,0.25), inset 0 0 40px rgba(0,180,255,0.12);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;
}
.splash-badge::before{
  content:'';
  position:absolute;inset:-6px;
  border-radius:50%;
  border:1.5px dashed rgba(0,180,255,0.25);
}
.splash-crown{
  font-size:22px;line-height:1;margin-bottom:4px;
  filter:drop-shadow(0 0 12px rgba(0,180,255,1));
}
.splash-e{
  font-size:36px;font-weight:900;
  color:#00B4FF;letter-spacing:-1px;line-height:1;
  text-shadow:0 0 20px rgba(0,180,255,0.9), 0 0 40px rgba(0,180,255,0.4);
}
.splash-title{margin-top:28px;text-align:center;}
.splash-title .line1{font-size:11px;font-weight:600;letter-spacing:6px;color:rgba(255,255,255,0.35);text-transform:uppercase;}
.splash-title .line2{font-size:28px;font-weight:800;letter-spacing:1px;color:#fff;text-transform:uppercase;line-height:1.1;margin:4px 0 2px;text-shadow:0 0 30px rgba(0,180,255,0.3);}
.splash-title .line3{font-size:13px;font-weight:600;letter-spacing:8px;color:#00B4FF;text-transform:uppercase;text-shadow:0 0 12px rgba(0,180,255,0.6);}
.splash-loader{margin-top:36px;width:120px;height:2px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;}
.splash-loader-bar{height:100%;width:65%;background:linear-gradient(90deg,#0066cc,#00B4FF,#66d9ff);border-radius:2px;box-shadow:0 0 8px rgba(0,180,255,0.8);}
.splash-dots{margin-top:14px;display:flex;gap:6px;}
.splash-dots span{width:5px;height:5px;border-radius:50%;background:#00B4FF;}
.splash-dots span:nth-child(1){opacity:1;}
.splash-dots span:nth-child(2){opacity:0.6;}
.splash-dots span:nth-child(3){opacity:0.3;}
</style>
</head>
<body>
<div id="splash">
  <div class="splash-badge">
    <div class="splash-crown">👑</div>
    <div class="splash-e">E</div>
  </div>
  <div class="splash-title">
    <div class="line1">Channel</div>
    <div class="line2">Exclusive<br>Music</div>
    <div class="line3">Remix</div>
  </div>
  <div class="splash-loader"><div class="splash-loader-bar"></div></div>
  <div class="splash-dots"><span></span><span></span><span></span></div>
</div>
</body>
</html>
